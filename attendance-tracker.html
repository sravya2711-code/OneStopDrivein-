<link rel="preconnect" href="https://identitytoolkit.googleapis.com" crossorigin>
<style>
  :root{
    --teal-900:#0F3630;
    --teal-800:#16423C;
    --teal-700:#1F5A50;
    --gold-500:#D9A227;
    --gold-600:#B9860F;
    --paper:#FAF6ED;
    --card:#FFFFFF;
    --ink:#2B2620;
    --ink-soft:#6B6255;
    --line:#E8E0CE;
    --present:#4C7A51;
    --half:#D9A227;
    --absent:#B84C3E;
    --danger:#B84C3E;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:'Noto Sans Telugu','Noto Sans',system-ui,-apple-system,sans-serif;
    -webkit-font-smoothing:antialiased;
    padding-bottom:78px;
    min-height:100vh;
  }
  h1,h2,h3,.display{font-family:'Poppins','Noto Sans Telugu',sans-serif;}

  header{
    background:var(--teal-800);
    color:#fff;
    padding:18px 18px 22px;
    position:sticky; top:0; z-index:30;
    box-shadow:0 4px 14px rgba(15,54,48,0.18);
  }
  header .brand{font-size:12px; letter-spacing:.14em; text-transform:uppercase; opacity:.72; font-weight:600;}
  header h1{font-size:20px; margin:2px 0 0; font-weight:700;}
  header .sub{font-size:13px; opacity:.78; margin-top:2px;}
  .sync-status{font-size:11px; margin-top:6px; opacity:.9; display:flex; align-items:center; gap:5px;}
  .sync-status::before{content:'●'; font-size:9px;}
  .sync-status.ok{color:#BFE8C4;}
  .sync-status.ok::before{color:#6FD17E;}
  .sync-status.bad{color:#F3CFC5;}
  .sync-status.bad::before{color:#E8836C;}

  .period-strip{
    display:flex; align-items:center; gap:8px;
    margin-top:14px; background:rgba(255,255,255,0.08);
    border-radius:12px; padding:8px 10px;
  }
  .period-strip button{
    background:rgba(255,255,255,0.14); border:none; color:#fff;
    width:32px; height:32px; border-radius:8px; font-size:16px;
    display:flex; align-items:center; justify-content:center;
  }
  .period-strip .period-label{flex:1; text-align:center; font-size:13.5px; font-weight:600;}
  .period-strip .period-label .range{display:block; font-size:11.5px; font-weight:400; opacity:.75; margin-top:1px;}

  .daydots{display:flex; gap:5px; margin-top:12px; overflow-x:auto; padding-bottom:2px;}
  .daydot{
    flex:0 0 auto; width:30px; text-align:center; font-size:10.5px;
    color:rgba(255,255,255,0.85);
  }
  .daydot .dow{opacity:.6; font-size:9.5px;}
  .daydot .num{
    width:26px; height:26px; margin:2px auto 0; border-radius:8px;
    display:flex; align-items:center; justify-content:center;
    background:rgba(255,255,255,0.10); font-weight:600;
  }
  .daydot.today .num{outline:2px solid var(--gold-500); outline-offset:1px;}
  .daydot.selected .num{background:var(--gold-500); color:var(--teal-900);}

  main{padding:16px; max-width:520px; margin:0 auto;}
  .card{
    background:var(--card); border-radius:16px; padding:14px 14px;
    box-shadow:0 1px 3px rgba(43,38,32,0.06); margin-bottom:12px;
    border:1px solid var(--line);
  }
  .worker-row{display:flex; align-items:center; gap:10px; padding:8px 2px;}
  .worker-row + .worker-row{border-top:1px solid var(--line);}
  .avatar{
    width:38px; height:38px; border-radius:50%; background:var(--teal-800); color:#fff;
    display:flex; align-items:center; justify-content:center; font-weight:700; font-size:14px; flex:0 0 auto;
  }
  .wname{font-weight:600; font-size:14.5px;}
  .wname .en{display:block; font-size:11px; color:var(--ink-soft); font-weight:400;}
  .status-btns{display:flex; gap:5px; margin-left:auto;}
  .sbtn{
    border:1.5px solid var(--line); background:#fff; color:var(--ink-soft);
    border-radius:9px; padding:7px 9px; font-size:12px; font-weight:600;
    min-width:44px;
  }
  .sbtn.p.active{background:var(--present); border-color:var(--present); color:#fff;}
  .sbtn.h.active{background:var(--half); border-color:var(--half); color:#fff;}
  .sbtn.a.active{background:var(--absent); border-color:var(--absent); color:#fff;}

  .section-title{font-size:13px; text-transform:uppercase; letter-spacing:.08em; color:var(--ink-soft); font-weight:700; margin:6px 2px 8px;}

  .salary-card .top{display:flex; align-items:center; gap:10px;}
  .salary-card .rate-input{
    margin-left:auto; text-align:right;
  }
  .rate-input input{
    width:92px; padding:6px 8px; border:1.5px solid var(--line); border-radius:8px;
    font-size:13px; text-align:right; font-family:inherit; color:var(--ink);
  }
  .rate-input label{display:block; font-size:10px; color:var(--ink-soft); margin-bottom:2px;}
  .edit-pencil{font-size:12px; margin-left:6px; color:var(--gold-600); cursor:pointer; user-select:none;}
  .tr-btn{margin-top:6px; border:1.5px solid var(--line); border-radius:9px; padding:8px 12px; font-size:12px; font-weight:700; color:var(--teal-800); background:var(--paper); font-family:inherit; cursor:pointer;}
  .tr-status{font-size:11px; color:var(--ink-soft); margin-left:8px;}
  .breakdown{margin-top:10px; padding-top:10px; border-top:1px dashed var(--line); font-size:13px;}
  .breakdown .row{display:flex; justify-content:space-between; padding:3px 0; color:var(--ink-soft);}
  .breakdown .row.net{color:var(--ink); font-weight:700; font-size:15px; border-top:1px solid var(--line); margin-top:4px; padding-top:7px;}
  .breakdown .row.net .amt{color:var(--teal-800);}
  .pill{display:inline-block; padding:1px 7px; border-radius:20px; font-size:11px; font-weight:600; margin-left:6px;}
  .pill.present{background:#E5F0E4; color:var(--present);}
  .pill.half{background:#FBF0DA; color:var(--gold-600);}
  .pill.absent{background:#F6E2DD; color:var(--absent);}
  .absdates{font-size:11.5px; background:#FBECE8; border:1px solid #EBC9C0; border-radius:9px;
    padding:6px 9px; margin:4px 0 2px; line-height:1.55; color:#8A3B2A;}
  .absdates b{color:#7A2A1A;}
  .breakdown .row.warn{color:#B4472A;}
  /* Triveni / Laxman: absences shown, never charged */
  .breakdown .row.exempt-row{color:var(--present); background:#EEF5EE; border:1px solid #D5E5D6;
    border-radius:8px; padding:6px 9px; margin:3px 0; align-items:center;}
  .breakdown .row.exempt-row span:last-child{font-weight:700; white-space:nowrap; padding-left:8px;}
  .pill.exempt{background:#E4F0E5; color:var(--present);}
  .breakdown .row.warn span:last-child{font-weight:700;}
  .wtab-intro{font-size:12.5px; color:var(--ink); background:#FFF8EC; border:1px solid #F0E0C0;
    border-radius:10px; padding:9px 11px; margin-bottom:12px; line-height:1.6;}
  .wcount-grid{display:flex; flex-wrap:wrap; gap:7px; margin-bottom:14px;}
  .wcount-chip{display:flex; align-items:center; gap:6px; background:var(--card);
    border:1px solid var(--line); border-radius:22px; padding:4px 10px 4px 5px; font-size:12px;
    color:var(--ink); font-family:inherit; cursor:pointer;}
  .wcount-chip .avatar{width:24px; height:24px; font-size:12px;}
  .wcount-chip .n{font-weight:700; min-width:12px; text-align:center;}
  .wlog-item{display:flex; align-items:center; gap:10px; padding:9px 2px; border-bottom:1px solid var(--line);}
  .wlog-item:last-child{border-bottom:0;}
  .wlog-item .meta{flex:1; min-width:0;}
  .wlog-del{border:0; background:transparent; color:var(--absent); font-size:17px; padding:2px 8px; cursor:pointer;}
  .wn-hint{font-size:12px; color:var(--gold-600); background:#FFF8EC; border-radius:8px;
    padding:7px 9px; margin:-2px 0 10px; line-height:1.5;}

  /* closed / former staff */
  .pill.closed{background:#EDE7DA; color:var(--ink-soft);}
  .worker-row.is-closed{opacity:.7;}
  .worker-row.is-closed .avatar{background:var(--ink-soft);}
  .w-close{background:none; border:1.5px solid var(--line); border-radius:9px;
    padding:7px 9px; font-size:14px; line-height:1; color:var(--ink-soft); flex:0 0 auto;}
  .closed-acts{display:flex; flex-direction:column; gap:5px; flex:0 0 auto;}
  .closed-acts button{border:1.5px solid var(--line); background:#fff; border-radius:9px;
    padding:5px 8px; font-size:11px; font-weight:700; font-family:inherit; color:var(--teal-800);
    line-height:1.25; text-align:center;}
  .closed-acts button span{display:block; font-size:9px; font-weight:400; opacity:.65;}
  .closed-acts .w-erase{color:var(--absent); border-color:#EBC9C0;}
  .closed-acts .w-erase.is-locked{color:var(--ink-soft); border-color:var(--line); opacity:.65;}
  .closed-note{font-size:11.5px; color:var(--ink-soft); background:#F3EEE1; border-radius:9px;
    padding:8px 10px; margin-top:10px; line-height:1.5;}
  .closed-note span{display:block; font-size:10.5px; opacity:.75; margin-top:2px;}
  .closed-note .cn-row{display:flex; align-items:center; gap:10px;}
  .closed-note .cn-row > div{flex:1; min-width:0;}
  .cn-toggle{flex:0 0 auto; border:1.5px solid var(--line); background:#fff; border-radius:9px;
    padding:6px 10px; font-size:11.5px; font-weight:700; font-family:inherit; color:var(--teal-800);
    line-height:1.25; text-align:center;}
  .cn-toggle span{display:block; font-size:9px; font-weight:400; opacity:.65; margin-top:1px;}
  .final-banner{display:flex; gap:8px; align-items:flex-start; font-size:12.5px; line-height:1.5;
    background:#F3EEE1; border:1px solid #E0D6C0; border-radius:10px; padding:8px 10px; margin-bottom:10px;
    color:#5B5140;}
  .final-banner.join{background:#EFF7EF; border-color:#C6E1C8; color:var(--present);}
  .final-banner .en2{display:block; font-size:10.5px; opacity:.75; margin-top:1px;}
  .salary-card.is-final{border-color:#E0D6C0;}
  .keep-note{font-size:12.5px; line-height:1.55; background:#EFF7EF; border:1px solid #C6E1C8;
    border-radius:10px; padding:9px 11px; margin-bottom:12px; color:#2F5A38;}
  .warn-note{font-size:12.5px; line-height:1.55; background:#FBECE8; border:1px solid #EBC9C0;
    border-radius:10px; padding:9px 11px; margin-bottom:12px; color:#8A3B2A;}
  .warn-note .chk{display:flex; gap:7px; align-items:flex-start; margin-top:7px; font-weight:600;}
  .warn-note .chk input{margin-top:3px; flex:0 0 auto; width:18px; height:18px;}
  .en2{display:block; font-size:10.5px; font-weight:400; opacity:.8; margin-top:2px;}
  .fieldhint{font-size:11px; color:var(--ink-soft); line-height:1.45; margin-top:4px;}

  .add-advance-btn{
    width:100%; padding:10px; margin-top:10px; border:1.5px dashed var(--gold-600);
    background:#FDF7E9; color:var(--gold-600); border-radius:10px; font-weight:700; font-size:13px;
  }

  /* ---- canteen: cool drinks / food taken by staff ---- */
  .ct-grid{display:flex; flex-direction:column; gap:7px; margin-bottom:12px;}
  .ct-chip{display:flex; align-items:center; gap:10px; width:100%; text-align:left;
    background:var(--card); border:1.5px solid var(--line); border-radius:12px;
    padding:9px 12px 9px 9px; font-family:inherit; font-size:13.5px; color:var(--ink); cursor:pointer;}
  .ct-chip.has{border-color:#EBC9C0; background:#FDF4F1;}
  .ct-chip .avatar{flex:0 0 auto;}
  .ct-chip-name{flex:1; min-width:0; font-weight:700; line-height:1.25;}
  .ct-chip-name .en{display:block; font-size:10.5px; font-weight:400; color:var(--ink-soft); margin-top:1px;}
  .ct-chip-amt{flex:0 0 auto; font-weight:700; font-size:13.5px; color:var(--absent);}
  .ct-chip:not(.has) .ct-chip-amt{color:var(--ink-soft); font-weight:600;}
  .ct-total-bar{display:flex; justify-content:space-between; align-items:center;
    background:#FBEFEC; border:1px solid #EBC9C0; border-radius:10px; padding:10px 12px;
    font-size:13px; font-weight:700; color:var(--absent);}
  .ct-entry{padding:10px 2px; border-bottom:1px solid var(--line);}
  .ct-entry:last-child{border-bottom:0;}
  .ct-entry-head{display:flex; align-items:center; gap:10px;}
  .ct-entry-head .meta{flex:1; min-width:0;}
  .ct-entry-amt{flex:0 0 auto; font-weight:700; font-size:13.5px; color:var(--absent);}
  .ct-lines{margin:6px 0 0 34px;}
  .ct-line{display:flex; justify-content:space-between; gap:10px; font-size:12px;
    color:var(--ink-soft); padding:3px 0; line-height:1.4;}
  .ct-line span:last-child{flex:0 0 auto; font-weight:600; color:var(--ink);}
  .ct-row{border:1.5px solid var(--line); border-radius:12px; padding:10px; margin-bottom:9px;
    background:var(--paper);}
  .ct-row-head{display:flex; gap:8px; align-items:center; margin-bottom:8px;}
  .ct-row-head select{flex:1; padding:8px 9px; border:1.5px solid var(--line); border-radius:9px;
    font-size:13px; font-family:inherit; color:var(--ink); background:#fff;}
  .ct-row-del{flex:0 0 auto; border:1.5px solid var(--line); background:#fff; border-radius:9px;
    color:var(--absent); font-size:14px; padding:7px 10px; line-height:1; cursor:pointer;}
  .ct-row > .ct-label{width:100%; padding:9px 10px; border:1.5px solid var(--line); border-radius:9px;
    font-size:13.5px; font-family:inherit; color:var(--ink); background:#fff; margin-bottom:8px;}
  .ct-row-nums{display:flex; gap:8px; align-items:flex-end;}
  .ct-row-nums > div{flex:1; min-width:0;}
  .ct-row-nums label{display:block; font-size:10.5px; color:var(--ink-soft); margin-bottom:3px; font-weight:600;}
  .ct-row-nums input{width:100%; padding:9px 10px; border:1.5px solid var(--line); border-radius:9px;
    font-size:13.5px; font-family:inherit; color:var(--ink); background:#fff; text-align:right;}
  .ct-row-sub{flex:0 0 82px; text-align:right;}
  .ct-row-sub .ct-sub{display:block; padding:9px 4px; font-size:13.5px; font-weight:700; color:var(--ink);}
  .ct-modal-total{display:flex; justify-content:space-between; align-items:center; margin-top:12px;
    padding:11px 12px; background:#FBEFEC; border:1px solid #EBC9C0; border-radius:10px;
    font-size:14.5px; font-weight:700; color:var(--absent);}
  .breakdown .row.canteen-row{cursor:pointer;}
  .modal h3 .en2{margin-top:3px;}
  .btn.primary:disabled{opacity:.45;}
  .tip-row .tipwrap{ display:inline-flex; align-items:center; gap:2px; color:var(--present); font-weight:700; }
  .tip-row input{
    width:70px; padding:3px 6px; border:1.5px solid var(--line); border-radius:6px;
    font-size:13px; text-align:right; font-family:inherit; color:var(--ink);
  }
  .lx-tot.lx-net{ border-top:1px solid var(--line); margin-top:4px; padding-top:8px; }
  .lx-tot.lx-net span:first-child{ font-weight:700; color:var(--ink); }
  .outstanding-note{
    margin-top:10px; padding:8px 10px; background:#FBEFEC; border-radius:8px;
    font-size:12.5px; color:var(--absent);
  }
  .period-hint{
    margin:-4px 0 10px; padding:7px 9px; border-radius:8px; font-size:11.5px;
    background:#EFF7EF; color:var(--present); line-height:1.45;
  }
  .period-hint.bad{ background:#FBEFEC; color:var(--absent); font-weight:600; }
  .outstanding-note .adj{ display:block; margin-top:3px; font-size:11.5px; opacity:.9; }
  .deduct-btn{
    border-color:var(--present); background:#EFF7EF; color:var(--present); margin-top:8px;
  }
  .pay-btn{
    border:0; background:var(--present); color:#fff; margin-top:8px;
    width:100%; padding:11px; border-radius:10px; font-weight:700; font-size:13.5px;
  }
  .paid-banner{
    margin-top:10px; padding:9px 11px; background:#EAF6EC; border:1px solid #BFE3C6;
    border-radius:10px; font-size:12.5px; color:var(--present); display:flex;
    align-items:center; gap:8px; line-height:1.5;
  }
  .paid-banner .undo{
    margin-left:auto; background:none; border:0; color:var(--ink-soft);
    font-size:11.5px; text-decoration:underline; padding:2px 0; flex-shrink:0;
  }
  .salary-card.is-paid{opacity:.72;}
  .pill.paid{background:#EAF6EC; color:var(--present);}

  /* ---- Summary / సారాంశం ----
     Same visual language as History: every kind of money gets its own colour and
     its own accent bar, so payable / paid / pending / outstanding never blur together.
       teal  = salary payable      green = paid or recovered
       red   = pending or owed     gold  = advance given */
  .summary-total{
    background:linear-gradient(135deg,var(--teal-800) 0%,var(--teal-700) 100%);
    color:#fff; border-radius:16px; padding:16px; margin-bottom:10px;
  }
  .summary-total .label{font-size:11px; opacity:.72; text-transform:uppercase; letter-spacing:.09em;}
  .summary-total .val{font-size:30px; font-weight:700; font-family:'Poppins',sans-serif; margin-top:3px; line-height:1.1;}
  .summary-total .val small{font-size:11px; font-weight:400; opacity:.7; display:block; margin-top:3px; font-family:inherit;}
  .summary-total .sub-row{display:flex; justify-content:space-between; gap:8px; margin-top:13px; padding-top:13px;
    border-top:1px solid rgba(255,255,255,0.16); font-size:11px;}
  .summary-total .sub-row div{opacity:.8; min-width:0;}
  .summary-total .sub-row div span{display:block; font-size:15px; font-weight:700; margin-top:2px; opacity:1;
    font-family:'Poppins',sans-serif;}
  /* how much of this period's payroll is actually settled */
  .paybar{height:7px; border-radius:5px; background:rgba(255,255,255,0.2); overflow:hidden; margin-top:13px;}
  .paybar i{display:block; height:100%; background:#8FD69B; border-radius:5px; transition:width .3s;}
  .paybar-lbl{display:flex; justify-content:space-between; font-size:10.5px; opacity:.8; margin-top:6px;}

  .sum-grid{display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-bottom:12px;}
  .scard{border-radius:13px; padding:11px 12px; background:var(--card); border:1px solid var(--line);
    border-left-width:5px; min-width:0;}
  .scard .k{font-size:11px; font-weight:700; color:var(--ink-soft); line-height:1.35;}
  .scard .v{font-size:19px; font-weight:700; font-family:'Poppins',sans-serif; margin-top:4px; line-height:1.15;}
  .scard .e{font-size:9.5px; color:var(--ink-soft); margin-top:2px; opacity:.85;}
  .scard.paid{border-left-color:var(--present); background:#EFF5EF;}
  .scard.paid .v{color:var(--present);}
  .scard.pending{border-left-color:var(--absent); background:#FBEFEC;}
  .scard.pending .v{color:var(--absent);}
  .scard.pending.done{border-left-color:var(--present); background:#EFF5EF;}
  .scard.pending.done .v{color:var(--present);}
  .scard.owed{border-left-color:var(--gold-500); background:#FFF8EA;}
  .scard.owed .v{color:var(--gold-600);}
  .scard.days{border-left-color:var(--teal-700); background:#F0F5F3;}
  .scard.days .v{color:var(--teal-800);}

  .sum-card{padding:6px 10px;}
  .sum-head{display:flex; align-items:baseline; justify-content:space-between; margin:16px 3px 8px;}
  .sum-head .t{font-size:12.5px; text-transform:uppercase; letter-spacing:.07em; color:var(--ink-soft); font-weight:700;}
  .sum-head .c{font-size:10.5px; color:var(--ink-soft); opacity:.85; font-weight:600;}

  /* one worker's payment state for this period */
  .owe-item{display:flex; align-items:center; gap:10px; padding:9px 8px 9px 10px;
    border-left:4px solid transparent; border-radius:9px; margin:4px 0;}

  .owe-item.is-due{border-left-color:var(--absent); background:#FCF3F1;}
  .owe-item.is-owed{border-left-color:var(--gold-500); background:#FFFBF2;}
  .owe-item .meta{flex:1; min-width:0;}
  .owe-item .bal{font-weight:700; font-family:'Poppins',sans-serif; font-size:14.5px; text-align:right; flex:0 0 auto;}
  .owe-item .bal small{display:block; font-size:9px; font-weight:600; opacity:.75; margin-top:1px;
    font-family:'Noto Sans Telugu',sans-serif;}
  .owe-item .sub{font-size:10.5px; color:var(--ink-soft);}
  .owe-item .avatar{width:34px; height:34px; font-size:13px;}
  .owe-item.is-due .avatar{background:var(--absent);}
  .owe-item.is-owed .avatar{background:var(--gold-600);}
  /* thin bar showing how much of an advance has already come back */
  .repaid-bar{height:4px; border-radius:3px; background:#EDE3CC; overflow:hidden; margin-top:5px; max-width:170px;}
  .repaid-bar i{display:block; height:100%; background:var(--present); border-radius:3px;}
  .owe-total{display:flex; justify-content:space-between; align-items:center; padding:10px 10px 4px; margin-top:6px;

  .owe-total.due span:last-child{color:var(--absent); font-family:'Poppins',sans-serif;}
  .owe-total.ok span:last-child{color:var(--present); font-family:'Poppins',sans-serif;}

  /* advance history rows — gold when money went out, green when it came back */
  .adv-item{display:flex; align-items:center; gap:10px; padding:9px 8px 9px 10px;
    border-left:4px solid transparent; border-radius:9px; margin:4px 0;}
  .adv-item.given{border-left-color:var(--gold-500); background:#FFFAF0;}
  .adv-item.repaid{border-left-color:var(--present); background:#F2F7F2;}

  }
  .adv-item .datechip .d{font-size:15px; font-weight:700; font-family:'Poppins',sans-serif;}
  .adv-item .datechip .mo{font-size:9.5px; color:var(--ink-soft); text-transform:uppercase; letter-spacing:.04em;}
  .adv-item .meta{flex:1; min-width:0;}
  .adv-item .amt{font-weight:700; font-family:'Poppins',sans-serif; font-size:14.5px; text-align:right; flex:0 0 auto;
    color:var(--gold-600);}
  .adv-item .amt small{display:block; font-size:9px; font-weight:600; opacity:.75; margin-top:1px;
    font-family:'Noto Sans Telugu',sans-serif;}
  .adv-item.repaid .amt{color:var(--present);}
  .adv-item .del{background:none; border:none; color:var(--ink-soft); font-size:15px; padding:4px 2px 4px 6px; flex:0 0 auto;}

  .empty{text-align:center; color:var(--ink-soft); font-size:13px; padding:22px 10px;}

  nav.tabbar{
    position:fixed; bottom:0; left:0; right:0; background:#fff;
    border-top:1px solid var(--line); display:flex; z-index:30;
    padding-bottom:env(safe-area-inset-bottom);
  }
  nav.tabbar button{
    flex:1; border:none; background:none; padding:8px 0 6px; font-family:inherit;
    color:var(--ink-soft); font-size:8.8px; font-weight:600; display:flex; flex-direction:column; align-items:center; gap:2px;
    line-height:1.15; white-space:nowrap;
  }
  nav.tabbar button .ic{font-size:16px;}
  nav.tabbar button.active{color:var(--teal-800);}

  .modal-bg{

  .btn.primary{background:var(--teal-800); color:#fff;}
  .btn.ghost{background:var(--paper); color:var(--ink-soft); border:1.5px solid var(--line);}

  .loading{padding:40px; text-align:center; color:var(--ink-soft);}

  /* ---- Laxman container ledger ---- */
  .lx-row{display:flex; align-items:center; gap:10px; padding:8px 2px;}
  .lx-row + .lx-row{border-top:1px solid var(--line);}
  .lx-row .lbl{flex:1; font-size:13.5px; font-weight:600; min-width:0;}
  .lx-row .lbl span{display:block; font-size:10.5px; color:var(--ink-soft); font-weight:400;}
  .lx-row input{
    width:82px; padding:7px 8px; border:1.5px solid var(--line); border-radius:8px;
    font-size:14px; text-align:right; font-family:inherit; color:var(--ink); flex:0 0 auto;
  }
  .lx-row .unit{font-size:11px; color:var(--ink-soft); width:44px; flex:0 0 auto;}
  .lx-sub{font-size:12px; color:var(--ink-soft); background:#FBF7EE; border-radius:8px;
    padding:7px 9px; margin:8px 0 2px; line-height:1.6;}
  .lx-sub b{color:var(--ink);}
  .lx-cardhead{display:flex; align-items:baseline; gap:8px; margin-bottom:8px;}
  .lx-cardhead h3{margin:0; font-size:14.5px;}
  .lx-cardhead .tag{font-size:10px; letter-spacing:.06em; text-transform:uppercase;
    font-weight:700; padding:2px 7px; border-radius:20px;}
  .tag.biweekly{background:#E5F0E4; color:var(--present);}

  .lx-tot{display:flex; justify-content:space-between; padding:8px 2px 2px; margin-top:6px;

  .lx-tot .we{color:var(--absent);}
  .lx-tot .lx{color:var(--present);}
  .lx-row b.we{color:var(--absent); font-size:14px;}
  .lx-row b.lx{color:var(--present); font-size:14px;}
  .settle{background:var(--teal-800); color:#fff; border-radius:16px; padding:16px; margin-bottom:12px;}
  .settle .label{font-size:11px; opacity:.75; text-transform:uppercase; letter-spacing:.08em;}
  .settle .val{font-size:26px; font-weight:700; font-family:'Poppins',sans-serif; margin-top:3px; line-height:1.2;}
  .settle .val small{display:block; font-size:12px; font-weight:400; opacity:.8; margin-top:3px; font-family:inherit;}
  .settle .split{display:flex; justify-content:space-between; gap:10px; margin-top:13px; padding-top:13px;

  .lx-note{font-size:12.5px; color:var(--ink); background:#FFF8EC; border:1px solid #F0E0C0;
    border-radius:10px; padding:9px 11px; margin-bottom:12px; line-height:1.6;}

  /* ---- Laxman: language switch + editable / custom fields ----
     Every label is written twice — Telugu in <b>, English in <span>. The wrapper
     carries lang-te / lang-en / lang-both and simply hides the half not wanted, so
     nothing has to be re-rendered when the language is changed. */
  .lx-row .lbl b{display:block; font-weight:600; font-size:13.5px;}
  .lang-te .lbl span, .lang-te .t-en{display:none !important;}
  .lang-en .lbl b, .lang-en .t-te{display:none !important;}
  .lang-en .lbl span{font-size:13.5px !important; color:var(--ink) !important; font-weight:600 !important;}
  /* Some places are too tight to carry Telugu AND English side by side. Their
     English half is marked .solo and only appears when English is chosen. */
  .lang-both .t-en.solo{display:none !important;}

  .lx-langbar{display:flex; gap:6px; margin-bottom:10px; align-items:center;}

  .lx-editbar{display:flex; gap:6px; margin-bottom:10px;}

    background:var(--card); font-family:inherit; font-size:12.5px; font-weight:700; color:var(--ink-soft);}
  .lx-editbar button.on{background:var(--gold-500,#C9A227); color:#fff; border-color:var(--gold-500,#C9A227);}
  .lx-row .rowtools{display:flex; gap:5px; flex:0 0 auto;}

  .lx-addbtn{width:100%; margin-top:9px; padding:10px; border-radius:10px; border:1.5px dashed var(--line);
    background:var(--paper); font-family:inherit; font-size:13px; font-weight:700; color:var(--teal-800);}
  .lx-empty{font-size:12px; color:var(--ink-soft); padding:8px 2px; line-height:1.5;}
  .te-btn{margin-top:6px; padding:8px 10px; border-radius:8px; border:1.5px solid var(--line);
    background:var(--paper); font-family:inherit; font-size:12px; font-weight:700; color:var(--teal-800);}

  /* ---- History (money ledger) ----
     Four kinds of money live in this tab and they must never look alike:
       salary paid  · advance given  · advance recovered  · outstanding balance
     Each gets its own colour, its own summary card and its own row accent. */
  .hist-hero{background:var(--teal-800); color:#fff; border-radius:16px; padding:15px 16px; margin-bottom:9px;}
  .hist-hero .label{font-size:10.5px; opacity:.72; text-transform:uppercase; letter-spacing:.09em;}
  .hist-hero .val{font-size:29px; font-weight:700; font-family:'Poppins',sans-serif; margin-top:3px; line-height:1.1;}
  .hist-hero .hero-note{font-size:11px; opacity:.7; margin-top:5px;}

  .hist-grid{display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-bottom:10px;}
  .hcard{border-radius:13px; padding:11px 12px; border:1px solid var(--line); background:var(--card);
    border-left-width:5px; min-width:0;}
  .hcard .k{font-size:11px; font-weight:700; color:var(--ink-soft); line-height:1.35;}
  .hcard .v{font-size:19px; font-weight:700; font-family:'Poppins',sans-serif; margin-top:4px; line-height:1.15;}
  .hcard .e{font-size:9.5px; color:var(--ink-soft); margin-top:2px; opacity:.85;}
  .hcard.salary{border-left-color:var(--teal-700); background:#F0F5F3;}
  .hcard.salary .v{color:var(--teal-800);}
  .hcard.advout{border-left-color:var(--gold-500); background:#FFF8EA;}
  .hcard.advout .v{color:var(--gold-600);}
  .hcard.advin{border-left-color:var(--present); background:#EFF5EF;}
  .hcard.advin .v{color:var(--present);}
  .hcard.due{border-left-color:var(--absent); background:#FBEFEC;}
  .hcard.due .v{color:var(--absent);}
  .hcard.clear{border-left-color:var(--present); background:#EFF5EF;}
  .hcard.clear .v{color:var(--present);}

  .hist-other{background:var(--card); border:1px solid var(--line); border-radius:12px;
    padding:8px 12px; margin-bottom:10px; font-size:11.5px; color:var(--ink-soft);}
  .hist-other div{display:flex; justify-content:space-between; align-items:center; padding:3px 0;}
  .hist-other div + div{border-top:1px dashed var(--line);}
  .hist-other b{font-family:'Poppins',sans-serif; font-size:13px; color:var(--absent);}
  .hist-other b.in{color:var(--present);}

  .hist-month{font-size:12px; font-weight:700; letter-spacing:.06em; text-transform:uppercase;
    color:var(--ink-soft); margin:15px 4px 7px; display:flex; justify-content:space-between; align-items:baseline;}
  .hist-month .cnt{font-size:11px; font-weight:600; opacity:.8; letter-spacing:0; text-transform:none;}
  .hist-card{padding:6px 10px;}
  .hist-item{display:flex; align-items:center; gap:10px; padding:9px 8px 9px 10px;

  .hist-item.k-other + .hist-item.k-other{border-top:1px solid var(--line);}
  .hist-item.k-salary  {border-left-color:var(--teal-700); background:#F4F8F6;}
  .hist-item.k-advgiven{border-left-color:var(--gold-500); background:#FFFAF0;}
  .hist-item.k-advrep  {border-left-color:var(--present); background:#F2F7F2;}
  .hist-item.k-other   {border-left-color:var(--line);}
  .hist-item .datechip{
    flex:0 0 auto; width:46px; text-align:center; background:var(--card); border:1px solid var(--line);
    border-radius:9px; padding:4px 2px; line-height:1.15;
  }
  .hist-item .datechip .d{font-size:15px; font-weight:700; font-family:'Poppins',sans-serif;}
  .hist-item .datechip .mo{font-size:9.5px; color:var(--ink-soft); text-transform:uppercase; letter-spacing:.04em;}
  .hist-item .meta{flex:1; min-width:0;}
  .hist-item .meta .t{font-size:13px; font-weight:700; line-height:1.35;}
  .hist-item .meta .t .kind-ic{margin-right:4px; font-size:12px;}
  .hist-item .meta .s{font-size:10.5px; color:var(--ink-soft); margin-top:1px;}
  .hist-item .meta .n{font-size:10.5px; color:var(--gold-600); margin-top:1px;}
  .hist-item .amt{font-weight:700; font-size:14px; text-align:right; flex:0 0 auto; font-family:'Poppins',sans-serif;}
  .hist-item .amt small{display:block; font-size:9px; font-weight:600; opacity:.75; margin-top:1px;
    font-family:'Noto Sans Telugu',sans-serif;}
  .hist-item .amt.out{color:var(--absent);}
  .hist-item .amt.in{color:var(--present);}
  .hist-item.k-salary .amt.out{color:var(--teal-800);}
  .hist-item.k-advgiven .amt.out{color:var(--gold-600);}
  .hist-item .del{background:none; border:0; color:var(--ink-soft); font-size:15px; padding:4px 2px 4px 6px; flex:0 0 auto;}
  .hist-item .lock{font-size:11px; opacity:.4; padding:4px 2px 4px 6px; flex:0 0 auto;}

  .hist-filter{display:flex; flex-wrap:wrap; gap:6px; margin:2px 0 4px;}
  .hist-filter button{
    background:var(--card); border:1px solid var(--line); color:var(--ink-soft); font-family:inherit;
    border-radius:22px; padding:5px 10px; font-size:11.5px; font-weight:600;
    display:inline-flex; align-items:center; gap:5px;
  }
  .hist-filter button .c{font-size:9.5px; background:var(--paper); border-radius:9px; padding:1px 5px; opacity:.8;}
  .hist-filter button.on{background:var(--teal-800); border-color:var(--teal-800); color:#fff;}
  .hist-filter button.on .c{background:rgba(255,255,255,0.2); color:#fff;}
  .hist-filter button.on.f-advgiven{background:var(--gold-600); border-color:var(--gold-600);}
  .hist-filter button.on.f-advrepaid{background:var(--present); border-color:var(--present);}

/* ══════════ SPEED ══════════
   Taps register straight away, the page never rubber-bands into the app
   behind it, and long lists only paint the rows actually on screen. */
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
button,a,input,select,textarea,label,summary,[role=button]{touch-action:manipulation}
body{overscroll-behavior-y:contain}

<body>

<header>
  <div class="brand">OneStop DriveIn</div>

  <div class="sub" id="headerSub">Staff Attendance &amp; Biweekly Salary</div>

  <div class="period-strip" id="periodStripAttendance">
    <button id="prevPeriod">‹</button>
    <div class="period-label">
      <span id="periodLabel">–</span>
      <span class="range" id="periodRange">–</span>
    </div>
    <button id="nextPeriod">›</button>
  </div>

  <div class="daydots" id="dayDots"></div>

</main>

  <button data-tab="salary"><span class="ic">💰</span>జీతం</button>
  <button data-tab="canteen"><span class="ic">🥤</span>క్యాంటీన్</button>
  <button data-tab="summary"><span class="ic">📊</span>సారాంశం</button>

  <button data-tab="history"><span class="ic">🧾</span>చరిత్ర</button>
  <button data-tab="warnings"><span class="ic">⚠️</span>హెచ్చరికలు</button>
  <button data-tab="workers"><span class="ic">👥</span>సిబ్బంది</button>
</nav>

<script>
const STORAGE_KEY = 'onestop-hr-v1';
const TE_DOW = ['ఆది','సోమ','మంగళ','బుధ','గురు','శుక్ర','శని'];

// Every worker carries a FIXED dayRate — one day's pay, never derived from month length.
//  • biweekly staff are PAID on it (month total = dayRate × 28/30/31).
//  • monthly staff have a FIXED monthly salary, and dayRate is what one absent day costs them.
const DEFAULT_WORKERS = [
  {id:'veerababu',   name:'Veerababu',   te:'వీరబాబు',    role:'Chef',                       dayRate:1200, payFreq:'biweekly'},
  {id:'raju',        name:'Raju',        te:'రాజు',       role:'Assistant Chef',             dayRate:900,  payFreq:'biweekly'},
  {id:'triveni',     name:'Triveni',     te:'త్రివేణి',    role:'Manager',                    monthly:12000, dayRate:400, payFreq:'monthly'},
  {id:'laxman',      name:'Laxman',      te:'లక్ష్మణ్',    role:'Convention Hall Incharge',   monthly:15000, dayRate:500, payFreq:'monthly'},
  {id:'venkatesh',   name:'Venkatesh',   te:'వెంకటేష్',   role:'Cleaner & Lodge Supervisor', dayRate:600,  payFreq:'biweekly'},
  {id:'krishnavedi', name:'Krishnaveni', te:'కృష్ణవేణి',  role:'Cleaner',                    dayRate:400,  payFreq:'biweekly'},
  {id:'manasa',      name:'Maanasa',     te:'మానసా',     role:'Cleaner',                    monthly:12000, dayRate:400, payFreq:'monthly'},
  {id:'pachayya',    name:'Ponnaya',     te:'పొన్నయ్య',   role:'Cleaner',                    monthly:12000, dayRate:400, payFreq:'monthly'},
];

// ---- employment window: joining date & closed accounts ---------------------
// A worker is NEVER deleted once he has any record against his name. Closing an
// account only sets active:false + endDate (last working day). He stays inside
// state.workers, so History, advances, warnings and payments keep showing his real
// name for ever. Salary/attendance simply stop counting days outside his window.
function isClosed(w){ return !!(w && w.active===false); }
function employedOn(w, date){
  if(!w) return false;
  if(w.startDate && date < w.startDate) return false;
  if(w.endDate   && date > w.endDate)   return false;
  return true;
}
function monthBounds(parts){
  const mm = pad(parts.m);
  const lastDay = new Date(parts.y, parts.m, 0).getDate();
  return {start: parts.y+'-'+mm+'-01', end: parts.y+'-'+mm+'-'+pad(lastDay)};
}
function monthDatesOf(parts){
  return periodDates({y:parts.y, m:parts.m, half:1}).concat(periodDates({y:parts.y, m:parts.m, half:2}));
}
// the stretch of days one salary card covers: the whole month for monthly staff,
// the fortnight for biweekly staff
function scopeBounds(w, parts){
  return w.payFreq==='monthly' ? monthBounds(parts) : periodBounds(parts);
}
function scopeDates(w, parts){
  return w.payFreq==='monthly' ? monthDatesOf(parts) : periodDates(parts);
}
function employedDaysIn(w, dates){ return dates.filter(d=> employedOn(w,d)).length; }
// Should this worker appear on the Salary / Summary cards for this period?
// Anyone already paid for it stays visible for ever — a paid record never hides.
function inScope(w, parts){
  if(getPayment(w, parts)) return true;
  const b = scopeBounds(w, parts);
  if(w.startDate && w.startDate > b.end)   return false;   // hadn't joined yet

// Attendance for one day: everyone employed that day, plus anyone already marked on
// it (so an old mark can always be seen and corrected).
// A closed account is left out entirely — once someone has left you are not marking
// him present any more, whatever date you are looking at. Nothing is deleted: his
// days stay in History, still count towards his final salary, and reappear here the
// moment you tap "show former staff" or reopen the account.
function onDuty(w, date){
  return employedOn(w, date) || !!(state.attendance[w.id] && state.attendance[w.id][date]);
}
function workersOnDate(date, includeClosed){
  return state.workers.filter(w=> (includeClosed || !isClosed(w)) && onDuty(w, date));
}
// Closed accounts that this date would otherwise have shown.
function closedOnDate(date){
  return state.workers.filter(w=> isClosed(w) && onDuty(w, date));
}

}

function workerRecordCounts(w){

  const warns = (state.warnings||[]).filter(x=> x.workerId===w.id).length;
  const pays = Object.keys(state.payments||{}).filter(k=> k.split('|')[0]===w.id).length;
  return {days, advs, warns, pays, total: days+advs+warns+pays};
}

// migrate any previously-saved workers (from before roles existed, or before salary
// switched from a biweekly figure to a monthly figure) to the new shape
function migrateWorkers(list){
  const byId = {};
  DEFAULT_WORKERS.forEach(w=> byId[w.id]=w);
  list.forEach(w=>{
    if(w.active===undefined) w.active = true;   // everyone already on the list is working
    if(!w.role){
      if(byId[w.id]){
        w.role = byId[w.id].role;
        if(!w.name) w.name = byId[w.id].name;   // only backfill genuinely-missing names
        if(!w.te)   w.te   = byId[w.id].te;      // never overwrite an edited/custom name
      } else {
        w.role = '';
      }
    }
    if(!w.payFreq){
      w.payFreq = byId[w.id] ? byId[w.id].payFreq : 'biweekly';
    }
    // Snapshot the legacy figures BEFORE any deletion — the dayRate fallback below needs them.
    // Very old records only stored a biweekly (half-month) figure.
    const legacyMonthly = w.monthly!=null ? w.monthly : (w.biweekly ? w.biweekly*2 : 0);
    // every worker now carries a fixed dayRate (paid on it if biweekly, deducted at it if monthly).
    // Old monthly figures were always day-rate × 30, so ÷30 recovers the rate exactly.
    if(!w.dayRate){
      w.dayRate = (byId[w.id] && byId[w.id].dayRate)
        ? byId[w.id].dayRate
        : Math.round(legacyMonthly/30);
    }
    // Only monthly staff need a monthly figure; biweekly staff are driven purely by dayRate.
    if(w.payFreq==='monthly') w.monthly = legacyMonthly;
    else delete w.monthly;
    delete w.biweekly;
  });
  // Re-seed the original team ONLY if they were never deliberately erased. Without this
  // guard a removed worker silently came back on the next app open.
  const erased = (state && state.removedIds) || [];
  DEFAULT_WORKERS.forEach(dw=>{
    if(erased.indexOf(dw.id) >= 0) return;
    if(!list.find(w=>w.id===dw.id)) list.push(Object.assign({}, dw));
  });
  return list;
}

// Phonetic speller. Splits the word into consonant-cluster + vowel pieces and
// writes each piece in Telugu. Rough by design — it is a starting point to edit.
const TE_CONS = [['chh','ఛ'],['sh','శ'],['ch','చ'],['th','థ'],['dh','ధ'],['ph','ఫ'],['bh','భ'],
  ['gh','ఘ'],['kh','ఖ'],['jh','ఝ'],['ng','ంగ'],['ny','ఞ'],['ks','క్ష'],
  ['k','క'],['c','క'],['q','క'],['g','గ'],['j','జ'],['t','ట'],['d','డ'],['n','న'],['p','ప'],
  ['b','బ'],['m','మ'],['y','య'],['r','ర'],['l','ల'],['v','వ'],['w','వ'],['s','స'],['h','హ'],
  ['x','క్స'],['z','జ'],['f','ఫ']];
const TE_VOW = [['aa',['ఆ','ా']],['ee',['ఈ','ీ']],['ii',['ఈ','ీ']],['oo',['ఊ','ూ']],['uu',['ఊ','ూ']],
  ['ai',['ఐ','ై']],['au',['ఔ','ౌ']],['ea',['ఈ','ీ']],['ou',['ఔ','ౌ']],
  ['a',['అ','']],['i',['ఇ','ి']],['u',['ఉ','ు']],['e',['ఎ','ె']],['o',['ఒ','ొ']]];
function teSpell(word){
  // A few English spelling habits that would otherwise come out badly.
  let w = String(word||'').toLowerCase().replace(/[^a-z]/g,'')
    .replace(/tion$/,'shan').replace(/sion$/,'shan')
    .replace(/ck/g,'k').replace(/ough$/,'o').replace(/gh/g,'g')
    .replace(/([bcdfgjklmnpqrstvwxz])e$/,'$1')      // silent e at the end
    .replace(/y$/,'i').replace(/y/g,'y');
  if(!w) return '';
  let out = '', i = 0, guard = 0;
  while(i < w.length && guard++ < 80){
    // consonant cluster
    let cons = [];
    while(i < w.length){
      const m = TE_CONS.find(c => w.startsWith(c[0], i));
      if(!m) break;
      cons.push(m[1]); i += m[0].length;
      // stop the cluster when a vowel follows
      if(TE_VOW.some(v => w.startsWith(v[0], i))) break;
      if(cons.length > 2) break;
    }
    // vowel
    let vow = null;
    const vm = TE_VOW.find(v => w.startsWith(v[0], i));
    if(vm){ vow = vm[1]; i += vm[0].length; }
    if(cons.length){
      out += cons.join('\u0c4d');                       // virama between stacked consonants
      out += vow ? vow[1] : (i < w.length ? '\u0c4d' : '\u0c4d');
    } else if(vow){
      out += vow[0];
    } else { i++; }                                     // nothing matched — skip the letter
  }
  return out.replace(/\u0c4d$/, '\u0c4d');
}
// The whole label: known words come from the list, unknown ones are spelt out.
function enToTelugu(text){
  const raw = String(text||'').trim();
  if(!raw) return '';
  const low = raw.toLowerCase().replace(/\s+/g,' ');
  if(TE_WORDS[low]) return TE_WORDS[low];
  // try the longest matching phrase first, then word by word
  const words = low.split(' ');
  for(let n = words.length; n >= 2; n--){
    for(let a = 0; a + n <= words.length; a++){
      const phrase = words.slice(a, a+n).join(' ');
      if(TE_WORDS[phrase]){
        const head = words.slice(0,a).map(w => TE_WORDS[w] || teSpell(w));
        const tail = words.slice(a+n).map(w => TE_WORDS[w] || teSpell(w));
        return head.concat([TE_WORDS[phrase]]).concat(tail).join(' ').trim();
      }
    }
  }
  return words.map(w => TE_WORDS[w] || teSpell(w)).join(' ').trim();
}

function lxPeriodKey(parts){ return parts.y+'-'+parts.m+'-'+parts.half; }
function lxMonthKey(parts){ return parts.y+'-'+parts.m; }
function lxPeriod(parts){
  if(!state.laxman) state.laxman = {periods:{}, months:{}};
  if(!state.laxman.periods) state.laxman.periods = {};
  const k = lxPeriodKey(parts);
  if(!state.laxman.periods[k]){
    state.laxman.periods[k] = {roti:0, bnaan:0, gnaan:0, rotiPrice:LX_ROTI_PRICE,
                               bnaanPrice:LX_BNAAN_PRICE, gnaanPrice:LX_GNAAN_PRICE, paid:null};
  }
  const p = state.laxman.periods[k];
  // one-time carry-over from the old two-item model {roti, naan}. Periods that already
  // had numbers typed in keep the prices they were settled at; empty ones move to the
  // new ₹20/₹20/₹50 rates.
  if(p.bnaan==null){
    const used = (Number(p.roti)||0) > 0 || (Number(p.naan)||0) > 0;
    p.bnaan = Number(p.naan)||0;
    p.bnaanPrice = (used && p.naanPrice!=null) ? Number(p.naanPrice) : LX_BNAAN_PRICE;
    if(!used) p.rotiPrice = LX_ROTI_PRICE;
  }
  if(p.gnaan==null) p.gnaan = 0;
  if(p.rotiPrice==null)  p.rotiPrice  = LX_ROTI_PRICE;
  if(p.bnaanPrice==null) p.bnaanPrice = LX_BNAAN_PRICE;
  if(p.gnaanPrice==null) p.gnaanPrice = LX_GNAAN_PRICE;
  // garlic naan moved ₹25 → ₹50. Periods that never had any garlic naan typed in
  // pick up the new rate; anything already counted keeps the price it was billed at.
  if(Number(p.gnaanPrice)===25 && !(Number(p.gnaan)||0)) p.gnaanPrice = LX_GNAAN_PRICE;
  // p.given is legacy — the cash figure now lives on the month (see lxMonth)
  return p;
}
function lxMonth(parts){
  if(!state.laxman) state.laxman = {periods:{}, months:{}};
  if(!state.laxman.months) state.laxman.months = {};
  const k = lxMonthKey(parts);
  if(!state.laxman.months[k]){
    const items = {};
    LX_ITEMS.forEach(it=> items[it.id] = 0);
    state.laxman.months[k] = {items, watchman:LX_WATCHMAN_SALARY, watchmanShare:LX_WATCHMAN_SHARE, fee:LX_CLEANING_FEE, paid:null};
  }
  const m = state.laxman.months[k];
  if(!m.items) m.items = {};
  LX_ITEMS.forEach(it=>{ if(m.items[it.id]==null) m.items[it.id] = 0; });
  if(m.fee==null) m.fee = LX_CLEANING_FEE;
  if(m.watchman==null) m.watchman = LX_WATCHMAN_SALARY;
  if(m.watchmanShare==null) m.watchmanShare = LX_WATCHMAN_SHARE;
  // Cleaning is now ONE manual figure instead of six item boxes + a flat fee.
  // Old months carry over at exactly what Laxman owed before (flat fee + half the
  // itemised bill), so no past balance changes.
  if(m.cleaning==null){
    const legacyItems = LX_ITEMS.reduce((s,it)=> s + (Number((m.items||{})[it.id])||0), 0);
    m.cleaning = (Number(m.fee)||0) + legacyItems/2;
  }
  if(m.current==null) m.current = 0;   // electricity bill — manual
  if(m.rent==null)    m.rent    = 0;   // monthly rent — manual
  // The whole tab settles once a month, so the cash figures live here, not per fortnight.
  if(m.given==null){
    // one-time carry-over from the short-lived per-fortnight "given" field
    const ps = (state.laxman.periods||{});
    m.given = (Number((ps[parts.y+'-'+parts.m+'-1']||{}).given)||0)
            + (Number((ps[parts.y+'-'+parts.m+'-2']||{}).given)||0);
  }
  if(m.received==null) m.received = 0;
  if(!m.extra || typeof m.extra !== 'object') m.extra = {};   // added-by-hand fields, this month
  return m;
}
// Roti/naan is a separate ledger of its own: the whole sale value is ours to pay.
// Nothing here is shared with, or settled against, Laxman.
function lxBreadCalc(parts){
  const p = lxPeriod(parts);
  const rotiSale  = (Number(p.roti)||0)  * (Number(p.rotiPrice)||0);
  const bnaanSale = (Number(p.bnaan)||0) * (Number(p.bnaanPrice)||0);
  const gnaanSale = (Number(p.gnaan)||0) * (Number(p.gnaanPrice)||0);
  const total = rotiSale + bnaanSale + gnaanSale;
  const qty = (Number(p.roti)||0) + (Number(p.bnaan)||0) + (Number(p.gnaan)||0);
  return {p, rotiSale, bnaanSale, gnaanSale, qty, total, weOwe: total};
}
// Everything Laxman owes us, all of it monthly and all typed in by hand:
// cleaning charges + current bill + rent + his fixed ₹5,000 watchman share
// (the watchman's full salary is ₹12,000 and we pay that).
function lxMonthCalc(parts){
  const m = lxMonth(parts);
  lxRoot();
  const on = f => lxHidden(f) ? 0 : (Number(m[f])||0);
  const cleaning = on('cleaning');
  const current  = on('current');
  const rent     = on('rent');
  const watchman = Number(m.watchman)||0;
  const watchmanShare = on('watchmanShare');
  // Rows added by hand. 'owes' adds to what Laxman must pay us; 'we' is money we
  // owe him and comes straight back off the same settlement.
  const amtOf = fld => Number((m.extra||{})[fld.id])||0;
  const extraOwes = lxFieldsOn('owes').reduce((s,f)=> s + amtOf(f), 0);
  const extraWe   = lxFieldsOn('we').reduce((s,f)=> s + amtOf(f), 0);
  const lxOwes = cleaning + current + rent + watchmanShare + extraOwes;
  return {m, cleaning, current, rent, watchman, watchmanShare, watchmanOwed: watchmanShare,
          extraOwes, extraWe, lxOwes};
}
// The Laxman tab is now only what he owes US, settled once a month:
//   cleaning + current + rent + watchman share  −  cash he has handed us
//   (+ any cash we have handed him).
// Negative balance = Laxman still owes us. Positive = we owe him.
function lxSettlement(parts){
  const mc = lxMonthCalc(parts);
  const given = Number(mc.m.given)||0;
  const received = Number(mc.m.received)||0;
  const weOwe = mc.extraWe;
  const net = weOwe - mc.lxOwes;
  return {lxOwes: mc.lxOwes, weOwe, mc, given, received, net,
          balance: net - given + received};
}

let currentTab = 'attendance';
let periodOffset = 0; // 0 = period containing today (or first period)
let selectedDate = todayStr();
let showFormerStaff = false;   // former staff stay hidden on the attendance tab until asked for

function todayStr(){
  const d = new Date();
  return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
}
function pad(n){return n<10?'0'+n:''+n;}
function addDays(dateStr, n){
  const d = new Date(dateStr+'T00:00:00');
  d.setDate(d.getDate()+n);
  return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
}
function daysBetween(a,b){
  return Math.round((new Date(b+'T00:00:00') - new Date(a+'T00:00:00'))/86400000);
}
function fmtShort(dateStr){
  const d = new Date(dateStr+'T00:00:00');
  const months=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  return d.getDate()+' '+months[d.getMonth()];
}
function fmtRupee(n){
  return '₹'+Math.round(n).toLocaleString('en-IN');
}

// ---- period math ----
function todayParts(){
  const d = new Date();
  return {y:d.getFullYear(), m:d.getMonth()+1, half: d.getDate()<=15 ? 1 : 2};
}
function stepPeriod(parts, steps){
  let {y,m,half} = parts;
  while(steps>0){
    if(half===1){ half=2; } else { half=1; m+=1; if(m>12){ m=1; y+=1; } }
    steps--;
  }
  while(steps<0){
    if(half===2){ half=1; } else { half=2; m-=1; if(m<1){ m=12; y-=1; } }
    steps++;
  }
  return {y,m,half};
}
function currentPeriodParts(){
  return stepPeriod(todayParts(), periodOffset);
}
function partsFromDate(dateStr){
  const p = (dateStr||todayStr()).split('-').map(Number);
  return {y:p[0], m:p[1], half: p[2]<=15 ? 1 : 2};
}
const FIXED_MONTH_DAYS = 30; // (legacy) kept for reference; salary math below now uses real month length
// Actual number of calendar days in this period's month: 28, 29 (leap Feb), 30 or 31.
function daysInMonth(parts){ return new Date(parts.y, parts.m, 0).getDate(); }
// Central salary math shared by the Salary, Summary and History views so they never drift.
//  • Everyone has a FIXED dayRate. It never changes with month length (28/29/30/31).
//  • biweekly staff are PAID on it: month total = dayRate × days in month.
//    ₹1200/day = ₹37,200 in a 31-day month, ₹36,000 in 30, ₹33,600 in 28.
//    Each half is worth dayRate × (calendar days in that half).
//  • monthly staff get a FIXED salary that does NOT change with month length, but every
//    absent day (and every 2nd-level warning) costs exactly dayRate — e.g. Triveni loses
//    ₹400 for one absence whether the month is 28 or 31 days long.
function daySalary(w, parts){
  if(w.dayRate) return w.dayRate;
  return (w.monthly||0)/daysInMonth(parts);   // legacy fallback only
}
// ---- absence-exempt staff (confirmed Aug 2026) ----
// Triveni and Laxman are senior/salaried on trust: their absent days are still MARKED
// and still COUNTED on every card, but no money is ever taken off for them. Discipline
// warnings and mid-month joining/leaving are separate and still apply as before.
const NO_ABSENT_DEDUCT = ['triveni','laxman'];
function absentExempt(w){ return !!w && NO_ABSENT_DEDUCT.indexOf(w.id) >= 0; }
function computeEarned(w, parts){
  const isMonthly = w.payFreq==='monthly';
  // Days he was actually on the payroll. Only ever less than the full scope when he
  // joined or left part-way through it — otherwise nothing below changes.
  const scope = scopeDates(w, parts);
  const workedDays = employedDaysIn(w, scope);
  const notEmployedDays = scope.length - workedDays;
  const stats = isMonthly ? combinedMonthStats(w.id, parts, w) : periodStats(w.id, parts, w);
  const missedDays = stats.absent + stats.half*0.5;
  const dim = daysInMonth(parts);                    // 28 / 29 / 30 / 31
  const penaltyRate = daySalary(w, parts);           // one day's pay, used for discipline deductions
  const warns = warningsForScope(w, parts);
  const warnDeductDays = warns.filter(x=>x.deduct).length;
  const warningDeduction = penaltyRate*warnDeductDays;
  const exempt = absentExempt(w);            // absences counted, but never charged
  if(isMonthly){
    // Fixed monthly salary, but a part-month (joined/left mid-month) is charged at the
    // same fixed day rate one absent day costs, so the figures can never disagree.
    const full = Math.max(0, (w.monthly||0) - penaltyRate*notEmployedDays);
    // exempt staff: absences are shown but cost nothing
    const deduction = exempt ? 0 : penaltyRate*missedDays;
    const earned = full - deduction - warningDeduction;
    return {isMonthly:true, exempt, stats, missedDays, dim, daysThisPeriod:dim, dailyRate:penaltyRate,
            fullPeriodAmount:full, monthTotal:(w.monthly||0), deduction, penaltyRate, warns, warnDeductDays,
            warningDeduction, workedDays, notEmployedDays, earned};
  }
  const dailyRate = penaltyRate;                     // fixed ₹/day — does not shrink in a 31-day month
  const daysThisPeriod = workedDays;                 // 15 for 1st half, dim-15 for 2nd half (less if part-period)
  const fullPeriodAmount = dailyRate*daysThisPeriod;
  const monthTotal = dailyRate*dim;                  // what the whole month is worth at this rate
  const deduction = exempt ? 0 : dailyRate*missedDays;
  return {isMonthly:false, exempt, stats, missedDays, dim, daysThisPeriod, dailyRate,
          fullPeriodAmount, monthTotal, deduction, penaltyRate, warns, warnDeductDays,
          warningDeduction, workedDays, notEmployedDays,
          earned:fullPeriodAmount-deduction-warningDeduction};
}
// ---- salary paid tracking ----
// One place that answers "what is actually payable to this worker for this period",
// so the Salary tab, the Laxman tab and the History tab can never disagree.
function salaryNet(w, parts){
  const e = computeEarned(w, parts);
  const advs = e.isMonthly ? combinedMonthAdvances(w.id, parts) : advancesInPeriod(w.id, parts);
  // Only money actually TAKEN BACK from this period's salary reduces the payout.
  // An advance that was *given* is cash he already has in hand — it raises what he
  // owes, but it must not also shrink the salary, or he'd be charged for it twice.
  const recovered = advs.filter(a=> a.type==='repaid').reduce((s,a)=> s + Number(a.amount), 0);
  const givenNow  = advs.filter(a=> a.type!=='repaid').reduce((s,a)=> s + Number(a.amount), 0);
  const owedAfter  = outstandingBalance(w.id);      // all-time given − repaid (already includes this deduction)
  const owedBefore = owedAfter + recovered;
  const tip = tipFor(w, parts);                     // paid on top of earnings, never touched by absences
  // Cool drinks / food taken from the restaurant: goods already had, so they come
  // straight off this period's payout, exactly like a recovered advance.
  const canteenList = canteenForScope(w, parts);
  const canteenTotal = canteenSum(canteenList);
  return {e, advs, recovered, givenNow, advTotal: recovered, owedBefore, owedAfter, tip,
          canteenList, canteenTotal,
          net: e.earned + tip - recovered - canteenTotal};
}
// Tips are stored per worker per pay period, on the same key the payment record uses,
// so a monthly worker has one tip for the month and a biweekly worker one per half.
function tipFor(w, parts){
  return Number((state.tips||{})[paymentKey(w, parts)]) || 0;
}
function setTip(w, parts, v){
  if(!state.tips) state.tips = {};
  const amt = Number(v)||0;
  if(amt) state.tips[paymentKey(w, parts)] = amt;
  else delete state.tips[paymentKey(w, parts)];
}
// Monthly staff are paid once for the whole month, so their key ignores the half.
// Biweekly staff get one key per half, matching how they're actually paid.
function paymentKey(w, parts){
  const scope = w.payFreq==='monthly' ? 'M' : parts.half;
  return w.id+'|'+parts.y+'-'+parts.m+'-'+scope;
}
function getPayment(w, parts){
  return (state.payments||{})[paymentKey(w, parts)] || null;
}
function setPayment(w, parts, rec){
  if(!state.payments) state.payments = {};
  state.payments[paymentKey(w, parts)] = rec;
}
function clearPayment(w, parts){
  if(state.payments) delete state.payments[paymentKey(w, parts)];
}

function monthHalves(parts){
  return [{y:parts.y,m:parts.m,half:1}, {y:parts.y,m:parts.m,half:2}];
}
function combinedMonthStats(workerId, parts, w){
  let present=0, half=0, absent=0;
  monthHalves(parts).forEach(p=>{
    const s = periodStats(workerId, p, w);
    present+=s.present; half+=s.half; absent+=s.absent;
  });
  return {present, half, absent};
}
function combinedMonthAdvances(workerId, parts){
  const mm = pad(parts.m);
  const lastDay = new Date(parts.y, parts.m, 0).getDate();
  const start = parts.y+'-'+mm+'-01';
  const end = parts.y+'-'+mm+'-'+pad(lastDay);
  return state.advances.filter(a=> a.workerId===workerId && a.date>=start && a.date<=end);
}
function periodBounds(parts){
  const mm = pad(parts.m);
  if(parts.half===1){
    return { start: parts.y+'-'+mm+'-01', end: parts.y+'-'+mm+'-15' };
  }
  const lastDay = new Date(parts.y, parts.m, 0).getDate();
  return { start: parts.y+'-'+mm+'-16', end: parts.y+'-'+mm+'-'+pad(lastDay) };
}
function periodDates(parts){
  const b = periodBounds(parts);
  const arr = [];
  let d = b.start;
  while(d <= b.end){ arr.push(d); d = addDays(d,1); }
  return arr;
}
function periodTopLabel(parts){
  const b = periodBounds(parts);
  return parseInt(b.start.split('-')[2],10) + '\u2013' + parseInt(b.end.split('-')[2],10);
}
function periodBottomLabel(parts){
  const months=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  return months[parts.m-1] + ' ' + parts.y;
}

// ---- English → Telugu helpers ---------------------------------------------
// Names are spelled by SOUND (Ravi → రవి) via Google Input Tools transliteration;
// role/word fields are TRANSLATED by meaning (Chef → చెఫ్/వంటవాడు) via Google translate.
// Both leave the result editable so it can be corrected. Needs internet.
const TELUGU_RE = /[\u0C00-\u0C7F]/;
const LATIN_RE  = /[A-Za-z]/;
async function translateToTelugu(text){
  const q = (text||'').trim();
  if(!q) return null;
  try{
    const r = await withTimeout(fetch('https://translate.googleapis.com/translate_a/single?client=gtx&sl=en&tl=te&dt=t&q='+encodeURIComponent(q)), 6000);
    if(r.ok){
      const d = await r.json();
      if(Array.isArray(d) && Array.isArray(d[0])){
        const out = d[0].map(s=> s&&s[0]?s[0]:'').join('').trim();
        if(out && TELUGU_RE.test(out)) return out;
      }
    }
  }catch(e){}
  try{
    const r = await withTimeout(fetch('https://api.mymemory.translated.net/get?q='+encodeURIComponent(q)+'&langpair=en|te'), 6000);
    if(r.ok){
      const d = await r.json();
      const out = d && d.responseData && (d.responseData.translatedText||'').trim();
      if(out && TELUGU_RE.test(out)) return out;
    }
  }catch(e){}
  return null;
}
async function transliterateName(text){
  const q = (text||'').trim();
  if(!q) return null;
  try{
    const url = 'https://inputtools.google.com/request?text='+encodeURIComponent(q)
              + '&itc=te-t-i0-und&num=1&cp=0&cs=1&ie=utf-8&oe=utf-8';
    const r = await withTimeout(fetch(url), 6000);
    if(r.ok){
      const d = await r.json();
      if(d && d[0]==='SUCCESS' && d[1] && d[1][0] && Array.isArray(d[1][0][1]) && d[1][0][1][0]){
        const out = (d[1][0][1][0]||'').trim();
        if(out && TELUGU_RE.test(out)) return out;
      }
    }
  }catch(e){}
  return await translateToTelugu(q);   // fallback
}
// Fill the Telugu field (dstId) from the source field (srcId). mode: 'name' | 'word'
async function translateFieldTo(srcId, dstId, statusId, mode){
  const src = document.getElementById(srcId);
  const dst = document.getElementById(dstId) || src;
  const status = statusId ? document.getElementById(statusId) : null;
  const txt = (src.value||'').trim();
  if(!txt){ if(status) status.textContent = 'ముందు పేరు రాయండి (type first)'; return; }
  if(status) status.textContent = 'అనువదిస్తోంది…';
  const out = (mode==='word') ? await translateToTelugu(txt) : await transliterateName(txt);
  if(out){ dst.value = out; if(status) status.textContent = '✓ తెలుగులోకి మార్చబడింది'; }
  else { if(status) status.textContent = '⚠️ విఫలమైంది — తెలుగులో టైప్ చేయవచ్చు'; }
}

// ---- storage (local cache fallback for when Firebase is unreachable) ----
async function storageGet(key){
  if(typeof window.storage !== 'undefined' && window.storage){
    try{
      const r = await withTimeout(window.storage.get(key, false), 4000);
      if(r) return r;
    }catch(e){ /* fall through to localStorage */ }
  }
  try{
    const v = localStorage.getItem(key);
    return v ? {key, value:v} : null;
  }catch(e){ return null; }
}
async function storageSet(key, value){
  let ok = false;
  if(typeof window.storage !== 'undefined' && window.storage){
    try{
      const r = await withTimeout(window.storage.set(key, value, false), 4000);
      if(r) ok = true;
    }catch(e){ /* fall through */ }
  }
  try{ localStorage.setItem(key, value); ok = true; }catch(e){ /* ignore */ }
  return ok;
}

function normalizeState(){
  if(!state.removedIds) state.removedIds = [];   // must exist before workers are migrated
  if(!state.workers || state.workers.length===0) state.workers = DEFAULT_WORKERS.map(w=>Object.assign({},w));
  else state.workers = migrateWorkers(state.workers);
  if(!state.attendance) state.attendance = {};
  if(!state.advances) state.advances = [];
  if(!state.warnings) state.warnings = [];
  if(!state.canteen) state.canteen = [];
  if(!state.payments) state.payments = {};
  if(!state.tips) state.tips = {};
  if(!state.laxman) state.laxman = {periods:{}, months:{}};
  if(!state.laxman.periods) state.laxman.periods = {};
  if(!state.laxman.months) state.laxman.months = {};
  if(!Array.isArray(state.laxman.fields)) state.laxman.fields = [];
  if(!state.laxman.labels || typeof state.laxman.labels !== 'object') state.laxman.labels = {};
  if(!Array.isArray(state.laxman.hidden)) state.laxman.hidden = [];
  applySeedData();
}

let lastSyncTime = null;
let lastSyncOk = false;
function markSynced(ok){
  lastSyncOk = ok;
  lastSyncTime = Date.now();
  renderSyncStatus();
}
function renderSyncStatus(){
  const el = document.getElementById('syncStatus');
  if(!el) return;
  if(!lastSyncTime){ el.textContent = 'Connecting\u2026'; el.className = 'sync-status'; return; }
  const secs = Math.floor((Date.now()-lastSyncTime)/1000);
  const when = secs<5 ? 'just now' : secs<60 ? secs+'s ago' : Math.floor(secs/60)+'m ago';
  el.textContent = (lastSyncOk ? 'Synced ' : 'Offline \u2013 saved on this phone ') + when;
  el.className = 'sync-status ' + (lastSyncOk ? 'ok' : 'bad');
}
setInterval(()=>{ if(!document.hidden) renderSyncStatus(); }, 1000);

async function loadState(){
  let remote = null;
  try{
    remote = await firebaseGet();
    markSynced(true);
  }catch(e){
    console.error('firebase load failed, using local cache', e);
    markSynced(false);
  }

  if(remote){
    state = remote;
  } else {
    let loaded = null;
    try{
      const res = await storageGet(STORAGE_KEY);
      if(res && res.value) loaded = JSON.parse(res.value);
    }catch(e){ loaded = null; }
    state = loaded || {workers: DEFAULT_WORKERS.map(w=>Object.assign({},w)), attendance:{}, advances:[], warnings:[], canteen:[], payments:{}, tips:{}, removedIds:[], seedVersion:0};
  }
  normalizeState();
  await saveState();
}

async function saveState(){
  state.lastUpdated = Date.now();
  try{
    await firebaseSet(state);
    markSynced(true);
  }catch(e){
    console.error('firebase save failed (will still keep local copy)', e);
    markSynced(false);
  }
  try{
    await storageSet(STORAGE_KEY, JSON.stringify(state));
  }catch(e){
    console.error('local cache save failed', e);
  }
}

// poll for changes made on other devices (e.g. manager's phone) every few seconds
let stampMisses = 0;   // how many ticks in a row the timestamp was no use
function startSync(){
  setInterval(async ()=>{
    if(document.hidden) return;           // nothing to show while the app is in the background
    const active = document.activeElement;
    const isEditing = active && ['INPUT','TEXTAREA','SELECT'].includes(active.tagName);
    if(isEditing) return; // don't yank the screen while someone's typing
    if(typeof lxSaveTimer !== 'undefined' && lxSaveTimer) return; // a debounced save is still pending
    try{
      /* Ask only "when was it last touched?". The whole book used to come down
         every five seconds, which is what made scrolling and typing feel sticky. */
      let stamp = null, stampWorked = true;
      try{ stamp = await firebaseStamp(); }
      catch(e){ stampWorked = false; }

      if(stampWorked && stamp){
        markSynced(true);
        stampMisses = 0;
        if(state.lastUpdated && stamp <= state.lastUpdated) return;   // nothing new
      } else {
        /* Safety net: if the timestamp is missing or that call fails, fall back
           to reading the whole thing — just not on every tick. */
        stampMisses++;
        if(stampMisses % 6 !== 1) return;                              // about every 30 seconds
      }

      const remote = await firebaseGet();
      markSynced(true);
      if(remote && remote.lastUpdated && (!state.lastUpdated || remote.lastUpdated > state.lastUpdated)){
        state = remote;
        normalizeState();
        render();
      }
    }catch(e){ markSynced(false); /* offline or unreachable, just skip this tick */ }
  }, 5000);
}

function statusFor(workerId, date){
  return (state.attendance[workerId] && state.attendance[workerId][date]) || null;
}

  if(state.attendance[workerId][date] === status){
    delete state.attendance[workerId][date]; // tap again to clear
  } else {
    state.attendance[workerId][date] = status;
  }
  saveState();
  render();
}

// `w` is optional: pass it and days outside his employment window are ignored,
// so a closed account never keeps collecting blank days.
function periodStats(workerId, parts, w){
  const dates = periodDates(parts).filter(d=> !w || employedOn(w, d));
  let present=0, half=0, absent=0;
  dates.forEach(d=>{
    const s = statusFor(workerId, d);
    if(s==='P') present++;
    else if(s==='H') half++;
    else if(s==='A') absent++;
  });
  return {present, half, absent, marked: present+half+absent};
}
function advancesInPeriod(workerId, parts){
  const b = periodBounds(parts);
  return state.advances.filter(a=> a.workerId===workerId && a.date>=b.start && a.date<=b.end);
}
function outstandingBalance(workerId){
  return state.advances
    .filter(a=> a.workerId===workerId)
    .reduce((sum,a)=> sum + (a.type==='repaid' ? -Number(a.amount) : Number(a.amount)), 0);
}
// ---- discipline warnings (dress code / gloves etc.) ----
function warningsInPeriod(workerId, parts){
  const b = periodBounds(parts);
  return (state.warnings||[]).filter(x=> x.workerId===workerId && x.date>=b.start && x.date<=b.end);
}
function combinedMonthWarnings(workerId, parts){
  const mm = pad(parts.m);
  const lastDay = new Date(parts.y, parts.m, 0).getDate();
  const start = parts.y+'-'+mm+'-01';
  const end = parts.y+'-'+mm+'-'+pad(lastDay);
  return (state.warnings||[]).filter(x=> x.workerId===workerId && x.date>=start && x.date<=end);
}
function warningsForScope(w, parts){
  return w.payFreq==='monthly' ? combinedMonthWarnings(w.id, parts) : warningsInPeriod(w.id, parts);
}

// ---- canteen: cool drinks / food taken from the restaurant ------------------
// Recovered off the salary for the same stretch of days the salary card covers —
// the whole month for monthly staff, the fortnight for biweekly staff. Same rule
// as warnings and advances, so the three can never disagree.
function canteenInPeriod(workerId, parts){
  const b = periodBounds(parts);
  return (state.canteen||[]).filter(x=> x.workerId===workerId && x.date>=b.start && x.date<=b.end);
}
function combinedMonthCanteen(workerId, parts){
  const mm = pad(parts.m);
  const lastDay = new Date(parts.y, parts.m, 0).getDate();
  const start = parts.y+'-'+mm+'-01';
  const end = parts.y+'-'+mm+'-'+pad(lastDay);
  return (state.canteen||[]).filter(x=> x.workerId===workerId && x.date>=start && x.date<=end);
}
function canteenForScope(w, parts){
  return w.payFreq==='monthly' ? combinedMonthCanteen(w.id, parts) : canteenInPeriod(w.id, parts);
}
// One bill's worth: every line is quantity × price, so a blank quantity means 1.
function canteenLineTotal(l){
  const qty = (l.qty===''||l.qty==null) ? 1 : Number(l.qty);
  return (Number(qty)||0) * (Number(l.price)||0);
}
function canteenEntryTotal(e){
  if(!e) return 0;
  if(Array.isArray(e.lines)) return e.lines.reduce((s,l)=> s + canteenLineTotal(l), 0);
  return Number(e.total)||0;
}
function canteenSum(list){
  return (list||[]).reduce((s,e)=> s + canteenEntryTotal(e), 0);
}

// dates in this card's scope where the worker was Absent (A) or Half-day (H)
function absencesForScope(w, parts){
  const dates = (w.payFreq==='monthly')
    ? monthHalves(parts).reduce((acc,p)=> acc.concat(periodDates(p)), [])
    : periodDates(parts);
  const abs=[], half=[];
  dates.filter(d=> employedOn(w,d)).forEach(d=>{ const s=statusFor(w.id,d); if(s==='A') abs.push(d); else if(s==='H') half.push(d); });
  return {abs, half};
}

          <div class="row"><span>ఈ నెల ${dim} రోజులు · ${fmtRupee(dailyRate)} × ${dim} = ${fmtRupee(monthTotal)} (పూర్తి నెల)</span><span></span></div>
          <div class="row"><span>హాజరు <span class="pill present">${stats.present}P</span><span class="pill half">${stats.half}½</span><span class="pill absent">${stats.absent}A</span></span><span></span></div>
          ${absBlock}
          <div class="row"><span>పూర్తి జీతం (ఈ పీరియడ్ · ${daysThisPeriod} రోజులు)</span><span>+${fmtRupee(fullPeriodAmount)}</span></div>
          ${partRow}
          ${deductRow}
          ${warnRow}
          ${advRows}
          <div class="row net"><span>చెల్లించవలసినది</span><span class="amt">${fmtRupee(net)}</span></div>

        ${(outstanding>0 || recovered>0) ? `<div class="outstanding-note">బకాయి అడ్వాన్స్ (Outstanding advance): <b>${fmtRupee(outstanding)}</b>${recovered>0 ? ` <span class="adj">— ఈ జీతం నుండి ${fmtRupee(recovered)} తీసివేశారు (${fmtRupee(owedBefore)} → ${fmtRupee(owedAfter)})</span>` : ''}</div>` : ''}
        ${paid ? `
        <div class="paid-banner">
          <span>✓ <b>చెల్లించారు</b> ${fmtRupee(paid.amount)} · ${fmtShort(paid.date)}${paid.note?' · '+paid.note:''}</span>
          <button class="undo" data-w="${w.id}" data-act="unpay">తీసివేయి (undo)</button>
        </div>` : `
        <button class="pay-btn" data-w="${w.id}" data-net="${Math.round(net)}">✓ జీతం చెల్లించారు (Mark salary paid)</button>`}
        <button class="add-advance-btn" data-w="${w.id}" data-type="given">+ అడ్వాన్స్ జోడించండి (Add advance)</button>
        <button class="add-advance-btn deduct-btn" data-w="${w.id}" data-type="repaid">\u2212 జీతం నుండి అడ్వాన్స్ తీసివేయండి (Deduct advance from salary)</button>

  main.querySelectorAll('.rateField').forEach(inp=>{

      if(w.payFreq==='monthly') w.monthly = Number(inp.value)||0;
      else w.dayRate = Number(inp.value)||0;
      saveState();
      render();
    });
  });
  main.querySelectorAll('.tipField').forEach(inp=>{
    inp.addEventListener('focus', ()=> inp.select());
    inp.addEventListener('change', ()=>{
      const w = state.workers.find(x=>x.id===inp.dataset.w);
      setTip(w, parts, inp.value);
      saveState();
      render();
    });
  });
  main.querySelectorAll('.pay-btn').forEach(btn=>{
    btn.addEventListener('click', ()=> openPaySalaryModal(btn.dataset.w, Number(btn.dataset.net)));

  main.querySelectorAll('.add-advance-btn').forEach(btn=>{

function renderSummary(){
  const main = document.getElementById('mainArea');
  const parts = currentPeriodParts();
  let totalNet=0, totalAdv=0, totalPresent=0, totalAbsent=0, paidTotal=0, pendingTotal=0, paidCount=0;
  const inPeriod = workersForPeriod(parts);
  inPeriod.forEach(w=>{
    const {stats} = computeEarned(w, parts);
    const {recovered, net} = salaryNet(w, parts);
    totalNet += net;
    totalAdv += recovered;
    totalPresent += stats.present;
    totalAbsent += stats.absent;
    const p = getPayment(w, parts);
    if(p){ paidTotal += Number(p.amount)||0; paidCount++; }
    else { pendingTotal += net; }
  });
  const payable = paidTotal + pendingTotal;
  const pct = payable>0 ? Math.round(paidTotal/payable*100) : (inPeriod.length?100:0);
  const allDone = pendingTotal<=0 && inPeriod.length>0;

  // ---- who has been paid for this period, who hasn't ----
  const payStatus = inPeriod.map(w=>({w, p:getPayment(w, parts), net:salaryNet(w, parts).net}))
    .sort((a,b)=> (a.p?1:0)-(b.p?1:0));       // unpaid first — that's the list you act on
  const paySection = `
    <div class="sum-head">
      <span class="t">జీతం చెల్లింపు స్థితి</span>
      <span class="c">${paidCount}/${inPeriod.length} చెల్లించారు · payment status</span>
    </div>
    <div class="card sum-card">
      ${inPeriod.length===0 ? '<div class="empty">ఈ పీరియడ్‌కు సిబ్బంది ఎవరూ లేరు</div>' :
      payStatus.map(({w,p,net})=>`
        <div class="owe-item ${p?'is-paid':'is-due'}">
          <div class="avatar">${w.name.charAt(0)}</div>
          <div class="meta"><div class="wname">${w.te}${isClosed(w)?'<span class="pill closed">మాజీ</span>':''}<span class="en">${w.name}${p?' · '+fmtShort(p.date)+(p.note?' · '+p.note:''):' · ఇంకా చెల్లించలేదు (not paid yet)'}</span></div></div>
          <div class="bal" style="color:${p?'var(--present)':'var(--absent)'}">${p?'✓ '+fmtRupee(p.amount):fmtRupee(net)}<small>${p?'ఇచ్చాము':'ఇవ్వాలి'}</small></div>
        </div>`).join('') +
      `<div class="owe-total ok"><span>చెల్లించినది (${paidCount}/${inPeriod.length})</span><span>${fmtRupee(paidTotal)}</span></div>
       <div class="owe-total ${pendingTotal>0?'due':'ok'}"><span>ఇంకా చెల్లించవలసినది (pending)</span><span>${fmtRupee(pendingTotal)}</span></div>`}
    </div>`;

  const allAdvances = [...state.advances].sort((a,b)=> b.date.localeCompare(a.date));

  // outstanding = all-time given minus repaid, per worker (matches the salary card figure)
  const owed = state.workers.map(w=>{
    const list = state.advances.filter(a=> a.workerId===w.id);
    const given  = list.filter(a=>a.type!=='repaid').reduce((s,a)=>s+Number(a.amount),0);
    const repaid = list.filter(a=>a.type==='repaid').reduce((s,a)=>s+Number(a.amount),0);
    return {w, given, repaid, bal: given-repaid};
  }).filter(o=> Math.round(o.bal)!==0).sort((a,b)=> b.bal-a.bal);
  const owedTotal = owed.reduce((s,o)=>s+o.bal,0);
  const owedSection = `
    <div class="sum-head">
      <span class="t">బకాయి అడ్వాన్స్</span>
      <span class="c">${owed.length} మంది · outstanding by worker</span>
    </div>
    <div class="card sum-card">
      ${owed.length===0 ? '<div class="empty">బకాయిలు లేవు ✓<br>(nothing outstanding)</div>' :
        owed.map(o=>{
          const back = o.given>0 ? Math.min(100, Math.round(o.repaid/o.given*100)) : 0;
          return `<div class="owe-item is-owed">
          <div class="avatar">${o.w.name.charAt(0)}</div>
          <div class="meta">
            <div class="wname">${o.w.te}${isClosed(o.w)?'<span class="pill closed">మాజీ · సెటిల్ చేయాలి</span>':''}<span class="en">ఇచ్చారు ${fmtRupee(o.given)} \u2212 తిరిగి ${fmtRupee(o.repaid)}</span></div>
            <div class="repaid-bar"><i style="width:${back}%"></i></div>
          </div>
          <div class="bal" style="color:${o.bal>=0?'var(--absent)':'var(--present)'}">${fmtRupee(o.bal)}<small>${back}% తిరిగి</small></div>
        </div>`;}).join('') +
        `<div class="owe-total ${owedTotal>0?'due':'ok'}"><span>మొత్తం బకాయి (Total)</span><span>${fmtRupee(owedTotal)}</span></div>`
      }
    </div>`;

  main.innerHTML = `
    <div class="summary-total">
      <div class="label">${periodTopLabel(parts)} \u00b7 ${periodBottomLabel(parts)}</div>
      <div class="val">${fmtRupee(totalNet)}<small>ఈ పీరియడ్ మొత్తం జీతం · total payable</small></div>
      <div class="paybar"><i style="width:${pct}%"></i></div>
      <div class="paybar-lbl"><span>${pct}% చెల్లించారు</span><span>${paidCount}/${inPeriod.length} మంది</span></div>
      <div class="sub-row">
        <div>ఇంకా ఇవ్వాలి<span>${fmtRupee(pendingTotal)}</span></div>
        <div>ఈ పీరియడ్ కోత<span>${fmtRupee(totalAdv)}</span></div>
        <div>హాజరు రోజులు<span>${totalPresent}</span></div>
      </div>
    </div>

    <div class="sum-grid">
      <div class="scard paid">
        <div class="k">✓ చెల్లించాము</div>
        <div class="v">${fmtRupee(paidTotal)}</div>
        <div class="e">Paid this period</div>
      </div>
      <div class="scard pending${allDone?' done':''}">
        <div class="k">⏳ ఇంకా ఇవ్వాలి</div>
        <div class="v">${fmtRupee(pendingTotal)}</div>
        <div class="e">${allDone?'All settled ✓':'Still pending'}</div>
      </div>
      <div class="scard owed">
        <div class="k">⚖️ మొత్తం బకాయి</div>
        <div class="v">${fmtRupee(owedTotal)}</div>
        <div class="e">Outstanding advances</div>
      </div>
      <div class="scard days">
        <div class="k">📋 హాజరు / గైర్హాజరు</div>
        <div class="v">${totalPresent} <span style="font-size:13px;opacity:.5">/</span> ${totalAbsent}</div>
        <div class="e">Present / absent days</div>
      </div>
    </div>

    ${paySection}
    ${owedSection}

    <div class="sum-head">
      <span class="t">అడ్వాన్స్ చరిత్ర</span>
      <span class="c">${allAdvances.length} రికార్డులు · advance history</span>
    </div>
    <div class="card sum-card">
      ${allAdvances.length===0 ? '<div class="empty">ఇంకా అడ్వాన్స్ లు లేవు</div>' :
        allAdvances.map(a=>{
          const w = state.workers.find(x=>x.id===a.workerId);
          const isRepaid = a.type==='repaid';
          const d = new Date(a.date+'T00:00:00');
          const mo = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'][d.getMonth()];
          return `<div class="adv-item ${isRepaid?'repaid':'given'}">
            <div class="datechip"><div class="d">${d.getDate()}</div><div class="mo">${mo}</div></div>
            <div class="meta">
              <div class="wname">${isRepaid?'📥':'📤'} ${w?w.te:a.workerId}${w&&isClosed(w)?'<span class="pill closed">మాజీ</span>':''}<span class="en">${isRepaid?'జీతం నుండి తిరిగి తీసుకున్నాము':'అడ్వాన్స్ ఇచ్చాము'}${a.note?' · '+a.note:''}</span></div>
            </div>
            <div class="amt">${isRepaid?'+':'\u2212'}${fmtRupee(a.amount)}<small>${isRepaid?'వసూలు':'ఇచ్చాము'}</small></div>
            <button class="del" data-id="${a.id}">✕</button>
          </div>`;
        }).join('')
      }
    </div>
  `;
  main.querySelectorAll('.del').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const a = state.advances.find(x=>x.id===btn.dataset.id);
      if(a && !confirm('ఈ అడ్వాన్స్ రికార్డును తీసివేయాలా?\nDelete this advance record?\n\n'+fmtRupee(a.amount)+' · '+fmtShort(a.date))) return;
      state.advances = state.advances.filter(x=>x.id!==btn.dataset.id);
      saveState();
      render();
    });
  });
}

// Laxman's tab recalculates in place: rebuilding the whole tab on every keystroke
// destroyed the field being typed into, so nothing could be entered on iPhone.
// Inputs write straight to state, refresh only the figures, and save on a debounce.
let lxSaveTimer = null;
function lxQueueSave(){
  if(lxSaveTimer) clearTimeout(lxSaveTimer);
  lxSaveTimer = setTimeout(()=>{ lxSaveTimer = null; saveState(); }, 1200);
}
function lxNum(v){ const n = Number(v); return (!v && v!==0) || isNaN(n) || n<0 ? 0 : n; }
function lxVal(n){ return n ? String(n) : ''; }

// ---- Roti tab removed (Aug 2026). The bread ledger UI is gone; any figures already
//      saved under state.laxman.periods are left untouched so nothing is lost and old
//      roti payments keep showing in History.
// Language for this tab only. Kept on the device, so it opens the way it was left.
let LX_LANG = localStorage.getItem('lxLang') || 'both';   // 'te' | 'en' | 'both'

// One row of the ledger. Telugu and English are BOTH written every time; the
// wrapper's lang- class decides which of the two is on screen.
function lxRowHTML(o){
  const tools = o.tools ? `<div class="rowtools">${o.tools}</div>` : '';
  return `<div class="lx-row ${o.off?'off':''}" data-row="${o.key}">
    <div class="lbl"><b>${o.te||''}</b><span>${o.en||''}</span></div>
    <input type="number" inputmode="numeric" pattern="[0-9]*" class="${o.cls}" ${o.attr||''}
           value="${lxVal(o.val)}" placeholder="${o.ph||'0'}" ${o.off?'disabled':''}>
    <div class="unit">₹</div>${tools}
  </div>`;
}
const lxToolsBuiltin = f =>

   <button class="t-hide" data-f="${f}" title="Show / hide">${lxHidden(f)?'🚫':'👁'}</button>`;

      ${LX_EDIT ? `<button class="lx-addbtn" data-add="we">＋ <span class="t-te">మనం ఇవ్వాల్సిన కొత్త ఫీల్డ్</span><span class="t-en">Add a field we pay Laxman</span></button>` : ''}
