    <div class="settle" style="margin-bottom:10px">
      <div class="label"><span class="t-te">మొత్తం · లక్ష్మణ్ ఇవ్వాలి · ${monthLabel}</span><span class="t-en solo">Total Laxman owes · ${monthLabel}</span></div>
      <div class="val" id="lxNetMonth">–</div>
      <div class="split">
        <div><span class="t-te">క్లీనింగ్ + ఇతరాలు</span><span class="t-en solo">Cleaning + others</span><span id="lxS1">–</span></div>
        <div style="text-align:center"><span class="t-te">కరెంట్ + అద్దె</span><span class="t-en solo">Current + rent</span><span id="lxS2">–</span></div>
        <div style="text-align:right"><span class="t-te">వాచ్‌మన్</span><span class="t-en solo">Watchman</span><span id="lxS3">–</span></div>
      </div>
    </div>

    <div class="card">
      <div class="lx-cardhead">
        <h3>🧾 <span class="t-te">వసూలు</span><span class="t-en solo">Cash collected</span></h3>
        <span class="tag monthly">${monthLabel}</span>
      </div>
      ${lxRowHTML({key:'received', te:'లక్ష్మణ్ ఇచ్చిన డబ్బు', en:'Cash Laxman has given us',
                   val:m.received, cls:'lxM', attr:'data-f="received"'})}
      ${(Number(m.given)||0) ? lxRowHTML({key:'given', te:'మనం ఇచ్చిన డబ్బు', en:'Cash we gave Laxman',
                   val:m.given, cls:'lxM', attr:'data-f="given"'}) : ''}
      <div class="lx-tot"><span class="t-te">లక్ష్మణ్ ఇవ్వాలి (total)</span><span class="t-en solo">Laxman owes (total)</span><span class="lx" id="lxTotHis">–</span></div>
      <div class="lx-tot"><span class="t-te">వసూలు అయినది</span><span class="t-en solo">Received</span><span class="lx" id="lxTotGot">–</span></div>
    </div>

    <div class="settle">
      <div class="label"><span class="t-te">మిగిలిన బ్యాలెన్స్ · ${monthLabel}</span><span class="t-en solo">Balance left · ${monthLabel}</span></div>
      <div class="val" id="lxFinal">–</div>
      <div class="split">
        <div><span class="t-te">లక్ష్మణ్ ఇవ్వాలి</span><span class="t-en solo">He owes</span><span id="lxSB">–</span></div>
        <div style="text-align:center"><span class="t-te">మనం ఇవ్వాలి</span><span class="t-en solo">We owe</span><span id="lxSD">–</span></div>
        <div style="text-align:right"><span class="t-te">వసూలు</span><span class="t-en solo">Received</span><span id="lxSC">–</span></div>
      </div>
    </div>
    <div class="card" style="margin-top:-4px">
      ${m.settled ? `
      <div class="paid-banner" style="margin-top:0">
        <span>✓ <b>${m.settled.dir==='in' ? 'తీసుకున్నాము' : 'ఇచ్చాము'}</b> ${fmtRupee(m.settled.amount)} · ${fmtShort(m.settled.date)}${m.settled.note?' · '+m.settled.note:''}</span>
        <button class="undo" id="lxUnpayAll">తీసివేయి (undo)</button>
      </div>` : `
      <button class="pay-btn" style="margin-top:0" id="lxPayAll">✓ <span class="t-te">వసూలు అయింది</span><span class="t-en">Mark collected</span></button>`}
    </div>
    <div class="empty">
      <span class="t-te">వేరే నెల చూడటానికి పైన ‹ › నొక్కండి</span>
      <span class="t-en">Use ‹ › above to see another month</span><br>
      <span style="font-size:11px">(this whole tab is one monthly settlement)</span>
    </div>
  </div>
  `;

  // recompute every figure from state without touching the inputs themselves
  function lxRefresh(){
    const mc = lxMonthCalc(parts);
    const st = lxSettlement(parts);
    const set = (id, txt)=>{ const el = main.querySelector('#'+id); if(el) el.textContent = txt; };
    set('lxThree', fmtRupee(mc.cleaning + mc.current + mc.rent + mc.extraOwes));
    set('lxWatchHalf', fmtRupee(mc.watchmanOwed));
    set('lxWeTot', fmtRupee(mc.extraWe));
    set('lxS1', fmtRupee(mc.cleaning + mc.extraOwes));
    set('lxS2', fmtRupee(mc.current + mc.rent));
    set('lxS3', fmtRupee(mc.watchmanOwed));
    set('lxTotHis', fmtRupee(st.lxOwes));
    set('lxTotGot', '-'+fmtRupee(st.received));
    set('lxSB', fmtRupee(st.lxOwes));
    set('lxSD', fmtRupee(st.weOwe));
    set('lxSC', fmtRupee(st.received));
    const me = main.querySelector('#lxNetMonth');
    if(me) me.innerHTML = `${fmtRupee(mc.lxOwes)}<small>${LX_LANG==='en'
      ? 'cleaning + current + rent + watchman · Laxman owes us'
      : 'క్లీనింగ్ + కరెంట్ + అద్దె + వాచ్‌మన్ · Laxman owes us'}</small>`;
    const fe = main.querySelector('#lxFinal');
    if(fe) fe.innerHTML = `${fmtRupee(Math.abs(st.balance))}<small>${st.balance>=0
      ? (LX_LANG==='en' ? 'we still owe Laxman' : 'ఇంకా మనం ఇవ్వాలి · we still owe Laxman')
      : (LX_LANG==='en' ? 'Laxman still owes us' : 'ఇంకా లక్ష్మణ్ ఇవ్వాలి · Laxman still owes us')}</small>`;
    const ba = main.querySelector('#lxPayAll'); if(ba) ba.dataset.net = Math.round(Math.abs(st.balance));
  }
  lxRefresh();

  // ---- language switch: no re-render, just swap which half is visible ----
  main.querySelectorAll('.lgb').forEach(b => b.addEventListener('click', ()=>{
    LX_LANG = b.dataset.lang;
    localStorage.setItem('lxLang', LX_LANG);
    const w = main.querySelector('.lxwrap');
    if(w) w.className = 'lxwrap lang-' + LX_LANG;
    main.querySelectorAll('.lgb').forEach(x => x.classList.toggle('on', x===b));
    lxRefresh();
  }));

  const eb = main.querySelector('#lxEditBtn');
  if(eb) eb.addEventListener('click', ()=>{ LX_EDIT = !LX_EDIT; renderLaxman(); });

  // built-in rows write straight onto the month
  main.querySelectorAll('.lxM').forEach(inp=>{
    inp.addEventListener('focus', ()=> inp.select());
    inp.addEventListener('input', ()=>{
      lxMonth(parts)[inp.dataset.f] = lxNum(inp.value);
      lxRefresh(); lxQueueSave();
    });
  });
  // added-by-hand rows write into this month's own extra{} — the field itself is
  // shared across months, the AMOUNT never is.
  main.querySelectorAll('.lxX').forEach(inp=>{
    inp.addEventListener('focus', ()=> inp.select());
    inp.addEventListener('input', ()=>{
      const mm = lxMonth(parts);
      if(!mm.extra) mm.extra = {};
      mm.extra[inp.dataset.id] = lxNum(inp.value);
      lxRefresh(); lxQueueSave();
    });
  });

  // ---- edit-mode tools ----
  main.querySelectorAll('.t-rename').forEach(b => b.addEventListener('click',
    ()=> openLxFieldModal({mode:'builtin', f:b.dataset.f, parts})));
  main.querySelectorAll('.t-hide').forEach(b => b.addEventListener('click', ()=>{
    const f = b.dataset.f, root = lxRoot();
    const i = root.hidden.indexOf(f);
    if(i >= 0) root.hidden.splice(i,1); else root.hidden.push(f);
    saveState(); renderLaxman();
  }));
  main.querySelectorAll('.t-edit').forEach(b => b.addEventListener('click',
    ()=> openLxFieldModal({mode:'custom', id:b.dataset.id, parts})));
  main.querySelectorAll('.t-del').forEach(b => b.addEventListener('click', ()=>{
    const id = b.dataset.id, fld = lxFields().find(x=>x.id===id);
    if(!fld) return;
    if(!confirm('"'+fld.te+' / '+fld.en+'" — ఈ ఫీల్డ్‌ను అన్ని నెలల నుంచి తీసివేయాలా?\n\nRemove this field from every month? The amounts typed against it stop counting.')) return;
    const root = lxRoot();
    root.fields = root.fields.filter(x=>x.id!==id);
    saveState(); renderLaxman();
  }));
  main.querySelectorAll('[data-add]').forEach(b => b.addEventListener('click',
    ()=> openLxFieldModal({mode:'new', side:b.dataset.add, parts})));

  const payAll = main.querySelector('#lxPayAll');
  if(payAll) payAll.addEventListener('click', ()=> openLxSettleModal(parts, Number(payAll.dataset.net)||0));
  const unAll = main.querySelector('#lxUnpayAll');
  if(unAll) unAll.addEventListener('click', ()=>{
    if(confirm('\u0c08 \u0c17\u0c41\u0c30\u0c4d\u0c24\u0c41\u0c28\u0c41 \u0c24\u0c40\u0c38\u0c3f\u0c35\u0c47\u0c2f\u0c3e\u0c32\u0c3e?\nUndo this record?')){
      const mm = lxMonth(parts);
      if(mm.settled){
        // roll the cash figure back so the balance returns to what it was
        if(mm.settled.dir==='in') mm.received = lxNum((Number(mm.received)||0) - (Number(mm.settled.amount)||0));
        else                      mm.given    = lxNum((Number(mm.given)||0)    - (Number(mm.settled.amount)||0));
      }
      mm.settled = null; saveState(); render();
    }
  });
}

// ══════════════════════════════════════════════════════════════════════
//  ADD / RENAME A FIELD
//  Three jobs, one sheet:
//    mode:'new'      — a brand new row, on either side of the settlement
//    mode:'custom'   — edit a row that was added by hand
//    mode:'builtin'  — rename one of the five original rows
//  The "→ తెలుగు" button fills the Telugu box from the English one, so a label
//  can be typed in English and still read in Telugu on the shop floor.
// ══════════════════════════════════════════════════════════════════════
function openLxFieldModal(o){
  const root = lxRoot();
  const isBuiltin = o.mode === 'builtin';
  const fld = o.mode === 'custom' ? lxFields().find(x=>x.id===o.id) : null;
  if(o.mode === 'custom' && !fld) return;
  const cur = isBuiltin ? lxLabel(o.f) : (fld || {te:'', en:'', side:o.side||'owes'});
  const side = isBuiltin ? null : (fld ? (fld.side||'owes') : (o.side||'owes'));
  const m = lxMonth(o.parts);
  const amt = fld ? (Number((m.extra||{})[fld.id])||0) : 0;
  const esc = t => String(t||'').replace(/"/g,'&quot;');

  const bg = document.createElement('div');
  bg.className = 'modal-bg';
  bg.innerHTML = `
    <div class="modal">
      <h3>${o.mode==='new' ? '➕ కొత్త ఫీల్డ్ · New field'
            : isBuiltin ? '✎ పేరు మార్చు · Rename row'
            : '✎ ఫీల్డ్ మార్చు · Edit field'}</h3>
      <div class="field">
        <label>English name</label>
        <input type="text" id="lfEn" value="${esc(cur.en)}" placeholder="water bill, generator diesel…">
        <button class="te-btn" id="lfTr">→ తెలుగులో రాయి · Translate to Telugu</button>
        <div class="fieldhint">Type it in English and tap the button — the Telugu box below fills in. Correct it there if needed.</div>
      </div>
      <div class="field">
        <label>తెలుగు పేరు (Telugu name)</label>
        <input type="text" id="lfTe" value="${esc(cur.te)}" placeholder="నీళ్ల బిల్లు">
      </div>
      ${isBuiltin ? '' : `
      <div class="field">
        <label>ఏ వైపు? (Which side)</label>
        <select id="lfSide">
          <option value="owes"${side==='owes'?' selected':''}>లక్ష్మణ్ మనకు ఇవ్వాలి · Laxman pays us</option>
          <option value="we"${side==='we'?' selected':''}>మనం లక్ష్మణ్‌కు ఇవ్వాలి · We pay Laxman</option>
        </select>
      </div>
      <div class="field">
        <label>ఈ నెల మొత్తం (Amount for ${periodBottomLabel(o.parts)}, ₹)</label>
        <input type="number" inputmode="numeric" id="lfAmt" value="${amt||''}" placeholder="0">
        <div class="fieldhint">The field itself shows on every month. This amount is only for the month on screen.</div>
      </div>`}
      ${isBuiltin ? `<div class="wn-hint">This is one of the original rows. Only its name changes — the figures already saved against it stay exactly as they are.</div>` : ''}
      <div class="modal-actions">
        <button class="btn ghost" id="lfCancel">రద్దు</button>
        <button class="btn primary" id="lfSave">సేవ్</button>
      </div>
    </div>`;
  document.body.appendChild(bg);
  const close = ()=> bg.remove();
  bg.querySelector('#lfCancel').addEventListener('click', close);
  bg.addEventListener('click', e => { if(e.target===bg) close(); });
  bg.querySelector('#lfTr').addEventListener('click', ()=>{
    const en = bg.querySelector('#lfEn').value.trim();
    if(!en){ bg.querySelector('#lfEn').focus(); return; }
    bg.querySelector('#lfTe').value = enToTelugu(en);
  });
  bg.querySelector('#lfSave').addEventListener('click', ()=>{
    const en = bg.querySelector('#lfEn').value.trim();
    let te = bg.querySelector('#lfTe').value.trim();
    if(!en && !te){ alert('పేరు రాయండి · Give the field a name'); return; }
    if(!te) te = enToTelugu(en);           // Telugu left blank — fill it in
    if(isBuiltin){
      root.labels[o.f] = {te, en: en || lxLabel(o.f).en};
    } else if(fld){
      fld.te = te; fld.en = en || te;
      fld.side = bg.querySelector('#lfSide').value;
      if(!m.extra) m.extra = {};
      m.extra[fld.id] = lxNum(bg.querySelector('#lfAmt').value);
    } else {
      const id = 'f'+Date.now().toString(36)+Math.random().toString(36).slice(2,5);
      root.fields.push({id, te, en: en || te, side: bg.querySelector('#lfSide').value});
      if(!m.extra) m.extra = {};
      m.extra[id] = lxNum(bg.querySelector('#lfAmt').value);
    }
    saveState(); close(); renderLaxman();
  });
}

// The Laxman tab settles in one go: everything he owes us for the month, against what
// he has actually handed over. This records that one payment.
function openLxSettleModal(parts, suggested){
  const st = lxSettlement(parts);
  const weArePaying = st.balance >= 0;
  const dir = weArePaying ? 'out' : 'in';
  const bg = document.createElement('div');
  bg.className='modal-bg';
  bg.innerHTML = `
    <div class="modal">
      <h3>\ud83e\uddfe \u0c2e\u0c4a\u0c24\u0c4d\u0c24\u0c02 \u0c32\u0c46\u0c15\u0c4d\u0c15 \u00b7 ${periodBottomLabel(parts)}</h3>
      <div class="wn-hint">
        \u0c32\u0c15\u0c4d\u0c37\u0c4d\u0c2e\u0c23\u0c4d \u0c07\u0c35\u0c4d\u0c35\u0c3e\u0c32\u0c3f (total): <b>${fmtRupee(st.lxOwes)}</b><br>
        \u0c07\u0c2a\u0c4d\u0c2a\u0c1f\u0c3f\u0c15\u0c47 \u0c35\u0c38\u0c42\u0c32\u0c41 (received): <b>${fmtRupee(st.received)}</b><br>
        ${weArePaying
          ? '\u2192 \u0c2e\u0c28\u0c02 \u0c32\u0c15\u0c4d\u0c37\u0c4d\u0c2e\u0c23\u0c4d\u200c\u0c15\u0c41 \u0c07\u0c35\u0c4d\u0c35\u0c3e\u0c32\u0c3f (we pay Laxman)'
          : '\u2192 \u0c32\u0c15\u0c4d\u0c37\u0c4d\u0c2e\u0c23\u0c4d \u0c2e\u0c28\u0c15\u0c41 \u0c07\u0c35\u0c4d\u0c35\u0c3e\u0c32\u0c3f (Laxman pays us)'}
      </div>
      <div class="field"><label>\u0c24\u0c47\u0c26\u0c40 (Date)</label><input type="date" id="lxDate" value="${todayStr()}"></div>
      <div class="field"><label>\u0c2e\u0c4a\u0c24\u0c4d\u0c24\u0c02 (Amount \u20b9)</label><input type="number" inputmode="numeric" id="lxAmt" value="${Math.abs(Math.round(st.balance))}"></div>
      <div class="field"><label>\u0c28\u0c4b\u0c1f\u0c4d (Note, optional \u2014 cash / GPay)</label><input type="text" id="lxNote" placeholder=""></div>
      <div class="modal-actions">
        <button class="btn ghost" id="lxCancel">\u0c30\u0c26\u0c4d\u0c26\u0c41</button>
        <button class="btn primary" id="lxSave">\u0c38\u0c47\u0c35\u0c4d</button>
      </div>
    </div>`;
  document.body.appendChild(bg);
  bg.querySelector('#lxCancel').addEventListener('click', ()=> bg.remove());
  bg.addEventListener('click', (e)=>{ if(e.target===bg) bg.remove(); });
  bg.querySelector('#lxSave').addEventListener('click', ()=>{
    const rec = {
      date: bg.querySelector('#lxDate').value || todayStr(),
      amount: Number(bg.querySelector('#lxAmt').value)||0,
      note: bg.querySelector('#lxNote').value.trim(),
      dir,
      at: Date.now()
    };
    // The button is a shortcut for the cash fields, so it adds into them and the
    // balance below can never disagree with the record.
    const mo = lxMonth(parts);
    if(dir==='in') mo.received = lxNum((Number(mo.received)||0) + rec.amount);
    else           mo.given    = lxNum((Number(mo.given)||0)    + rec.amount);
    mo.settled = rec;
    saveState();
    bg.remove();
    render();
  });
}

// ---- History: every payment ever recorded, newest first ----
// Reads the same records the Salary and Laxman tabs write — nothing is stored twice.
let histFilter = 'all';

function paymentHistory(){
  const rows = [];
  // 1. staff salary payments  {'workerId|2026-7-1': {...}}
  Object.keys(state.payments||{}).forEach(k=>{
    const rec = state.payments[k];
    if(!rec || !rec.date) return;
    const wid = k.split('|')[0];
    const bits = (k.split('|')[1]||'').split('-');
    const parts = {y:Number(bits[0]), m:Number(bits[1]), half: bits[2]==='M' ? 1 : Number(bits[2])};
    const w = state.workers.find(x=>x.id===wid);
    const scopeLabel = bits[2]==='M'
      ? periodBottomLabel(parts)+' · పూర్తి నెల'
      : periodTopLabel(parts)+' '+periodBottomLabel(parts);
    rows.push({
      group:'salary', key:k, date:rec.date, at:rec.at||0, amount:Number(rec.amount)||0,
      note:rec.note||'', dir:'out',
      title: (w ? w.te : wid) + (w && isClosed(w) ? ' (మాజీ)' : ''),
      sub: 'జీతం · '+scopeLabel, tag: w ? w.name : wid
    });
  });
  // 2. roti/naan paid, per fortnight  {'2026-7-1': {paid:{...}}}
  Object.keys((state.laxman&&state.laxman.periods)||{}).forEach(k=>{
    const rec = state.laxman.periods[k].paid;
    if(!rec || !rec.date) return;
    const bits = k.split('-');
    const parts = {y:Number(bits[0]), m:Number(bits[1]), half:Number(bits[2])};
    rows.push({
      group:'roti', key:'lxp|'+k, date:rec.date, at:rec.at||0, amount:Number(rec.amount)||0,
      note:rec.note||'', dir:'out',
      title:'రొట్టె / నాన్ 🫓', sub:'మొత్తం · '+periodTopLabel(parts)+' '+periodBottomLabel(parts), tag:'Roti'
    });
  });
  // 3. the one monthly Laxman settlement  {'2026-7': {settled:{...}}}
  //    (older per-side 'paid' records are still read below so past months stay visible)
  Object.keys((state.laxman&&state.laxman.months)||{}).forEach(k=>{
    const mo = state.laxman.months[k];
    const bits = k.split('-');
    const parts = {y:Number(bits[0]), m:Number(bits[1]), half:1};
    const rec = mo.settled;
    if(rec && rec.date){
      rows.push({
        group:'laxman', key:'lxs|'+k, date:rec.date, at:rec.at||0, amount:Number(rec.amount)||0,
        note:rec.note||'', dir: rec.dir==='in' ? 'in' : 'out',
        title:'లక్ష్మణ్ (కంటైనర్) 🧾',
        sub:'మొత్తం లెక్క · '+periodBottomLabel(parts), tag:'Laxman'
      });
    }
    const old = mo.paid;
    if(old && old.date){
      rows.push({
        group:'laxman', key:'lxm|'+k, date:old.date, at:old.at||0, amount:Number(old.amount)||0,
        note:old.note||'', dir:'in',
        title:'లక్ష్మణ్ (కంటైనర్) 🧾', sub:'క్లీనింగ్ + వాచ్‌మన్ + ఛార్జ్ · '+periodBottomLabel(parts), tag:'Laxman'
      });
    }
  });
  // 4. advances — money handed over outside salary, and money taken back off a salary.
  //    Shown here read-only so the whole cash story sits in one place; they are still
  //    added/edited only from the Salary tab, so nothing can be deleted by accident.
  (state.advances||[]).forEach(a=>{
    if(!a || !a.date) return;
    const w = state.workers.find(x=>x.id===a.workerId);
    const repaid = a.type==='repaid';
    rows.push({
      group: repaid ? 'advrepaid' : 'advgiven',
      key:'adv|'+a.id, date:a.date, at:0, amount:Number(a.amount)||0,
      note:a.note||'', dir: repaid ? 'in' : 'out', readonly:true,
      title:(w ? w.te : a.workerId) + (repaid ? ' · అడ్వాన్స్ వసూలు' : ' · అడ్వాన్స్ ఇచ్చాము'),
      sub:(repaid ? 'జీతం నుండి తీసివేశాము · recovered from salary'
                  : 'అడ్వాన్స్ · advance given (జీతం కాదు)'),
      tag: w ? w.name : a.workerId
    });
  });
  rows.sort((a,b)=> a.date===b.date ? (b.at-a.at) : (a.date<b.date ? 1 : -1));
  return rows;
}

function deleteHistoryRow(row){
  if(row.key.startsWith('lxp|')) state.laxman.periods[row.key.slice(4)].paid = null;
  else if(row.key.startsWith('lxm|')) state.laxman.months[row.key.slice(4)].paid = null;
  else if(state.payments) delete state.payments[row.key];
}

function renderHistory(){
  const main = document.getElementById('mainArea');
  const all = paymentHistory();
  const rows = all.filter(r=> histFilter==='all' || r.group===histFilter);

  // Four separate buckets, because these are four different kinds of money and
  // adding them together is exactly what makes the ledger confusing to read.
  const sumOf = f => all.filter(f).reduce((s,r)=>s+r.amount,0);
  const salaryPaid  = sumOf(r=> r.group==='salary');
  const advGiven    = sumOf(r=> r.group==='advgiven');
  const advRepaid   = sumOf(r=> r.group==='advrepaid');
  const otherOut    = sumOf(r=> (r.group==='roti'||r.group==='laxman') && r.dir==='out');
  const otherIn     = sumOf(r=> r.group==='laxman' && r.dir==='in');
  const outstanding = advGiven - advRepaid;      // still in the workers' hands
  const cashOut     = salaryPaid + advGiven + otherOut;

  // group by the MONTH THE MONEY MOVED, not the period it was for
  const groups = [];
  rows.forEach(r=>{
    const p = partsFromDate(r.date);
    const label = periodBottomLabel(p);
    let g = groups.find(x=>x.label===label);
    if(!g){ g = {label, items:[], out:0, in:0}; groups.push(g); }
    g.items.push(r);
    if(r.dir==='out') g.out += r.amount; else g.in += r.amount;
  });

  const count = id => all.filter(r=> id==='all' || r.group===id).length;
  const chip = (id,label)=> count(id)===0 && id!=='all' ? ''
    : `<button data-f="${id}" class="${histFilter===id?'on':''} f-${id}">${label}<span class="c">${count(id)}</span></button>`;

  // Row accent + wording is driven entirely by the group, so salary, advance given,
  // advance recovered and container money can never look like the same thing.
  const KIND = {
    salary:    {cls:'k-salary',   icon:'💰', word:'జీతం ఇచ్చాము'},
    advgiven:  {cls:'k-advgiven', icon:'📤', word:'అడ్వాన్స్ ఇచ్చాము'},
    advrepaid: {cls:'k-advrep',   icon:'📥', word:'వసూలు అయింది'},
    roti:      {cls:'k-other',    icon:'🫓', word:'ఇచ్చాము'},
    laxman:    {cls:'k-other',    icon:'🧾', word:'—'}
  };

  main.innerHTML = `
    <div class="hist-hero">
      <div class="label">మొత్తం బయటకు వెళ్ళిన నగదు · total cash out</div>
      <div class="val">${fmtRupee(cashOut)}</div>
      <div class="hero-note">జీతం + అడ్వాన్స్ + ఇతరాలు · ${all.length} రికార్డులు</div>
    </div>

    <div class="hist-grid">
      <div class="hcard salary">
        <div class="k">💰 జీతం ఇచ్చాము</div>
        <div class="v">${fmtRupee(salaryPaid)}</div>
        <div class="e">Salary paid to staff</div>
      </div>
      <div class="hcard advout">
        <div class="k">📤 అడ్వాన్స్ ఇచ్చాము</div>
        <div class="v">${fmtRupee(advGiven)}</div>
        <div class="e">Advances given</div>
      </div>
      <div class="hcard advin">
        <div class="k">📥 అడ్వాన్స్ వసూలు</div>
        <div class="v">${fmtRupee(advRepaid)}</div>
        <div class="e">Recovered from salary</div>
      </div>
      <div class="hcard ${outstanding>0?'due':'clear'}">
        <div class="k">⚖️ బకాయి బ్యాలెన్స్</div>
        <div class="v">${fmtRupee(outstanding)}</div>
        <div class="e">${outstanding>0?'Still outstanding':'All settled'}</div>
      </div>
    </div>

    ${(otherOut||otherIn) ? `
    <div class="hist-other">
      <div><span>🧾 ఇతర చెల్లింపులు · other paid out</span><b>−${fmtRupee(otherOut)}</b></div>
      <div><span>💵 మనకు వచ్చినది · received back</span><b class="in">+${fmtRupee(otherIn)}</b></div>
    </div>` : ''}

    <div class="hist-filter">
      ${chip('all','అన్నీ (All)')}
      ${chip('salary','జీతం (Salary)')}
      ${chip('advgiven','అడ్వాన్స్ ఇచ్చాము')}
      ${chip('advrepaid','వసూలు')}
      ${chip('roti','రొట్టె (Roti)')}
      ${chip('laxman','లక్ష్మణ్ (Container)')}

    ${rows.length===0 ? `<div class="empty">ఇంకా ఏ రికార్డూ లేదు.<br>జీతం ట్యాబ్‌లో “చెల్లించారు” నొక్కితే ఇక్కడ కనిపిస్తుంది.<br>(Nothing recorded yet)</div>`
    : groups.map(g=>`
      <div class="hist-month">
        <span>${g.label}</span>

            </div>

    <div class="empty">ప్రతి రికార్డు తేదీతో సహా ఇక్కడ శాశ్వతంగా ఉంటుంది.<br>అడ్వాన్స్ రికార్డులు 🔒 — జీతం ట్యాబ్ నుండి మాత్రమే మార్చగలరు.</div>

  main.querySelectorAll('.hist-filter button').forEach(b=>{

  });
  main.querySelectorAll('.hist-item .del').forEach(b=>{

      if(confirm('ఈ చెల్లింపు రికార్డును తీసివేయాలా?\nDelete this payment record?\n\n'+row.title+' · '+fmtRupee(row.amount)+' · '+fmtShort(row.date))){

    <button class="add-advance-btn" id="addWorkerBtn">+ కొత్త సిబ్బందిని జోడించండి (Add worker)</button>

    <div class="wtab-intro" style="margin-top:14px;">

        w.active = true;
        delete w.endDate; delete w.closedOn; delete w.closeNote;
        saveState(); render();
      }
    });
  });
  main.querySelectorAll('.w-erase').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const w = state.workers.find(x=>x.id===btn.dataset.w);

      if(c.total>0){

    el.addEventListener('click', ()=> openEditWorkerModal(el.dataset.edit));
  });
  document.getElementById('addWorkerBtn').addEventListener('click', openAddWorkerModal);
}

// ---- close an account -------------------------------------------------------
// Nothing is deleted here. The worker keeps his row in state.workers (so every name
// in History stays readable) and only gains a last working day.
function openCloseWorkerModal(workerId){
  const w = state.workers.find(x=>x.id===workerId);
  if(!w) return;
  const c = workerRecordCounts(w);
  const bal = outstandingBalance(w.id);
  const parts = currentPeriodParts();
  const unpaid = !getPayment(w, parts);
  const bg = document.createElement('div');
  bg.className='modal-bg';
  bg.innerHTML = `
    <div class="modal">
      <h3>🔒 ఖాతా మూసివేయండి · ${w.te}</h3>
      <div class="keep-note">
        <b>ఏమీ తొలగించబడదు.</b> ${c.days} హాజరు రోజులు, ${c.pays} జీతం చెల్లింపులు (${fmtRupee(lifetimePaid(w))}),
        ${c.advs} అడ్వాన్స్, ${c.warns} హెచ్చరికలు — అన్నీ చరిత్రలో అలాగే ఉంటాయి.
        <span class="en2">Every record stays. He only stops appearing in attendance and salary after his last working day.</span>
      </div>
      <div class="field"><label>చివరి పని రోజు (Last working day)</label>
        <input type="date" id="clDate" value="${selectedDate}"></div>
      <div class="field"><label>కారణం / నోట్ (Reason, optional)</label>
        <input type="text" id="clNote" placeholder="e.g. resigned, new chef joining"></div>
      ${Math.round(bal)!==0 ? `
      <div class="warn-note">⚠️ బకాయి అడ్వాన్స్ <b>${fmtRupee(bal)}</b> ఇంకా ఉంది.
        <label class="chk"><input type="checkbox" id="clSettle"> ఇప్పుడే సెటిల్ చేయండి — చివరి జీతం నుండి ${fmtRupee(bal)} తీసివేయండి
          <span class="en2">Records a repayment on the last working day, so his final salary shows the deduction.</span></label>
      </div>` : ''}
      ${unpaid ? `<div class="period-hint bad">ఈ పీరియడ్ (${periodTopLabel(parts)} · ${periodBottomLabel(parts)}) జీతం ఇంకా చెల్లించలేదు — జీతం టాబ్‌లో అతని కార్డు కనిపిస్తుంది, అక్కడ చెల్లించి గుర్తించండి.</div>` : ''}
      <div class="modal-actions">
        <button class="btn ghost" id="clCancel">రద్దు</button>
        <button class="btn primary" id="clSave">ఖాతా మూసివేయి</button>
      </div>
    </div>`;
  document.body.appendChild(bg);
  bg.querySelector('#clCancel').addEventListener('click', ()=> bg.remove());
  bg.addEventListener('click', (e)=>{ if(e.target===bg) bg.remove(); });
  bg.querySelector('#clSave').addEventListener('click', ()=>{
    const end = bg.querySelector('#clDate').value || todayStr();
    const note = bg.querySelector('#clNote').value.trim();
    const settleEl = bg.querySelector('#clSettle');
    w.active = false;
    w.endDate = end;
    w.closedOn = todayStr();
    if(note) w.closeNote = note; else delete w.closeNote;
    if(settleEl && settleEl.checked && Math.round(bal)!==0){
      state.advances.push({
        id: 'settle-'+w.id+'-'+Date.now(),
        workerId: w.id, date: end, amount: Math.abs(bal),
        type: bal>0 ? 'repaid' : 'given',
        note: 'ఫైనల్ సెటిల్‌మెంట్ (final settlement on closing account)'
      });
    }
    saveState();
    bg.remove();
    render();
  });
}

// ---- modals ----
// An advance/deduction is always entered from a salary card, so it must land in the
// period that card is showing. Today's date is only a safe default if it actually
// falls inside that period — on 17 Jul, viewing the 1–15 card, it does not.
function periodDefaultDate(parts){
  if(!parts) return selectedDate;
  const b = periodBounds(parts);
  return (selectedDate >= b.start && selectedDate <= b.end) ? selectedDate : b.end;
}

      <div class="field"><label>రకం (Type)</label>
        <select id="advType">
          <option value="given" ${type==='given'?'selected':''}>అడ్వాన్స్ ఇచ్చారు (Advance given)</option>
          <option value="repaid" ${type==='repaid'?'selected':''}>తిరిగి తీసుకున్నారు (Repaid / adjusted from salary)</option>
        </select>
      </div>
      <div class="field"><label>మొత్తం (Amount ₹)</label><input type="number" inputmode="numeric" id="advAmt" placeholder="1000"></div>
      <div class="field"><label>తేదీ (Date)</label><input type="date" id="advDate" value="${defDate}"></div>
      <div class="period-hint" id="advPeriodHint"></div>
      <div class="field"><label>నోట్ (Note, optional)</label><input type="text" id="advNote" placeholder=""></div>
      <div class="modal-actions">
        <button class="btn ghost" id="advCancel">రద్దు</button>
        <button class="btn primary" id="advSave">సేవ్</button>
      </div>
    </div>`;
  document.body.appendChild(bg);
  // Live: tell her exactly which fortnight's salary this date will move.
  const dateEl = bg.querySelector('#advDate');
  const hintEl = bg.querySelector('#advPeriodHint');
  function refreshHint(){
    const d = dateEl.value;
    if(!d){ hintEl.textContent=''; hintEl.className='period-hint'; return; }
    const p = partsFromDate(d);
    const label = periodTopLabel(p) + ' ' + periodBottomLabel(p);
    const mismatch = parts && (p.y!==parts.y || p.m!==parts.m || p.half!==parts.half);
    hintEl.className = 'period-hint' + (mismatch ? ' bad' : '');
    hintEl.innerHTML = mismatch
      ? `⚠️ ఈ తేదీ <b>${label}</b> పీరియడ్‌లోకి వెళ్తుంది — మీరు చూస్తున్న <b>${periodTopLabel(parts)} ${periodBottomLabel(parts)}</b> జీతం తగ్గదు.`
      : `✓ ఈ మొత్తం <b>${label}</b> జీతం నుండి తీసివేయబడుతుంది.`;
  }
  dateEl.addEventListener('change', refreshHint);
  dateEl.addEventListener('input', refreshHint);
  refreshHint();
  bg.querySelector('#advCancel').addEventListener('click', ()=> bg.remove());
  bg.addEventListener('click', (e)=>{ if(e.target===bg) bg.remove(); });
  bg.querySelector('#advSave').addEventListener('click', ()=>{
    const amt = Number(bg.querySelector('#advAmt').value);
    const date = bg.querySelector('#advDate').value || defDate;
    const note = bg.querySelector('#advNote').value.trim();
    const type = bg.querySelector('#advType').value;
    if(!amt || amt<=0){ alert('సరైన మొత్తం నమోదు చేయండి'); return; }
    state.advances.push({id:'a'+Date.now(), workerId, date, amount:amt, type, note});
    saveState();
    bg.remove();
    render();
  });
}

// ══════════ CANTEEN — cool drinks / food taken from the restaurant ══════════
// Tap a worker, list what he took with quantity and price, and the total comes
// straight off his next salary. Nothing here touches attendance or advances.
function renderCanteen(){
  const main = document.getElementById('mainArea');
  const parts = currentPeriodParts();
  const list = workersForPeriod(parts);

  const chips = list.map(w=>{
    const entries = canteenForScope(w, parts);
    const tot = canteenSum(entries);
    return `<button class="ct-chip${tot>0?' has':''}" data-w="${w.id}">
      <span class="avatar">${w.name.charAt(0)}</span>
      <span class="ct-chip-name">${w.te}<span class="en">${w.name}</span></span>
      <span class="ct-chip-amt">${tot>0?'-'+fmtRupee(tot):'—'}</span>
    </button>`;
  }).join('');

  // Everything logged in this period, newest first, so a wrong entry is easy to find.
  const all = (state.canteen||[])
    .filter(e=> list.some(w=> canteenForScope(w, parts).some(x=> x.id===e.id)))
    .sort((a,b)=> String(b.date).localeCompare(String(a.date)));
  const periodTotal = canteenSum(all);

  const log = all.length===0
    ? '<div class="empty">ఈ పీరియడ్‌లో ఇంకా ఏమీ లేదు<br><span style="font-size:11.5px;opacity:.75">Nothing taken this period</span></div>'
    : all.map(e=>{
        const w = state.workers.find(v=> v.id===e.workerId);
        const lines = (e.lines||[]).map(l=>{
          const q = (l.qty===''||l.qty==null) ? 1 : Number(l.qty);
          return `<div class="ct-line"><span>${CANTEEN_KIND_LABELS[l.kind]||'➕'} ${l.label?escapeText(l.label):''} × ${q}</span><span>${fmtRupee(canteenLineTotal(l))}</span></div>`;
        }).join('');
        return `<div class="ct-entry">
          <div class="ct-entry-head">
            <div class="avatar">${w?w.name.charAt(0):'?'}</div>
            <div class="meta"><div class="wname">${w?w.te:e.workerId}<span class="en">${fmtShort(e.date)}${e.note?' · '+escapeText(e.note):''}</span></div></div>
            <div class="ct-entry-amt">-${fmtRupee(canteenEntryTotal(e))}</div>
            <button class="wlog-del" data-del="${e.id}" title="తొలగించు">\u2715</button>
          </div>
          <div class="ct-lines">${lines}</div>
        </div>`;
      }).join('');

  main.innerHTML = `
    <div class="wtab-intro">
      <b>సిబ్బంది తీసుకున్న కూల్ డ్రింక్స్ / ఆహారం.</b> వర్కర్ పేరు నొక్కి వివరాలు నమోదు చేయండి —
      మొత్తం ఆ వ్యక్తి <b>జీతం నుండి తీసివేయబడుతుంది</b>.
      <span class="en2">Tap a worker to log cool drinks / food. The total is deducted on the Salary tab.</span>
    </div>
    <div class="section-title">వర్కర్‌ను ఎంచుకోండి (tap a worker)</div>
    <div class="ct-grid">${chips || '<div class="empty">ఈ పీరియడ్‌కు సిబ్బంది ఎవరూ లేరు</div>'}</div>
    <div class="ct-total-bar"><span>ఈ పీరియడ్ మొత్తం కోత · period total</span><span>-${fmtRupee(periodTotal)}</span></div>
    <div class="section-title" style="margin-top:14px;">నమోదు చేసినవి (${periodTopLabel(parts)} \u00b7 ${periodBottomLabel(parts)})</div>
    <div class="card">${log}</div>`;

  main.querySelectorAll('.ct-chip').forEach(btn=>{
    btn.addEventListener('click', ()=> openCanteenModal(btn.dataset.w));
  });
  main.querySelectorAll('.wlog-del[data-del]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const e = (state.canteen||[]).find(x=> x.id===btn.dataset.del);
      if(!e) return;
      if(confirm('ఈ ఎంట్రీని తొలగించాలా?\nDelete this canteen entry of '+fmtRupee(canteenEntryTotal(e))+'?')){
        state.canteen = state.canteen.filter(x=> x.id!==btn.dataset.del);
        saveState();
        render();
      }
    });
  });
}

// Escape anything typed by hand before it goes back into the page.
function escapeText(s){
  return String(s==null?'':s).replace(/[&<>"']/g, c=>
    ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function openCanteenModal(workerId){
  const w = state.workers.find(x=> x.id===workerId);
  if(!w) return;
  const parts = currentPeriodParts();
  const b = scopeBounds(w, parts);
  const today = todayStr();
  // Default to today when today falls inside the period being viewed, otherwise the
  // last day of that period — so a back-dated entry still lands where she's looking.
  const defDate = (today>=b.start && today<=b.end) ? today : b.end;

  const bg = document.createElement('div');
  bg.className = 'modal-bg';
  bg.innerHTML = `
    <div class="modal">
      <h3>🥤 ${w.te} — క్యాంటీన్ ఎంట్రీ<span class="en2" style="font-weight:400">${w.name} · cool drinks &amp; food taken</span></h3>
      <div class="field"><label>తేదీ (Date)</label><input type="date" id="ctDate" value="${defDate}"></div>
      <div class="period-hint" id="ctPeriodHint"></div>
      <div id="ctLines"></div>
      <button class="add-advance-btn" id="ctAddLine">+ ఇంకో వస్తువు జోడించండి (Add another item)</button>
      <div class="ct-modal-total"><span>మొత్తం (Total)</span><span id="ctTotal">₹0</span></div>
      <div class="field" style="margin-top:12px;"><label>నోట్ (Note, optional)</label><input type="text" id="ctNote" placeholder=""></div>
      <div class="modal-actions">
        <button class="btn ghost" id="ctCancel">రద్దు</button>
        <button class="btn primary" id="ctSave">సేవ్ చేయండి</button>
      </div>
    </div>`;
  document.body.appendChild(bg);

  const linesEl = bg.querySelector('#ctLines');
  // Two rows are laid out for her up front — cool drinks and food — because those
  // are the two that come up every time. Extra rows are added on demand.
  let rows = [
    {kind:'cool',  label:'', qty:'', price:''},
    {kind:'food',  label:'', qty:'', price:''}
  ];

  function drawLines(){
    linesEl.innerHTML = rows.map((r,i)=>`
      <div class="ct-row" data-i="${i}">
        <div class="ct-row-head">
          <select class="ct-kind">
            <option value="cool"${r.kind==='cool'?' selected':''}>🥤 కూల్ డ్రింక్స్ (Cool drinks)</option>
            <option value="food"${r.kind==='food'?' selected':''}>🍛 ఆహారం (Food)</option>
            <option value="other"${r.kind==='other'?' selected':''}>➕ ఇతరం (Other)</option>
          </select>
          ${rows.length>1?`<button class="ct-row-del" data-del="${i}" title="తీసివేయి">\u2715</button>`:''}
        </div>
        <input type="text" class="ct-label" placeholder="${r.kind==='cool'?'ఏ డ్రింక్? e.g. Thums Up 600ml':r.kind==='food'?'ఏ ఆహారం? e.g. Chicken biryani':'ఏమిటి? what item'}" value="${escapeText(r.label)}">
        <div class="ct-row-nums">
          <div><label>సంఖ్య (Qty)</label><input type="number" inputmode="decimal" class="ct-qty" placeholder="1" value="${r.qty}"></div>
          <div><label>ధర ఒకటికి (Price ₹)</label><input type="number" inputmode="decimal" class="ct-price" placeholder="0" value="${r.price}"></div>
          <div class="ct-row-sub"><label>మొత్తం</label><span class="ct-sub" data-sub="${i}">${fmtRupee(canteenLineTotal(r))}</span></div>
        </div>
      </div>`).join('');
    bindLines();
    refreshTotal();
  }

  function readRows(){
    linesEl.querySelectorAll('.ct-row').forEach(el=>{
      const i = Number(el.dataset.i);
      rows[i].kind  = el.querySelector('.ct-kind').value;
      rows[i].label = el.querySelector('.ct-label').value;
      rows[i].qty   = el.querySelector('.ct-qty').value;
      rows[i].price = el.querySelector('.ct-price').value;
    });
  }

  function refreshTotal(){
    let tot = 0;
    rows.forEach((r,i)=>{
      const sub = canteenLineTotal(r);
      tot += sub;
      const el = linesEl.querySelector(`[data-sub="${i}"]`);
      if(el) el.textContent = fmtRupee(sub);
    });
    bg.querySelector('#ctTotal').textContent = fmtRupee(tot);
    bg.querySelector('#ctSave').disabled = tot <= 0;
  }

  function bindLines(){
    linesEl.querySelectorAll('input, select').forEach(el=>{
      el.addEventListener('input', ()=>{ readRows(); refreshTotal(); });
      el.addEventListener('change', ()=>{ readRows(); refreshTotal(); });
    });
    linesEl.querySelectorAll('.ct-row-del').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        readRows();
        rows.splice(Number(btn.dataset.del), 1);
        drawLines();
      });
    });
  }

  bg.querySelector('#ctAddLine').addEventListener('click', ()=>{
    readRows();
    rows.push({kind:'other', label:'', qty:'', price:''});
    drawLines();
    const last = linesEl.querySelector('.ct-row:last-child .ct-label');
    if(last) last.focus();
  });

  // Tell her plainly which salary this date will actually reduce.
  const dateEl = bg.querySelector('#ctDate');
  const hintEl = bg.querySelector('#ctPeriodHint');
  function refreshHint(){
    const d = dateEl.value;
    if(!d){ hintEl.textContent=''; hintEl.className='period-hint'; return; }
    const p = partsFromDate(d);
    const label = periodTopLabel(p) + ' ' + periodBottomLabel(p);
    const mismatch = (w.payFreq==='monthly')
      ? (p.y!==parts.y || p.m!==parts.m)
      : (p.y!==parts.y || p.m!==parts.m || p.half!==parts.half);
    hintEl.className = 'period-hint' + (mismatch ? ' bad' : '');
    hintEl.innerHTML = mismatch
      ? `⚠️ ఈ తేదీ <b>${label}</b> జీతం నుండి తీసివేయబడుతుంది — మీరు చూస్తున్న పీరియడ్ కాదు.`
      : `✓ ఈ మొత్తం <b>${label}</b> జీతం నుండి తీసివేయబడుతుంది.`;
  }
  dateEl.addEventListener('change', refreshHint);
  dateEl.addEventListener('input', refreshHint);

  drawLines();
  refreshHint();

  bg.querySelector('#ctCancel').addEventListener('click', ()=> bg.remove());
  bg.addEventListener('click', (e)=>{ if(e.target===bg) bg.remove(); });
  bg.querySelector('#ctSave').addEventListener('click', ()=>{
    readRows();
    // Only rows with an actual price are kept — the two default rows can be left blank.
    const keep = rows.filter(r=> canteenLineTotal(r) > 0)
                     .map(r=>({kind:r.kind, label:String(r.label||'').trim(),
                               qty:(r.qty===''||r.qty==null)?1:Number(r.qty),
                               price:Number(r.price)||0}));
    if(!keep.length){ alert('కనీసం ఒక వస్తువుకు ధర నమోదు చేయండి.\nEnter a price for at least one item.'); return; }
    const total = keep.reduce((s,l)=> s + canteenLineTotal(l), 0);
    state.canteen.push({
      id:'c'+Date.now(),
      workerId: w.id,
      date: dateEl.value || defDate,
      lines: keep,
      total,
      note: bg.querySelector('#ctNote').value.trim(),
      at: Date.now()
    });
    saveState();
    bg.remove();
    render();
  });
}

function renderWarnings(){

    const list = warningsForScope(w, parts);

  });
  const chips = perWorker.map(p=>`
    <button class="wcount-chip" data-w="${p.w.id}">
      <span class="avatar">${p.w.name.charAt(0)}</span>
      <span>${p.w.te}</span>
      <span class="n">${p.count}</span>
      ${p.deducts?`<span class="pill absent">${p.deducts} కోత</span>`:''}
    </button>`).join('');
  const allWarnings = [...(state.warnings||[])].sort((a,b)=> b.date.localeCompare(a.date));
  const log = allWarnings.length===0
    ? '<div class="empty">ఇంకా హెచ్చరికలు లేవు</div>'

          <div class="avatar">${w?w.name.charAt(0):'?'}</div>

            <div class="wname">${w?w.te:x.workerId} ${lvlPill}${w&&isClosed(w)?'<span class="pill closed">మాజీ</span>':''}<span class="en">${fmtShort(x.date)} · ${REASON_LABELS[x.reason]||x.reason}${x.note?' · '+x.note:''}</span></div>

          <button class="wlog-del" data-id="${x.id}" title="తొలగించు">\u2715</button>

    <div class="wtab-intro">

      రెండవసారి \u2192 <b>ఆ రోజు జీతం కోత</b> (1 రోజు జీతం). త్రివేణి ఇక్కడ లాగ్ చేయవచ్చు.
    </div>
    <button class="add-advance-btn" id="addWarnBtn">+ కొత్త హెచ్చరిక (Add warning)</button>
    <div class="section-title" style="margin-top:14px;">ఈ పీరియడ్ (${periodTopLabel(parts)} \u00b7 ${periodBottomLabel(parts)})</div>
    <div class="wcount-grid">${chips}</div>
    <div class="section-title">హెచ్చరికల చరిత్ర (Warning history)</div>
    <div class="card">${log}</div>`;
  main.querySelector('#addWarnBtn').addEventListener('click', ()=> openWarningModal());
  main.querySelectorAll('.wcount-chip').forEach(btn=> btn.addEventListener('click', ()=> openWarningModal(btn.dataset.w)));
  main.querySelectorAll('.wlog-del').forEach(btn=> btn.addEventListener('click', ()=>{
    if(confirm('ఈ హెచ్చరికను తొలగించాలా?')){
      state.warnings = (state.warnings||[]).filter(x=> x.id!==btn.dataset.id);
      saveState(); render();
    }
  }));
}

  bg.querySelector('#wnSave').addEventListener('click', ()=>{

    const date = bg.querySelector('#wnDate').value || selectedDate;
    const level = Number(bg.querySelector('#wnLevel').value);
    const note = bg.querySelector('#wnNote').value.trim();

    bg.remove();
    render();
  });
}

  bg.innerHTML = `
    <div class="modal">
      <h3>జీతం చెల్లించారు — ${w.te}</h3>
      <div class="wn-hint">${w.name} · ${scopeLabel}<br>లెక్క ప్రకారం చెల్లించవలసినది: <b>${fmtRupee(netSuggested)}</b></div>
      <div class="field"><label>చెల్లించిన తేదీ (Date paid)</label><input type="date" id="pyDate" value="${todayStr()}"></div>
      <div class="field"><label>చెల్లించిన మొత్తం (Amount paid ₹)</label><input type="number" inputmode="numeric" id="pyAmt" value="${netSuggested}"></div>
      <div class="field"><label>నోట్ (Note, optional — cash / GPay / bank)</label><input type="text" id="pyNote" placeholder=""></div>
      <div class="modal-actions">
        <button class="btn ghost" id="pyCancel">రద్దు</button>
        <button class="btn primary" id="pySave">సేవ్</button>
      </div>
    </div>`;
  document.body.appendChild(bg);
  bg.querySelector('#pyCancel').addEventListener('click', ()=> bg.remove());
  bg.addEventListener('click', (e)=>{ if(e.target===bg) bg.remove(); });
  bg.querySelector('#pySave').addEventListener('click', ()=>{
    setPayment(w, parts, {
      date: bg.querySelector('#pyDate').value || todayStr(),
      amount: Number(bg.querySelector('#pyAmt').value)||0,
      note: bg.querySelector('#pyNote').value.trim(),
      at: Date.now()
    });
    saveState();
    bg.remove();
    render();
  });
}

function openAddWorkerModal(){
  const bg = document.createElement('div');
  bg.className='modal-bg';
  bg.innerHTML = `
    <div class="modal">
      <h3>కొత్త సిబ్బంది (New worker)</h3>
      <div class="field"><label>Name (English)</label><input type="text" id="newEn" placeholder="e.g. Ravi"></div>
      <div class="field">
        <label>పేరు తెలుగులో (Telugu name)</label><input type="text" id="newTe">
        <button type="button" class="tr-btn" id="newTrName">🌐 ఇంగ్లీష్ నుండి తెలుగులోకి</button><span class="tr-status" id="newTeStatus"></span>
      </div>
      <div class="field">
        <label>Role (e.g. Chef, Cleaner)</label><input type="text" id="newRole" placeholder="e.g. Cleaner">
        <button type="button" class="tr-btn" id="newTrRole">🌐 తెలుగులోకి</button><span class="tr-status" id="newRoleStatus"></span>
      </div>
      <div class="field"><label>చెల్లింపు ఫ్రీక్వెన్సీ (Pay frequency)</label>
        <select id="newFreq">
          <option value="biweekly">బైవీక్లీ (every 2 weeks · paid per day)</option>
          <option value="monthly">నెలవారీ (once a month · fixed salary)</option>
        </select>
      </div>
      <div class="field"><label id="newRateLabel">రోజు జీతం (Salary per day ₹)</label><input type="number" inputmode="numeric" id="newRate" value="500"></div>
      <div class="field" id="newMonthlyWrap" style="display:none">
        <label>నెలవారీ జీతం (Fixed monthly salary ₹)</label>
        <input type="number" inputmode="numeric" id="newMonthly" value="12000">
      </div>
      <div class="field"><label>చేరిన తేదీ (Joining date)</label>
        <input type="date" id="newStart" value="${selectedDate}">
        <div class="fieldhint">ఈ తేదీ నుండే హాజరు మరియు జీతం లెక్కించబడుతుంది.<span class="en2">Attendance and pay start from this day — a mid-month join is prorated automatically.</span></div>
      </div>
      <div class="modal-actions">
        <button class="btn ghost" id="wCancel">రద్దు</button>
        <button class="btn primary" id="wSave">సేవ్</button>
      </div>
    </div>`;
  document.body.appendChild(bg);
  bg.querySelector('#newFreq').addEventListener('change', (e)=>{
    const monthly = e.target.value==='monthly';
    bg.querySelector('#newRateLabel').textContent = monthly
      ? 'రోజు జీతం (1 రోజు గైర్హాజరు కోత ₹)' : 'రోజు జీతం (Salary per day ₹)';
    bg.querySelector('#newMonthlyWrap').style.display = monthly ? '' : 'none';
  });
  bg.querySelector('#wCancel').addEventListener('click', ()=> bg.remove());
  bg.querySelector('#newTrName').addEventListener('click', ()=> translateFieldTo('newEn','newTe','newTeStatus','name'));
  bg.querySelector('#newTrRole').addEventListener('click', ()=> translateFieldTo('newRole','newRole','newRoleStatus','word'));
  bg.addEventListener('click', (e)=>{ if(e.target===bg) bg.remove(); });
  bg.querySelector('#wSave').addEventListener('click', ()=>{
    const en = bg.querySelector('#newEn').value.trim();
    const te = bg.querySelector('#newTe').value.trim() || en;
    const role = bg.querySelector('#newRole').value.trim();
    const rate = Number(bg.querySelector('#newRate').value)||0;
    if(!en){ alert('పేరు నమోదు చేయండి'); return; }
    const id = en.toLowerCase().replace(/[^a-z0-9]+/g,'-')+'-'+Date.now();
    const payFreq = bg.querySelector('#newFreq').value;
    const worker = {id, name:en, te, role, payFreq, dayRate:rate, active:true};
    const start = bg.querySelector('#newStart').value;
    if(start) worker.startDate = start;
    if(payFreq==='monthly') worker.monthly = Number(bg.querySelector('#newMonthly').value)||0;
    state.workers.push(worker);
    saveState();
    bg.remove();
    render();
  });
}

function openEditWorkerModal(workerId){
  const w = state.workers.find(x=>x.id===workerId);
  if(!w) return;
  const bg = document.createElement('div');
  bg.className='modal-bg';
  const isMonthly = w.payFreq==='monthly';
  bg.innerHTML = `
    <div class="modal">
      <h3>సిబ్బంది వివరాలు మార్చండి (Edit worker)</h3>
      <div class="field"><label>Name (English)</label><input type="text" id="edEn" value="${(w.name||'').replace(/"/g,'&quot;')}"></div>
      <div class="field">
        <label>పేరు తెలుగులో (Telugu name)</label><input type="text" id="edTe" value="${(w.te||'').replace(/"/g,'&quot;')}">
        <button type="button" class="tr-btn" id="edTrName">🌐 ఇంగ్లీష్ నుండి తెలుగులోకి</button><span class="tr-status" id="edTeStatus"></span>
      </div>
      <div class="field">
        <label>Role</label><input type="text" id="edRole" value="${(w.role||'').replace(/"/g,'&quot;')}">
        <button type="button" class="tr-btn" id="edTrRole">🌐 తెలుగులోకి</button><span class="tr-status" id="edRoleStatus"></span>
      </div>
      <div class="field"><label>చెల్లింపు ఫ్రీక్వెన్సీ (Pay frequency)</label>
        <select id="edFreq">
          <option value="biweekly" ${!isMonthly?'selected':''}>బైవీక్లీ (every 2 weeks · paid per day)</option>
          <option value="monthly" ${isMonthly?'selected':''}>నెలవారీ (once a month · fixed salary)</option>
        </select>
      </div>
      <div class="field"><label id="edRateLabel">${isMonthly ? 'రోజు జీతం (1 రోజు గైర్హాజరు కోత ₹)' : 'రోజు జీతం (Salary per day ₹)'}</label>
        <input type="number" inputmode="numeric" id="edRate" value="${w.dayRate||0}"></div>
      <div class="field" id="edMonthlyWrap" style="display:${isMonthly?'':'none'}">
        <label>నెలవారీ జీతం (Fixed monthly salary ₹)</label>
        <input type="number" inputmode="numeric" id="edMonthly" value="${w.monthly||0}">
      </div>
      <div class="field"><label>చేరిన తేదీ (Joining date — optional)</label>
        <input type="date" id="edStart" value="${w.startDate||''}"></div>
      ${isClosed(w) ? `
      <div class="field"><label>చివరి పని రోజు (Last working day)</label>
        <input type="date" id="edEnd" value="${w.endDate||''}">
        <div class="fieldhint">ఖాతా మూసివేయబడింది. తిరిగి తెరవాలంటే సిబ్బంది టాబ్‌లో "తిరిగి తెరవండి" నొక్కండి.<span class="en2">Account closed — reopen from the Staff tab.</span></div>
      </div>` : ''}
      <div class="modal-actions">
        <button class="btn ghost" id="edCancel">రద్దు</button>
        <button class="btn primary" id="edSave">సేవ్</button>
      </div>
    </div>`;
  document.body.appendChild(bg);
  bg.querySelector('#edFreq').addEventListener('change', (e)=>{
    const monthly = e.target.value==='monthly';
    bg.querySelector('#edRateLabel').textContent = monthly
      ? 'రోజు జీతం (1 రోజు గైర్హాజరు కోత ₹)' : 'రోజు జీతం (Salary per day ₹)';
    bg.querySelector('#edMonthlyWrap').style.display = monthly ? '' : 'none';
  });
  bg.querySelector('#edTrName').addEventListener('click', ()=> translateFieldTo('edEn','edTe','edTeStatus','name'));
  bg.querySelector('#edTrRole').addEventListener('click', ()=> translateFieldTo('edRole','edRole','edRoleStatus','word'));
  bg.querySelector('#edCancel').addEventListener('click', ()=> bg.remove());
  bg.addEventListener('click', (e)=>{ if(e.target===bg) bg.remove(); });
  bg.querySelector('#edSave').addEventListener('click', ()=>{
    const en = bg.querySelector('#edEn').value.trim();
    if(!en){ alert('పేరు నమోదు చేయండి (enter a name)'); return; }
    w.name = en;
    w.te = bg.querySelector('#edTe').value.trim() || en;
    w.role = bg.querySelector('#edRole').value.trim();
    w.payFreq = bg.querySelector('#edFreq').value;
    w.dayRate = Number(bg.querySelector('#edRate').value)||0;
    const st = bg.querySelector('#edStart').value;
    if(st) w.startDate = st; else delete w.startDate;
    const endEl = bg.querySelector('#edEnd');
    if(endEl){ if(endEl.value) w.endDate = endEl.value; else delete w.endDate; }
    if(w.payFreq==='monthly') w.monthly = Number(bg.querySelector('#edMonthly').value)||0;
    else delete w.monthly;
    saveState();
    bg.remove();
    render();
  });
}

// ---- nav ----
document.querySelectorAll('nav.tabbar button').forEach(btn=>{
  btn.addEventListener('click', ()=>{
    document.querySelectorAll('nav.tabbar button').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    currentTab = btn.dataset.tab;
    render();
    window.scrollTo({ top: 0, behavior: 'instant' });   // open every tab at its top
  });
});
document.getElementById('prevPeriod').addEventListener('click', ()=>{ periodOffset--; render(); });
document.getElementById('nextPeriod').addEventListener('click', ()=>{ periodOffset++; render(); });

// ---- init ----
(async function init(){
  try{
    await withTimeout(loadState(), 6000);
  }catch(e){
    console.error('load failed, falling back to defaults', e);
    state = {workers: DEFAULT_WORKERS.map(w=>Object.assign({},w)), attendance:{}, advances:[], warnings:[], canteen:[], payments:{}, tips:{}, removedIds:[], seedVersion:0};
    try{ applySeedData(); }catch(e2){}
  }
  try{
    render();
  }catch(e){
    console.error('render failed', e);
    document.getElementById('mainArea').innerHTML =
      '<div class="empty">Something went wrong loading the app.<br>Please close and reopen it.</div>';
  }
  startSync();
})();
</script>
