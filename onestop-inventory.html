<style>
/* ═════════ TOKENS ═════════ */
:root{
  --bg:#F4F5F2; --surface:#FFFFFF; --surface-2:#F0F1EE; --surface-3:#E6E8E3;
  --ink:#14191A; --ink-2:#4B5452; --ink-3:#7D8683; --line:#E1E4DF; --line-2:#EDEFEB;
  --brand:#0F6E5A; --brand-2:#0B5747; --brand-tint:#E4F2EE; --brand-ink:#FFFFFF;
  --chrome:#0E1512; --chrome-2:#1B2521; --chrome-ink:#EEF3F0; --chrome-mute:#95A39D;
  --red:#C23B32;   --red-tint:#FBECEA;   --red-ink:#8E241D;
  --amber:#B7791F; --amber-tint:#FBF2E1; --amber-ink:#7A4E0E;
  --green:#1E8A5B; --green-tint:#E6F4EC; --green-ink:#135C3C;
  --blue:#2F6BB3;  --blue-tint:#E8F0FA;  --blue-ink:#1D4A80;
  --violet:#6D55B8; --violet-tint:#EFEBFA;
  --radius:16px; --radius-s:11px;
  --shadow:0 1px 2px rgba(16,24,20,.05), 0 2px 10px rgba(16,24,20,.05);
  --shadow-l:0 18px 50px rgba(10,16,13,.28);
  --nav-h:66px;
  --safe-b:env(safe-area-inset-bottom, 0px);
  --safe-t:env(safe-area-inset-top, 0px);
  color-scheme: light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0C110F; --surface:#151C19; --surface-2:#1C2521; --surface-3:#25302B;
    --ink:#EAF0ED; --ink-2:#B3BFBA; --ink-3:#7F8C87; --line:#26312C; --line-2:#1F2925;
    --brand:#3BB594; --brand-2:#57C7A8; --brand-tint:#15302A; --brand-ink:#06120E;
    --chrome:#070B09; --chrome-2:#141C18;
    --red:#EE6B5F; --red-tint:#3A1C19; --red-ink:#F6A79F;
    --amber:#E3A84B; --amber-tint:#352814; --amber-ink:#F2CD8F;
    --green:#4CC38A; --green-tint:#15301F; --green-ink:#9CE3BF;
    --blue:#6EA4E8; --blue-tint:#172638; --blue-ink:#AFCDF4;
    --violet:#A895EC; --violet-tint:#241F38;
    --shadow:0 1px 2px rgba(0,0,0,.4); color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0C110F; --surface:#151C19; --surface-2:#1C2521; --surface-3:#25302B;
  --ink:#EAF0ED; --ink-2:#B3BFBA; --ink-3:#7F8C87; --line:#26312C; --line-2:#1F2925;
  --brand:#3BB594; --brand-2:#57C7A8; --brand-tint:#15302A; --brand-ink:#06120E;
  --chrome:#070B09; --chrome-2:#141C18;
  --red:#EE6B5F; --red-tint:#3A1C19; --red-ink:#F6A79F;
  --amber:#E3A84B; --amber-tint:#352814; --amber-ink:#F2CD8F;
  --green:#4CC38A; --green-tint:#15301F; --green-ink:#9CE3BF;
  --blue:#6EA4E8; --blue-tint:#172638; --blue-ink:#AFCDF4;
  --violet:#A895EC; --violet-tint:#241F38;
  --shadow:0 1px 2px rgba(0,0,0,.4); color-scheme: dark;
}

/* ═════════ BASE ═════════ */
*{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html,body{ margin:0; padding:0; }
body{ background:var(--bg); color:var(--ink); font:15px/1.45 Inter, system-ui, -apple-system, "Segoe UI", sans-serif;
  -webkit-font-smoothing:antialiased; overscroll-behavior-y:none; }
button,input,select,textarea{ font:inherit; color:inherit; }
button{ cursor:pointer; touch-action:manipulation; }
input,select,textarea{ font-size:16px; }
.num{ font-variant-numeric:tabular-nums; }
.muted{ color:var(--ink-3); } .ink2{ color:var(--ink-2); }
.hide{ display:none !important; }
a{ color:var(--brand); }

/* ═════════ SHELL ═════════ */
.top{ position:sticky; top:0; z-index:40; background:var(--chrome); color:var(--chrome-ink);
  padding:calc(var(--safe-t) + 10px) 16px 12px; }
.top-row{ display:flex; align-items:center; gap:10px; }
.top-back{ width:38px; height:38px; border-radius:12px; border:none; background:var(--chrome-2); color:var(--chrome-ink);
  display:grid; place-items:center; flex:0 0 auto; }
.top-back svg{ width:20px; height:20px; }
.top-title{ flex:1; min-width:0; }
.top-title h1{ margin:0; font-size:19px; font-weight:800; letter-spacing:-.01em; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.top-title p{ margin:1px 0 0; font-size:12px; color:var(--chrome-mute); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.top-btn{ position:relative; width:38px; height:38px; border-radius:12px; border:none; background:var(--chrome-2); color:var(--chrome-ink);
  display:grid; place-items:center; flex:0 0 auto; }
.top-btn svg{ width:19px; height:19px; }
.top-btn .dot{ position:absolute; top:6px; right:6px; width:8px; height:8px; border-radius:50%; background:var(--amber); border:2px solid var(--chrome-2); }
.who{ display:flex; align-items:center; gap:7px; height:38px; padding:0 10px 0 5px; border-radius:12px; border:none;
  background:var(--chrome-2); color:var(--chrome-ink); font-weight:700; font-size:13px; flex:0 0 auto; max-width:120px; }
.who .av{ width:28px; height:28px; border-radius:9px; background:var(--brand); color:#fff; display:grid; place-items:center; font-size:13px; font-weight:800; }
.who span:last-child{ overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.sync{ display:inline-flex; align-items:center; gap:5px; font-size:11px; color:var(--chrome-mute); }
.sync i{ width:7px; height:7px; border-radius:50%; background:var(--green); }
.sync.bad i{ background:var(--amber); }
.top-search{ margin-top:11px; position:relative; }
.top-search input{ width:100%; height:42px; border-radius:12px; border:none; background:var(--chrome-2); color:var(--chrome-ink);
  padding:0 14px 0 38px; outline:none; }
.top-search input::placeholder{ color:var(--chrome-mute); }
.top-search svg{ position:absolute; left:12px; top:11px; width:19px; height:19px; color:var(--chrome-mute); }

main{ padding:14px 16px calc(var(--nav-h) + var(--safe-b) + 26px); max-width:760px; margin:0 auto; }

.nav{ position:fixed; left:0; right:0; bottom:0; z-index:45; background:var(--surface); border-top:1px solid var(--line);
  padding:6px 8px calc(6px + var(--safe-b)); display:flex; justify-content:space-around; align-items:flex-end; }
.nav button{ flex:1; max-width:92px; border:none; background:none; color:var(--ink-3); display:flex; flex-direction:column; align-items:center; gap:3px;
  font-size:10.5px; font-weight:700; padding:6px 0; border-radius:12px; position:relative; }
.nav button svg{ width:23px; height:23px; }
.nav button.on{ color:var(--brand); }
.nav button .badge{ position:absolute; top:1px; left:calc(50% + 6px); min-width:17px; height:17px; padding:0 4px; border-radius:9px; background:var(--red); color:#fff;
  font-size:10px; line-height:17px; font-weight:800; }
.nav .plus{ flex:0 0 auto; width:58px; height:58px; margin-top:-26px; border-radius:20px; background:var(--brand); color:var(--brand-ink);
  box-shadow:0 8px 22px rgba(15,110,90,.4); display:grid; place-items:center; max-width:none; padding:0; }
.nav .plus svg{ width:28px; height:28px; }

/* ═════════ BUILDING BLOCKS ═════════ */
.card{ background:var(--surface); border-radius:var(--radius); box-shadow:var(--shadow); padding:14px; margin-bottom:12px; }
.card.flat{ box-shadow:none; border:1px solid var(--line); }
.card.tight{ padding:0; overflow:hidden; }
.card h3, .h3{ margin:0 0 8px; font-size:15px; font-weight:800; letter-spacing:-.005em; }
.card-head{ display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:8px; }
.card-head h3{ margin:0; }
.link{ border:none; background:none; color:var(--brand); font-weight:700; font-size:13px; padding:4px 0; }
.sec{ font-size:11px; font-weight:800; letter-spacing:.07em; text-transform:uppercase; color:var(--ink-3); margin:18px 2px 8px;
  display:flex; justify-content:space-between; align-items:center; }
.sec:first-child{ margin-top:4px; }
.grid2{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }
.grid3{ display:grid; grid-template-columns:repeat(3,1fr); gap:8px; }
.row-flex{ display:flex; gap:8px; align-items:center; }
.spacer{ flex:1; }

.btn{ height:46px; border-radius:13px; border:none; padding:0 16px; font-weight:700; font-size:15px; display:inline-flex; align-items:center; justify-content:center; gap:7px;
  background:var(--surface-2); color:var(--ink); }
.btn.primary{ background:var(--brand); color:var(--brand-ink); }
.btn.danger{ background:var(--red-tint); color:var(--red-ink); }
.btn.ghost{ background:transparent; border:1px solid var(--line); }
.btn.block{ width:100%; }
.btn.sm{ height:36px; font-size:13px; padding:0 12px; border-radius:10px; }
.btn:disabled{ opacity:.45; }
.btn svg{ width:18px; height:18px; }

.pill{ display:inline-flex; align-items:center; gap:4px; height:22px; padding:0 8px; border-radius:999px; font-size:11.5px; font-weight:700; white-space:nowrap;
  background:var(--surface-2); color:var(--ink-2); }
.pill.red{ background:var(--red-tint); color:var(--red-ink); } .pill.amber{ background:var(--amber-tint); color:var(--amber-ink); }
.pill.green{ background:var(--green-tint); color:var(--green-ink); } .pill.blue{ background:var(--blue-tint); color:var(--blue-ink); }
.pill.violet{ background:var(--violet-tint); color:var(--violet); } .pill.brand{ background:var(--brand-tint); color:var(--brand); }

.chips{ display:flex; gap:7px; overflow-x:auto; padding:2px 0 10px; margin:0 -16px; padding-left:16px; padding-right:16px; scrollbar-width:none; }
.chips::-webkit-scrollbar{ display:none; }
.chip{ flex:0 0 auto; height:34px; padding:0 13px; border-radius:999px; border:1px solid var(--line); background:var(--surface); font-size:13px; font-weight:700; color:var(--ink-2);
  display:inline-flex; align-items:center; gap:6px; }
.chip.on{ background:var(--ink); border-color:var(--ink); color:var(--surface); }
.chip b{ font-weight:800; }
.chip .n{ min-width:18px; height:18px; padding:0 5px; border-radius:9px; background:var(--surface-2); color:var(--ink-2); font-size:11px; line-height:18px; text-align:center; }
.chip.on .n{ background:rgba(255,255,255,.2); color:inherit; }

.seg{ display:flex; background:var(--surface-2); border-radius:12px; padding:3px; gap:3px; margin-bottom:12px; }
.seg button{ flex:1; height:36px; border:none; border-radius:9px; background:none; font-size:13px; font-weight:700; color:var(--ink-2); }
.seg button.on{ background:var(--surface); color:var(--ink); box-shadow:0 1px 3px rgba(0,0,0,.1); }

/* list rows */
.list{ background:var(--surface); border-radius:var(--radius); box-shadow:var(--shadow); overflow:hidden; margin-bottom:12px; }
.li{ display:flex; align-items:center; gap:12px; padding:12px 14px; border-top:1px solid var(--line-2); width:100%; text-align:left; background:none; border-left:none; border-right:none; border-bottom:none; }
.li:first-child{ border-top:none; }
.li .ic{ width:40px; height:40px; border-radius:12px; background:var(--surface-2); display:grid; place-items:center; font-size:19px; flex:0 0 auto; }
.li .ic svg{ width:20px; height:20px; }
.li .mid{ flex:1; min-width:0; }
.li .t{ font-weight:700; font-size:14.5px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.li .s{ font-size:12px; color:var(--ink-3); margin-top:1px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.li .s.wrap{ white-space:normal; }
.li .r{ text-align:right; flex:0 0 auto; }
.li .r .q{ font-weight:800; font-size:15px; font-variant-numeric:tabular-nums; }
.li .r .u{ font-size:11.5px; color:var(--ink-3); font-weight:600; }
.li .chev{ color:var(--ink-3); width:16px; height:16px; flex:0 0 auto; }
.li-group{ padding:9px 14px 7px; font-size:11px; font-weight:800; text-transform:uppercase; letter-spacing:.06em; color:var(--ink-3); background:var(--surface-2); }

.stat{ background:var(--surface); border-radius:var(--radius); box-shadow:var(--shadow); padding:12px 13px; min-width:0; border:none; text-align:left; width:100%; }
.stat .k{ font-size:11.5px; font-weight:700; color:var(--ink-3); display:flex; align-items:center; gap:6px; }
.stat .v{ font-size:22px; font-weight:800; letter-spacing:-.02em; margin-top:2px; font-variant-numeric:tabular-nums; }
.stat .d{ font-size:11.5px; color:var(--ink-3); margin-top:1px; }
.stat.red .v{ color:var(--red); } .stat.amber .v{ color:var(--amber); } .stat.green .v{ color:var(--green); }
.stat .k i{ width:8px; height:8px; border-radius:50%; display:inline-block; }

.alert{ display:flex; gap:11px; padding:12px 13px; border-radius:14px; margin-bottom:10px; align-items:flex-start; border:none; width:100%; text-align:left; }
.alert .ai{ width:32px; height:32px; border-radius:10px; display:grid; place-items:center; flex:0 0 auto; font-size:16px; }
.alert .at{ font-weight:800; font-size:14px; } .alert .as{ font-size:12.5px; margin-top:1px; line-height:1.45; }
.alert.red{ background:var(--red-tint); color:var(--red-ink); } .alert.red .ai{ background:var(--red); color:#fff; }
.alert.amber{ background:var(--amber-tint); color:var(--amber-ink); } .alert.amber .ai{ background:var(--amber); color:#fff; }
.alert.green{ background:var(--green-tint); color:var(--green-ink); } .alert.green .ai{ background:var(--green); color:#fff; }
.alert.blue{ background:var(--blue-tint); color:var(--blue-ink); } .alert.blue .ai{ background:var(--blue); color:#fff; }
.alert.gray{ background:var(--surface-2); color:var(--ink-2); } .alert.gray .ai{ background:var(--surface-3); }

.empty{ text-align:center; padding:34px 18px; color:var(--ink-3); font-size:14px; }
.empty .big{ font-size:34px; margin-bottom:6px; }
.empty b{ display:block; color:var(--ink); font-size:15px; margin-bottom:3px; }

.note{ font-size:12.5px; color:var(--ink-3); line-height:1.5; margin:8px 2px; }

/* cover bar */
.cover{ height:6px; border-radius:3px; background:var(--surface-3); overflow:hidden; margin-top:6px; }
.cover > i{ display:block; height:100%; border-radius:3px; background:var(--green); }
.cover.amber > i{ background:var(--amber); } .cover.red > i{ background:var(--red); }

/* tables */
.tbl-wrap{ overflow-x:auto; -webkit-overflow-scrolling:touch; border-radius:12px; border:1px solid var(--line); }
table.tbl{ width:100%; border-collapse:collapse; font-size:12.5px; font-variant-numeric:tabular-nums; }
.tbl th{ background:var(--surface-2); font-size:10.5px; text-transform:uppercase; letter-spacing:.04em; color:var(--ink-3); font-weight:800; padding:8px 6px; text-align:right; white-space:nowrap; }
.tbl td{ padding:8px 5px; border-top:1px solid var(--line-2); text-align:right; }
.tbl th:first-child, .tbl td:first-child{ text-align:left; padding-left:11px; }
.tbl th:last-child, .tbl td:last-child{ padding-right:11px; }
.tbl tr.q td{ color:var(--ink-3); }
.tbl tr.gh td{ background:var(--surface-2); font-size:10.5px; font-weight:800; text-transform:uppercase; letter-spacing:.05em; color:var(--brand); }
.tbl tr.tot td{ font-weight:800; }
.tbl .pos{ color:var(--green); } .tbl .neg{ color:var(--red); } .tbl .wst{ color:var(--amber); }

/* bar charts */
.bars{ display:flex; gap:5px; align-items:flex-end; height:110px; padding-top:6px; }
.bars .b{ flex:1; min-width:0; display:flex; flex-direction:column; align-items:center; gap:4px; height:100%; justify-content:flex-end; border:none; background:none; padding:0; border-radius:8px; }
.bars .b .stk{ width:100%; max-width:26px; display:flex; gap:2px; align-items:flex-end; flex:1; justify-content:center; }
.bars .b .stk i{ flex:1; border-radius:4px 4px 1px 1px; min-height:2px; background:var(--brand); }
.bars .b .stk i.alt{ background:var(--surface-3); } .bars .b .stk i.red{ background:var(--red); } .bars .b .stk i.amber{ background:var(--amber); }
.bars .b span{ font-size:10px; color:var(--ink-3); font-weight:700; white-space:nowrap; }
.bars .b.on{ background:var(--surface-2); }
.legend{ display:flex; gap:12px; flex-wrap:wrap; font-size:11.5px; color:var(--ink-3); margin-top:8px; }
.legend i{ display:inline-block; width:10px; height:10px; border-radius:3px; margin-right:5px; vertical-align:-1px; }
.hbar{ margin:9px 0; }
.hbar .top{ all:unset; display:flex; justify-content:space-between; gap:8px; font-size:13px; }
.hbar .trk{ height:8px; border-radius:4px; background:var(--surface-2); margin-top:4px; overflow:hidden; }
.hbar .trk i{ display:block; height:100%; border-radius:4px; background:var(--brand); }

/* forms */
.f{ margin-bottom:12px; }
.f label, .lbl{ display:block; font-size:12px; font-weight:700; color:var(--ink-2); margin-bottom:5px; }
.f input, .f select, .f textarea, .inp{ width:100%; height:46px; border-radius:12px; border:1px solid var(--line); background:var(--surface-2); padding:0 12px; outline:none; }
.f textarea{ height:auto; min-height:84px; padding:10px 12px; resize:vertical; line-height:1.45; }
.f input:focus, .f select:focus, .f textarea:focus, .inp:focus{ border-color:var(--brand); background:var(--surface); box-shadow:0 0 0 3px var(--brand-tint); }
.f .hint{ font-size:11.5px; color:var(--ink-3); margin-top:4px; line-height:1.4; }
.f2{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }
.amt{ display:flex; gap:8px; }
.amt input{ flex:1; min-width:0; font-size:22px; font-weight:800; height:56px; }
.amt select{ width:110px; height:56px; font-weight:700; }
.toggle{ display:flex; align-items:center; gap:12px; padding:12px; border-radius:12px; background:var(--surface-2); border:none; width:100%; text-align:left; margin-bottom:12px; }
.toggle .sw{ width:44px; height:26px; border-radius:13px; background:var(--surface-3); position:relative; flex:0 0 auto; transition:background .15s; }
.toggle .sw::after{ content:""; position:absolute; top:3px; left:3px; width:20px; height:20px; border-radius:50%; background:#fff; box-shadow:0 1px 3px rgba(0,0,0,.25); transition:left .15s; }
.toggle.on .sw{ background:var(--brand); } .toggle.on .sw::after{ left:21px; }
.toggle .tx{ flex:1; font-size:14px; font-weight:600; } .toggle .tx small{ display:block; font-weight:500; font-size:12px; color:var(--ink-3); }
.qchips{ display:flex; gap:6px; flex-wrap:wrap; margin-top:8px; }
.qchips button{ height:32px; padding:0 12px; border-radius:999px; border:1px solid var(--line); background:var(--surface); font-size:13px; font-weight:700; }
.preview{ padding:11px 13px; border-radius:12px; background:var(--surface-2); font-size:13.5px; margin-bottom:12px; }
.preview.warn{ background:var(--amber-tint); color:var(--amber-ink); } .preview.bad{ background:var(--red-tint); color:var(--red-ink); }
.preview.good{ background:var(--green-tint); color:var(--green-ink); } .preview.info{ background:var(--blue-tint); color:var(--blue-ink); }
.stepper{ display:flex; align-items:center; gap:4px; }
.stepper button{ width:38px; height:38px; border-radius:11px; border:1px solid var(--line); background:var(--surface); font-size:19px; font-weight:700; color:var(--brand); }
.stepper input{ width:60px; height:38px; text-align:center; border-radius:11px; border:1px solid var(--line); background:var(--surface-2); font-weight:800; }

/* mode tabs on sheets */
.modes{ display:grid; grid-template-columns:repeat(4,1fr); gap:6px; margin-bottom:12px; }
.modes button{ height:54px; border-radius:13px; border:1.5px solid var(--line); background:var(--surface); font-size:12px; font-weight:800; color:var(--ink-2);
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px; }
.modes button b{ font-size:17px; line-height:1; }
.modes button.on[data-m="use"]{ border-color:var(--red); background:var(--red-tint); color:var(--red-ink); }

/* ════════════ STATE + SYNC ════════════ */
let state = { inventoryItems:{}, pantryItems:{}, shoppingList:{}, activityLog:{}, lastUpdated:0 };
let lastSyncOk = false, lastSyncTime = 0, loaded = false;

function withTimeout(p, ms){ return Promise.race([p, new Promise((_, rej) => setTimeout(() => rej(new Error('timeout')), ms))]); }
async function firebaseGet(){ const r = await withTimeout(fetch(FIREBASE_URL + '/' + FIREBASE_PATH + '.json'), 8000); if (!r.ok) throw new Error('get ' + r.status); return r.json(); }
async function firebaseStamp(){ const r = await withTimeout(fetch(FIREBASE_URL + '/' + FIREBASE_PATH + '/lastUpdated.json'), 6000); if (!r.ok) throw new Error('stamp ' + r.status); return r.json(); }
async function firebaseSet(data){
  const r = await withTimeout(fetch(FIREBASE_URL + '/' + FIREBASE_PATH + '.json', { method:'PUT', headers:{'Content-Type':'application/json'}, body: JSON.stringify(data) }), 9000);
  if (!r.ok) throw new Error('set ' + r.status); return true;
}
function normalizeState(){
  const s = state;
  s.inventoryItems = s.inventoryItems || {}; s.pantryItems = s.pantryItems || {}; s.shoppingList = s.shoppingList || {};
  s.expenses = s.expenses || {}; s.notes = s.notes || {}; s.activityLog = s.activityLog || {};
  s.salesLog = s.salesLog || {}; s.closingDone = s.closingDone || {}; s.orderExclusions = s.orderExclusions || {};
  s.migrations = s.migrations || {}; s.receiptImports = s.receiptImports || {}; s.settings = s.settings || {};
  if (s.settings.closingReminderOn === undefined) s.settings.closingReminderOn = true;
  if (!s.settings.closingReminderTime) s.settings.closingReminderTime = '21:00';
  bumpCaches();
}
async function loadState(){
  let remote = null;
  try { remote = await firebaseGet(); markSynced(true); } catch(e){ console.error('load failed', e); markSynced(false); }
  if (remote) state = remote;
  else { try { const v = localStorage.getItem(STORAGE_KEY); if (v) state = JSON.parse(v); } catch(e){} }
  state = state || {};
  normalizeState();
  loaded = true;
}
async function saveState(){
  state.lastUpdated = Date.now();
  bumpCaches();
  try { await firebaseSet(state); markSynced(true); }
  catch(e){ console.error('save failed', e); markSynced(false); toast('⚠️ Could not sync — saved on this phone, will retry'); pendingSave = true; }
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch(e){}
}
let pendingSave = false;
function markSynced(ok){ lastSyncOk = ok; lastSyncTime = Date.now(); const el = $('#syncTxt'); if (el) paintSync(); }
function paintSync(){
  const el = $('#sync'); if (!el) return;
  const secs = Math.floor((Date.now() - lastSyncTime) / 1000);
  const when = !lastSyncTime ? 'connecting' : secs < 5 ? 'just now' : secs < 60 ? secs + 's ago' : Math.floor(secs/60) + 'm ago';
  el.className = 'sync' + (lastSyncOk ? '' : ' bad');
  $('#syncTxt').textContent = (lastSyncOk ? 'Synced ' : 'Offline · ') + when;
}
let stampMisses = 0;
function startSync(){
  setInterval(async () => {
    if (document.hidden) return;
    if (pendingSave){ pendingSave = false; await saveState(); return; }
    const a = document.activeElement;
    const editing = a && ['INPUT','TEXTAREA','SELECT'].includes(a.tagName);
    if (editing || sheetOpen()) return;
    try{
      let stamp = null, ok = true;
      try { stamp = await firebaseStamp(); } catch(e){ ok = false; }
      if (ok && stamp){ markSynced(true); stampMisses = 0; if (state.lastUpdated && stamp <= state.lastUpdated) return; }
      else { stampMisses++; if (stampMisses % 6 !== 1) return; }
      const remote = await firebaseGet(); markSynced(true);
      if (remote && remote.lastUpdated && (!state.lastUpdated || remote.lastUpdated > state.lastUpdated)){
        state = remote; normalizeState(); render();
      }
    }catch(e){ markSynced(false); }
  }, 5000);
  setInterval(() => { if (!document.hidden) paintSync(); }, 1000);
}

/* caches keyed on the log — cleared on every save or sync */
let CACHE = {};
function bumpCaches(){ CACHE = {}; }
function memo(key, fn){ if (!(key in CACHE)) CACHE[key] = fn(); return CACHE[key]; }

/* ════════════ PEOPLE ════════════ */
const BASE_PEOPLE = ['Sravya'];
function peopleList(){
  const extra = Array.isArray(state.settings.people) ? state.settings.people : [];
  const seen = new Set(), out = [];
  for (const n of [...BASE_PEOPLE, ...extra]){ const t = String(n||'').trim(); if (t && !seen.has(t.toLowerCase())){ seen.add(t.toLowerCase()); out.push(t); } }
  return out;
}
function currentUser(){ return localStorage.getItem(LS_WHO) || ''; }
function ownerNames(){ const o = Array.isArray(state.settings.owners) && state.settings.owners.length ? state.settings.owners : ['Sravya']; return o.map(x => x.toLowerCase()); }
function isOwner(){ return ownerNames().includes(currentUser().toLowerCase()) && localStorage.getItem(LS_STAFFVIEW) !== '1'; }
function isOwnerName(){ return ownerNames().includes(currentUser().toLowerCase()); }

/* ════════════ ACTIVITY LOG ════════════ */
function trimLog(){
  const entries = Object.entries(state.activityLog).sort((a,b) => (b[1].ts||0) - (a[1].ts||0));
  if (entries.length > 3000) state.activityLog = Object.fromEntries(entries.slice(0, 3000));
}
function addLogEntry(section, action, itemName, detail, extra){
  extra = extra || {};
  const id = genId();
  const e = { section, action, itemName, detail, category: extra.category || '',
    beforeQty: extra.beforeQty ?? null, afterQty: extra.afterQty ?? null,
    beforePrice: extra.beforePrice ?? null, afterPrice: extra.afterPrice ?? null,
    spent: (typeof extra.spent === 'number' && extra.spent > 0) ? extra.spent : null,
    unit: extra.unit || '', reason: extra.reason || '', user: currentUser() || 'Someone',
    ts: extra.ts || Date.now(), enteredAt: extra.enteredAt || null, kind: extra.kind || '' };
  if (extra.cover) e.cover = extra.cover;
  state.activityLog[id] = e;
  trimLog();
  return id;
}
function isCountCorrection(e){ return e.reason === 'daily closing count' || e.reason === 'spot count' || e.reason === 'moved from stock' || e.kind === 'count'; }
function intakeSpend(e){
  if (typeof e.spent === 'number') return e.spent;
  if (e.user === 'Excel import' && e.afterPrice != null && (e.detail || '').includes('price ₹')) return Number(e.afterPrice) || 0;
  return 0;
}

/* ════════════ UNITS (unchanged rules from the old app) ════════════ */
const UNIT_CANON = {
  packet:'packets', packets:'packets', pkt:'packets', pkts:'packets', pack:'packets', packs:'packets',
  bottle:'bottles', bottles:'bottles', btl:'bottles', btls:'bottles',
  piece:'pieces', pieces:'pieces', pc:'pieces', pcs:'pieces', no:'pieces', nos:'pieces',
  box:'boxes', boxes:'boxes', can:'cans', cans:'cans', tin:'tins', tins:'tins', jar:'jars', jars:'jars',
  bag:'bags', bags:'bags', roll:'rolls', rolls:'rolls', tray:'trays', trays:'trays',
  cup:'cups', cups:'cups', sachet:'sachets', sachets:'sachets', strip:'strips', strips:'strips',
  plate:'plates', plates:'plates', dozen:'dozen', dozens:'dozen',
  kg:'kg', kgs:'kg', kilo:'kg', kilos:'kg', kilogram:'kg', kilograms:'kg',
  g:'g', gm:'g', gms:'g', gram:'g', grams:'g',
  l:'L', lt:'L', ltr:'L', lit:'L', litre:'L', liter:'L', litres:'L', liters:'L', ml:'ml' };
const UNIT_STEMS = [['packet','packets'],['pack','packets'],['pkt','packets'],['paket','packets'],['bottle','bottles'],['bottl','bottles'],['botl','bottles'],['bottel','bottles'],
  ['piece','pieces'],['box','boxes'],['can','cans'],['tin','tins'],['jar','jars'],['bag','bags'],['roll','rolls'],['tray','trays'],['cup','cups'],['sachet','sachets'],['strip','strips'],['plate','plates']];
function canonUnit(raw){
  const u = String(raw || '').trim(); if (!u) return '';
  const c = UNIT_CANON[u.toLowerCase()]; if (c) return c;
  const letters = u.toLowerCase().replace(/[^a-z]/g, '');
  for (const [stem, canon] of UNIT_STEMS) if (letters.startsWith(stem)) return canon;
  return u;
}
const DEFAULT_UNITS = ['kg','g','L','ml','packets','pieces','bottles','boxes','cans','cups','bags','trays','tins','jars','rolls','plates','dozen'];
const PACK_CONTENT_UNITS = ['L','ml','kg','g','pieces'];
const SUGGESTED_UNITS = ['kg','g','L','ml','pieces','packet','bottle','box','bag','crate','dozen'];
const WEIGHT_UNITS = { g:1, gram:1, grams:1, gm:1, gms:1, kg:1000, kgs:1000, kilo:1000, kilos:1000, kilogram:1000, kilograms:1000 };
const VOLUME_UNITS = { ml:1, milliliter:1, milliliters:1, millilitre:1, millilitres:1, l:1000, ltr:1000, litre:1000, litres:1000, liter:1000, liters:1000 };
function unitFamily(unit){ const u = String(unit||'').trim().toLowerCase(); if (u in WEIGHT_UNITS) return { table:WEIGHT_UNITS, choices:['kg','g'] }; if (u in VOLUME_UNITS) return { table:VOLUME_UNITS, choices:['L','ml'] }; return null; }
function convertWithin(a, b){ a = String(a||'').trim().toLowerCase(); b = String(b||'').trim().toLowerCase(); if (!a || !b) return null; if (a === b) return 1; const f = unitFamily(a); if (!f || !(b in f.table)) return null; return f.table[a] / f.table[b]; }
function allKnownUnits(){ const set = new Set(DEFAULT_UNITS); (state.units || []).forEach(u => { const c = canonUnit(u); if (c) set.add(c); }); return Array.from(set).sort((a,b) => a.localeCompare(b)); }
function looksLikeUnitString(u){
  const s = String(u||'').trim(); if (!s || /\s/.test(s) || /[\/.,]/.test(s) || s.length > 10 || /\d/.test(s)) return false;
  const sl = s.toLowerCase();
  if (s.length >= 3) for (const id in state.inventoryItems){ const nm = (state.inventoryItems[id].name||'').trim().toLowerCase(); if (nm.length >= 3 && (nm === sl || nm.includes(sl) || sl.includes(nm))) return false; }

  const alt = altFactorFor(it, from); if (alt != null) return per * alt;
  if (unitIsKnownFor(it, from)) return convertToBase(it, per, from);
  return null;
}
const ssFmtPer = p => `${p.per} ${isPieceUnit(p.perUnit) ? (Number(p.per) === 1 ? 'piece' : 'pieces') : (p.perUnit || '')}`;
function ssEntry(ds, shift){ return Object.entries(state.salesLog).find(([, e]) => e.bizDate === ds && e.shift === shift) || null; }
// What the day's sales should have used, per stock item name.
function salesNeedOn(ds){
  return memo('need:' + ds, () => {
    const prods = ssProducts(), day = ssEntry(ds, 'day'), night = ssEntry(ds, 'night');
    const dc = (day && day[1].counts) || {}, nc = (night && night[1].counts) || {};
    const out = {};
    for (const p of prods){
      if (!p.item) continue;
      const f = itemByName(p.item); const per = f ? ssPerInItem(p, f.it) : null;
      const o = out[p.item] = out[p.item] || { day:0, night:0, bad:[] };
      if (per == null){ if (dc[p.key] || nc[p.key]) o.bad.push(p); continue; }
      o.day += (dc[p.key] || 0) * per; o.night += (nc[p.key] || 0) * per;
    }
    for (const k in out){ out[k].day = r3(out[k].day); out[k].night = r3(out[k].night); out[k].total = r3(out[k].day + out[k].night); }
    return { byItem:out, hasDay:!!day, hasNight:!!night, day, night, dc, nc };
  });
}
const linkedItems = () => [...new Set(ssProducts().map(p => p.item).filter(Boolean))];
// Average daily need from sales over the business days that have entries.
function salesDailyRate(it, beforeDs, days){
  if (!linkedItems().includes(it.name)) return null;
  let tot = 0, n = 0;
  for (let i = 1; i <= (days || 14); i++){
    const ds = addDaysStr(beforeDs, -i), s = salesNeedOn(ds);
    if (!s.hasDay && !s.hasNight) continue;
    n++; tot += (s.byItem[it.name] && s.byItem[it.name].total) || 0;
  }
  return n >= 3 && tot > 0 ? { rate: tot / n, days: n } : null;
}
// The rate an item is expected to go at: sales first, logged usage otherwise.
function dailyRate(it, at){
  const beforeTs = at == null ? Date.now() : at;
  const key = 'rate:' + it.name + ':' + (at == null ? 'now' : at);
  return memo(key, () => {
    const s = salesDailyRate(it, dateStrFromTs(beforeTs), 14);
    if (s) return { rate:s.rate, src:'sales', note:`sales over ${s.days} days` };
    const b = recentBurnRate(it.name, roCfg().burnWindow, beforeTs);
    if (b) return { rate:b, src:'usage', note:`use over the last ${roCfg().burnWindow} days` };
    const c = computeItemCycles(it.name);
    if (c.perDay > 0) return { rate:c.perDay, src:'cycle', note:'past order cycles' };
    return null;
  });
}

/* ════════════ BATCHES — how long each delivery should last ════════════
   Every receipt starts a batch. At the moment it arrives, the stock on hand
   divided by the expected daily rate gives the days it should last. Using
   it up faster than that — or finishing before that date — is flagged. */
function coverAtReceipt(it, ts, stockAfter){
  const r = dailyRate(it, ts - 1);
  if (!r || !(r.rate > 0) || !(stockAfter > 0)) return null;
  const days = stockAfter / r.rate;
  return { rate: r3(r.rate), src: r.src, days: Math.round(days * 10) / 10, until: ts + days * DAY, stock: r3(stockAfter) };
}
function itemBatches(it){
  return memo('batch:' + it.name, () => {
    const moves = itemMoves(it); if (!moves.length) return [];
    const suffix = new Array(moves.length + 1).fill(0);
    for (let i = moves.length - 1; i >= 0; i--) suffix[i] = suffix[i+1] + moves[i].delta;
    const cur = qtyOf(it);
    const balAfter = i => r3(cur - suffix[i+1]);
    const receipts = moves.map((m, i) => ({ m, i })).filter(x => x.m.kind === 'in' && !x.m.excluded);
    const out = [];
    receipts.forEach((rc, k) => {
      const start = rc.m.ts, next = receipts[k+1], end = next ? next.m.ts : Date.now();
      const stockAfter = balAfter(rc.i);
      const cov = rc.m.e.cover || coverAtReceipt(it, start, stockAfter);
      let used = 0, ranOutTs = null, balBeforeNext = null;
      const dayUse = {};
      for (let j = rc.i + 1; j < moves.length && moves[j].ts < end; j++){
        const mm = moves[j];
        if (mm.delta < 0 && mm.kind !== 'in'){ used -= mm.delta; dayUse[mm.ds] = (dayUse[mm.ds] || 0) - mm.delta; }
        if (ranOutTs == null && balAfter(j) <= 0) ranOutTs = mm.ts;
      }
      if (next) balBeforeNext = next.i > 0 ? balAfter(next.i - 1) : 0;
      used = r3(used);
      const elapsed = Math.max(0, (end - start) / DAY);
      // Expected use: sales need across the batch days where sales were entered; otherwise rate × days.
      let expected = null, expSrc = null;
      if (cov){
        if (cov.src === 'sales'){
          let need = 0, days = 0;
          for (let ds = dateStrFromTs(start); ds <= dateStrFromTs(end); ds = addDaysStr(ds, 1)){
            const s = salesNeedOn(ds); if (!s.hasDay && !s.hasNight) continue;
            days++; need += (s.byItem[it.name] && s.byItem[it.name].total) || 0;
          }
          if (days){ expected = r3(need); expSrc = 'sales'; }
        }
        if (expected == null){ expected = r3(cov.rate * elapsed); expSrc = 'rate'; }
      }
      const flags = [];
      let status = cov ? 'ok' : 'nodata';
      if (cov){
        const lastedDays = ranOutTs ? (ranOutTs - start) / DAY : null;
        const earlyBy = ranOutTs ? (cov.until - ranOutTs) / DAY : null;
        if (ranOutTs && earlyBy > 0.5){ status = 'over'; flags.push(`Ran out ${fmtDays(earlyBy)} early — lasted ${fmtDays(lastedDays)} of the expected ${fmtDays(cov.days)}`); }
        const over = used - expected, tol = Math.max(expected * 0.15, cov.stock * 0.05, 0.001);
        if (expected != null && elapsed >= 0.75 && over > tol){ status = 'over'; flags.push(`${fmtNum(r3(over))} ${it.unit || ''} more used than expected (${Math.round(over / Math.max(expected, .001) * 100)}% over)`); }
        // Days that went well past the expected daily rate.
        const hotDays = Object.entries(dayUse).filter(([, q]) => q > cov.rate * 1.5 && q - cov.rate > Math.max(cov.rate * 0.25, 0.001))
          .map(([ds, q]) => ({ ds, q:r3(q), over:r3(q - cov.rate) })).sort((a,b) => a.ds.localeCompare(b.ds));
        const open = !next;
        let projOut = null, paceDays = null;
        if (open && elapsed >= 1 && used > 0){ const pace = used / elapsed; paceDays = pace; const left = qtyOf(it); projOut = left > 0 ? Date.now() + left / pace * DAY : Date.now(); }
        if (open && status === 'ok' && elapsed >= 2 && expected != null && used > expected * 1.25 && projOut && projOut < cov.until - DAY){ status = 'pace'; flags.push(`At this pace it runs out ${dayMonth(projOut)} — ${fmtDays((cov.until - projOut) / DAY)} before expected`); }
        out.push({ it, m:rc.m, start, end, open, stockAfter, cov, used, expected, expSrc, elapsed, ranOutTs, status, flags, hotDays, projOut, pace:paceDays, spent:rc.m.spent, received:rc.m.delta });
      } else out.push({ it, m:rc.m, start, end, open:!next, stockAfter, cov:null, used, expected:null, elapsed, ranOutTs, status, flags, hotDays:[], received:rc.m.delta, spent:rc.m.spent });
    });
    return out;
  });
}
function stockAfterReceipt(it, ts, amt){ return dateStrFromTs(ts) === todayStr() ? r3(qtyOf(it) + amt) : r3(balanceAt(it, ts) + amt); }
const currentBatch = it => { const b = itemBatches(it); return b.length && b[b.length-1].open ? b[b.length-1] : null; };
function overUsageAlerts(days){
  return memo('overAlerts:' + (days || 14), () => {
    const cutoff = Date.now() - (days || 14) * DAY, out = [];
    for (const [id, it] of itemsList()){
      for (const b of itemBatches(it)){
        if ((b.status === 'over' || b.status === 'pace') && b.end >= cutoff) out.push({ id, it, b });
      }
    }
    return out.sort((a,b) => (a.b.status === 'over' ? 0 : 1) - (b.b.status === 'over' ? 0 : 1) || b.b.end - a.b.end);
  });
}

/* ════════════ SALES vs STOCK for one business date ════════════ */
function salesCheck(ds){
  const s = salesNeedOn(ds), out = [];
  for (const [name, n] of Object.entries(s.byItem)){
    const f = itemByName(name); if (!f){ out.push({ name, missing:true }); continue; }
    const dl = dayLedger(f.it, ds), actual = dl.out;
    const handover = s.day && s.day[1].left && s.day[1].left[name] != null ? Number(s.day[1].left[name]) : null;
    let dayAct = null, nightAct = null;
    if (handover != null){ dayAct = r3(dl.open + dl.in - handover); nightAct = r3(handover - dl.close); }
    out.push({ name, id:f.id, unit:f.it.unit || '', exp:n.total, expDay:n.day, expNight:n.night, actual, waste:dl.waste, short: dl.count < 0 ? -dl.count : 0, handover, dayAct, nightAct, bad:n.bad });
  }
  return { ...s, items: out };
}
function verdict(exp, act){
  if (!exp && !act) return { cls:'gray', txt:'Nothing sold or used.' };
  if (!act) return { cls:'gray', txt:'No use logged in stock for this date yet — log Used (pick the date) or do the closing count.' };
  const gap = r3(act - exp), pct = exp ? Math.round(gap / exp * 100) : 100;
  if (Math.abs(pct) <= 10) return { cls:'green', txt: pct === 0 ? 'Matches what sales need.' : `Within ${Math.abs(pct)}% of what sales need — fine.`, gap, pct };
  if (gap > 0) return { cls: pct > 20 ? 'red' : 'amber', txt:`<b>${fmtNum(gap)}</b> more used than sales explain (${pct}% over). Check unbilled plates, portion size, staff meals or unlogged waste.`, gap, pct };
  return { cls:'amber', txt:`<b>${fmtNum(-gap)}</b> less used than sales need (${-pct}%). Sales over-entered, small portions, or use not logged for this date.`, gap, pct };
}

/* ════════════ USAGE ANALYTICS ════════════ */
function dayOutAll(ds){
  return memo('dayOut:' + ds, () => {
    const rows = []; let value = 0, inValue = 0, spent = 0;
    for (const [id, it] of itemsList()){
      const moves = itemMoves(it).filter(m => m.ds === ds); if (!moves.length) continue;
      const dl = dayLedger(it, ds); const rt = rateFor(it);
      const v = rt ? rt.rate * dl.out : null;
      if (v) value += v; if (rt && dl.in) inValue += rt.rate * dl.in; spent += dl.spent;
      rows.push({ id, it, dl, value:v });
    }
    return { rows, value, inValue, spent };
  });
}
function usualDay(it, beforeDs){
  const from = addDaysStr(beforeDs, -45), per = {};
  for (const m of itemMoves(it)){ if (m.ds >= beforeDs || m.ds < from || m.delta >= 0 || m.kind === 'in') continue; per[m.ds] = (per[m.ds] || 0) - m.delta; }
  const vals = Object.values(per).filter(v => v > 0);
  return { median: median(vals), days: vals.length };
}
function monthMovement(mk){
  return memo('month:' + mk, () => {
    const purch = {}, usage = {};
    for (const e of Object.values(state.activityLog)){
      if (e.section !== 'inventory' || (e.action !== 'update' && e.action !== 'add') || monthKey(dateStrFromTs(e.ts)) !== mk) continue;
      const hasQ = e.afterQty != null;
      const delta = hasQ ? Number(e.afterQty) - (e.beforeQty == null ? 0 : Number(e.beforeQty)) : 0;
      const spend = intakeSpend(e);
      if ((delta > 0 && !isCountCorrection(e)) || spend > 0){ const p = purch[e.itemName] = purch[e.itemName] || { qty:0, spend:0, unit:e.unit || '' }; if (delta > 0) p.qty += delta; p.spend += spend; }
      if (delta < 0){ const u = usage[e.itemName] = usage[e.itemName] || { qty:0, unit:e.unit || '' }; u.qty -= delta; }
    }
    return { purch, usage };
  });
}
function intakeOn(ds){
  const out = [];
  for (const [id, e] of Object.entries(state.activityLog)){
    if (!e || !e.ts || e.section !== 'inventory' || dateStrFromTs(e.ts) !== ds || (e.action !== 'add' && e.action !== 'update')) continue;
    const before = e.beforeQty == null ? 0 : Number(e.beforeQty), after = e.afterQty == null ? 0 : Number(e.afterQty);
    const gain = e.action === 'add' ? after : after - before; if (!(gain > 0)) continue;
    out.push({ id, e, gain:r3(gain), corr:isCountCorrection(e), excluded:!!state.orderExclusions[id] });
  }
  return out.sort((a,b) => b.e.ts - a.e.ts);
}

}

/* ---------- routing ---------- */

}

function coverPill(days){

  return `<span class="pill ${c}">${days < 1 ? '< 1 day' : fmtDays(days)} left</span>`;

function statusPill(st){ return ({ crit:'<span class="pill red">Order now</span>', soon:'<span class="pill amber">Due soon</span>', ok:'<span class="pill green">On track</span>', idle:'<span class="pill">Not moving</span>', nodata:'<span class="pill">No history</span>', off:'<span class="pill">Left out</span>' })[st] || ''; }
function emptyState(icon, title, text){ return `<div class="empty"><div class="big">${icon}</div><b>${esc(title)}</b>${text || ''}</div>`; }
function kindTag(k){ return `<span class="k ${k}">${({ in:'In', used:'Used', waste:'Waste', count:'Count' })[k] || 'Edit'}</span>`; }
function selectOptions(list, sel, blank){ return (blank != null ? `<option value="">${esc(blank)}</option>` : '') + list.map(x => { const v = typeof x === 'object' ? x.v : x, l = typeof x === 'object' ? x.l : x; return `<option value="${esc(v)}"${v === sel ? ' selected' : ''}>${esc(l)}</option>`; }).join(''); }
function barsChart(cols, opts){
  opts = opts || {};
  const max = Math.max(0.0001, ...cols.map(c => Math.max(...c.vals.map(v => v.v || 0))));
  return `<div class="bars" style="height:${opts.h || 110}px">${cols.map(c => `<button class="b ${c.on ? 'on' : ''}" ${c.act || ''} title="${esc(c.title || '')}">
    <div class="stk">${c.vals.map(v => `<i class="${v.cls || ''}" style="height:${Math.max(v.v ? 3 : 0, Math.round((v.v || 0) / max * 100))}%"></i>`).join('')}</div><span>${esc(c.label)}</span></button>`).join('')}</div>`;
}
function downloadBlob(blob, name){ const url = URL.createObjectURL(blob); const a = document.createElement('a'); a.href = url; a.download = name; document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(url); a.remove(); }, 1500); }
function csvDownload(rows, name){ downloadBlob(new Blob([rows.map(r => r.map(c => '"' + String(c ?? '').replace(/"/g, '""') + '"').join(',')).join('\n')], { type:'text/csv' }), name); }
async function shareFile(blob, name, title){
  const file = new File([blob], name, { type: blob.type });
  if (navigator.canShare && navigator.canShare({ files:[file] })){ try { await navigator.share({ files:[file], title }); return; } catch(e){ if (e.name === 'AbortError') return; } }
  downloadBlob(blob, name); toast('Saved to your phone');
}

  render(ctx){
    const it = state.inventoryItems[ctx.id];

    const r = reorderRowFor(ctx.id) || {}, u = esc(it.unit || ''), rt = rateFor(it), dr = dailyRate(it);
    const cover = daysOfStockLeft(it), val = stockValue(it);
    const b = currentBatch(it), batches = itemBatches(it).slice().reverse();
    const today = todayStr(), rows = [];
    let tot = { in:0, used:0, waste:0, count:0 };
    for (let i = 0; i < UI.ledgerDays; i++){ const d = dayLedger(it, addDaysStr(today, -i)); rows.push(d); tot.in += d.in; tot.used += d.used; tot.waste += d.waste; tot.count += d.count; }

    const z = n => { const x = r3(n); return x ? String(x) : '<span class="muted">0</span>'; };
    const onList = !!state.shoppingList['inv_' + ctx.id];
    const over = b && b.status === 'over', fast = b && b.status === 'pace';
    let tone, head;
    if (r.status === 'crit'){ tone = 'red'; head = 'Running out — order now'; }
    else if (over){ tone = 'red'; head = 'Being used faster than normal'; }
    else if (r.status === 'soon'){ tone = 'amber'; head = 'Getting low — order soon'; }
    else if (fast){ tone = 'amber'; head = 'Going a bit fast'; }
    else if (r.status === 'idle'){ tone = 'gray'; head = 'Not used lately'; }
    else if (cover != null){ tone = 'green'; head = 'Enough stock'; }
    else { tone = 'gray'; head = 'Not enough entries yet'; }
    const lastLine = cover != null ? `That's enough for about <b>${fmtDays(cover)}</b>${dr ? `<br><span class="muted">Uses about ${fmtNum(r3(dr.rate))} ${u} a day</span>` : ''}`
      : '<span class="muted">Keep entering what is used — the app will then tell you how long it lasts.</span>';

    // warnings in plain words
    const warns = [];
    if (b && (over || fast)) b.flags.forEach(f => warns.push(esc(f)));
    if (r.shortfall) warns.push(`At night counts, stock came up short ${r.shortfall.shortCount} times this month — about ${fmtNum(r.shortfall.shortQty)} ${u} missing without an entry.`);

function batchCard(it, b, big){
  const u = esc(it.unit || '');

  const pct = Math.min(100, Math.round(b.elapsed / Math.max(b.cov.days, .01) * 100));

    <div style="font-size:13.5px">Stock after the delivery on <b>${esc(dayMonth(b.start))}</b> was <b>${fmtNum(b.cov.stock)} ${u}</b>. At <b>${fmtNum(b.cov.rate)} ${u}/day</b> (${b.cov.src === 'sales' ? 'from shift sales' : b.cov.src === 'usage' ? 'from recent use' : 'from past cycles'}) it should last <b>${fmtDays(b.cov.days)}</b> — until <b>${esc(dayMonth(b.cov.until))}</b>.</div>
    <div style="margin-top:12px;font-size:12px;font-weight:700" class="row-flex"><span class="muted">Time gone</span><span class="spacer"></span><span>${fmtDays(b.elapsed)} of ${fmtDays(b.cov.days)}</span></div>
    <div class="cover"><i style="width:${pct}%;background:var(--blue)"></i></div>
    <div style="margin-top:8px;font-size:12px;font-weight:700" class="row-flex"><span class="muted">Stock used</span><span class="spacer"></span><span>${fmtNum(b.used)} of ${fmtNum(b.cov.stock)} ${u}${b.expected != null ? ` · expected ${fmtNum(b.expected)} by now` : ''}</span></div>
    <div class="cover ${cls === 'green' ? '' : cls}"><i style="width:${usedPct}%"></i></div>
    ${b.flags.map(f => `<div class="preview ${b.status === 'over' ? 'bad' : 'warn'}" style="margin:10px 0 0;font-size:13px">${esc(f)}</div>`).join('')}
    ${b.hotDays && b.hotDays.length ? `<div style="margin-top:10px;font-size:12.5px"><b>Heavy days:</b> ${b.hotDays.map(h => `${esc(shortDay(h.ds))} ${fmtNum(h.q)} ${u} <span class="muted">(+${fmtNum(h.over)})</span>`).join(' · ')}</div>` : ''}
  </div>`;
}
function batchRow(it, b){
  const u = esc(it.unit || '');

  const pill = b.status === 'over' ? '<span class="pill red">Over-used</span>' : b.status === 'pace' ? '<span class="pill amber">Running fast</span>' : b.status === 'ok' ? (b.open ? '<span class="pill blue">Current</span>' : '<span class="pill green">OK</span>') : '<span class="pill">—</span>';
  return `<div class="mv"><span class="k in">+${fmtNum(b.received)}</span><div class="m"><b>${esc(dayMonth(b.start))}</b> · ${fmtNum(b.received)} ${u}${b.spent ? ' · ' + fmtMoney(b.spent) : ''}

}

/* ---------- item picker ---------- */
ACT.quick = a => pickItem(a.dataset.m);
function recentItemIds(){
  const seen = new Set(), out = [];
  for (const [, e] of recentLines(120, currentUser())){ const f = itemByName(e.itemName); if (f && !seen.has(f.id)){ seen.add(f.id); out.push(f.id); } if (out.length >= 6) break; }
  return out;
}
function pickItem(mode){
  const verb = { use:'Used', add:'Received', count:'Count', waste:'Wasted' }[mode];
  const recents = recentItemIds();
  openSheet({ title: verb + ' — which item?', full:true, body: `
    <div class="f" style="position:sticky;top:0;background:var(--surface);padding:4px 0 8px;z-index:2;margin:0"><input id="pkQ" type="search" placeholder="Type to search…" autocomplete="off"></div>

    mount(){ const q = $('#pkQ'); q.oninput = () => { $('#pkList').innerHTML = pickListHTML(q.value, mode); }; } });
}
function pickRow(id, mode){ const it = state.inventoryItems[id]; return `<button class="li" data-act="adjust" data-id="${id}" data-m="${mode}"><div class="ic">${esc(catEmoji(it.category))}</div><div class="mid"><div class="t">${esc(it.name)}</div><div class="s">${esc(catName(it.category))}</div></div><div class="r"><div class="q">${hasQty(it) ? fmtNum(qtyOf(it)) : '—'} <span class="u">${esc(it.unit || '')}</span></div></div></button>`; }
function pickListHTML(q, mode){
  q = String(q || '').trim().toLowerCase();
  const rows = itemsList().filter(([, it]) => !q || (it.name + ' ' + (it.category || '')).toLowerCase().includes(q))
    .sort((a,b) => catName(a[1].category).localeCompare(catName(b[1].category)) || a[1].name.localeCompare(b[1].name));
  if (!rows.length) return emptyState('🔍', 'No match', `<br><button class="btn sm" data-act="newItem">＋ Add "${esc(q)}" as a new item</button>`);
  let html = '<div class="list">', last = null;
  for (const [id, it] of rows){ if (!q && (it.category || '') !== last){ last = it.category || ''; html += `<div class="li-group">${esc(last || 'Uncategorised')}</div>`; } html += pickRow(id, mode); }
  return html + '</div>';
}

/* ---------- adjust sheet: Used / Received / Count / Wasted ---------- */
const AD = { id:null, mode:'use' };

function openAdjust(id, mode){

    foot: `<button class="btn primary block" id="adConfirm" style="height:52px"></button>`, mount: adjustMount });
}
function adjustBody(it){
  const units = unitOptionsForItem(it), known = new Set(units.map(u => u.toLowerCase()));
  const extra = SUGGESTED_UNITS.filter(u => !known.has(canonUnit(u).toLowerCase()));
  return `

      <div class="hint" id="adPriceHint">Whatever you paid this time — the rate is worked out for you.</div></div>
    <div class="f2">
      <div class="f"><label>Date</label><input type="date" id="adDate" value="${todayStr()}" max="${todayStr()}"></div>
      <div class="f"><label>Note</label><input id="adNote" placeholder="optional"></div>
    </div>`;
}
function adjustMount(){
  const it = () => state.inventoryItems[AD.id];
  $$('#sheet .modes button').forEach(b => b.onclick = () => { AD.mode = b.dataset.m; $$('#sheet .modes button').forEach(x => x.classList.toggle('on', x === b)); adjustRefresh(); });
  $('#adAmt').oninput = () => { const p = parseAmountEntry($('#adAmt').value); if (p.unit){ const c = canonUnit(p.unit); const o = $$('#adUnit option').find(x => x.value.toLowerCase() === c.toLowerCase()); if (o) $('#adUnit').value = o.value; } adjustRefresh(); };
  $('#adUnit').onchange = adjustRefresh; $('#adPrice').oninput = adjustRefresh; $('#adPriceMode').onchange = adjustRefresh; $('#adDate').onchange = adjustRefresh;
  $('#adConfirm').onclick = adjustConfirm;
  adjustRefresh();
  setTimeout(() => $('#adAmt') && $('#adAmt').focus(), 250);
}
function adEntered(){ return parseAmountEntry($('#adAmt').value).num; }
function adTeachFactor(){ const el = $('#adTeachF'); return el ? Number(el.value) : NaN; }
function adAmtBase(){
  const it = state.inventoryItems[AD.id], raw = adEntered(); if (!raw || isNaN(raw)) return 0;
  const u = $('#adUnit').value;
  if (u && u.toLowerCase() !== String(it.unit || '').toLowerCase() && !unitIsKnownFor(it, u)){ const f = adTeachFactor(); return f > 0 ? r3(raw * f) : NaN; }
  return convertToBase(it, raw, u);
}
function adjustRefresh(){
  const it = state.inventoryItems[AD.id]; if (!it) return;
  const m = AD.mode, out = m === 'use' || m === 'waste', cur = qtyOf(it), unit = it.unit || '';
  $('#adLbl').textContent = { use:'How much was used?', add:'How much came in?', count:'How much is actually there now?', waste:'How much was thrown away?' }[m];
  $('#adConfirm').textContent = { use:'Confirm used', add:'Confirm received', count:'Save count', waste:'Confirm wasted' }[m];
  $('#adNote').placeholder = m === 'waste' ? 'Why? spoiled, burnt, expired…' : 'optional';
  $('#adPriceWrap').classList.toggle('hide', m !== 'add');
  // teach a new unit inline
  const u = $('#adUnit').value, teach = $('#adTeach');
  const needTeach = u && u.toLowerCase() !== unit.toLowerCase() && !unitIsKnownFor(it, u);
  if (needTeach){
    if (!$('#adTeachF')){ teach.innerHTML = `<b>1 ${esc(unitOne(u))} = </b><input id="adTeachF" inputmode="decimal" class="inp" style="width:90px;height:38px;display:inline-block;margin:0 6px" placeholder="?"> <b>${esc(unit)}</b><div style="font-size:12px;margin-top:4px">Saved on this item, so next time you can just pick ${esc(u)}.</div>`; $('#adTeachF').oninput = adjustRefresh; }
    teach.classList.remove('hide');
  } else { teach.classList.add('hide'); teach.innerHTML = ''; }
  // chips
  const chips = [];
  if (m === 'count'){ if (cur > 0) chips.push([`Matches (${fmtNum(cur)})`, cur]); chips.push(['0 — finished', 0]); }
  else { for (const n of [0.5, 1, 2, 5]) if (!(out && (!(cur > 0) || n > cur))) chips.push([String(n), n]); if (out && cur > 0) chips.push(['Half', r3(cur / 2)], ['All', cur]); }
  $('#adChips').innerHTML = chips.map(([l, v]) => `<button type="button" data-v="${v}">${esc(l)}</button>`).join('');
  $$('#adChips button').forEach(b => b.onclick = () => { $('#adUnit').value = $$('#adUnit option')[0].value; $('#adAmt').value = b.dataset.v; adjustRefresh(); });
  // preview
  const amt = adAmtBase(), prev = $('#adPrev'); prev.className = 'preview';
  const raw = adEntered();
  if (m === 'count'){
    if (isNaN(raw)){ prev.textContent = `The app expects ${fmtNum(cur)} ${unit}. Enter what's really there.`; }
    else { const gap = r3(amt - cur); prev.className = 'preview ' + (gap === 0 ? 'good' : gap < 0 ? 'bad' : 'info');
      prev.textContent = gap === 0 ? `✓ Matches — expected ${fmtNum(cur)} ${unit}` : gap < 0 ? `⚠ Short ${fmtNum(-gap)} ${unit} — expected ${fmtNum(cur)}, counted ${fmtNum(amt)}` : `Extra ${fmtNum(gap)} ${unit} — expected ${fmtNum(cur)}, counted ${fmtNum(amt)}`; }
  } else if (!amt || isNaN(amt)){ prev.textContent = out ? `Remaining after: —` : `New total: —`; }
  else if (out){ const rem = r3(cur - amt); if (rem < 0){ prev.className = 'preview warn'; prev.textContent = `More than the ${fmtNum(cur)} ${unit} in stock — it will be set to 0. A delivery may not have been entered.`; } else prev.textContent = `Remaining after: ${fmtNum(rem)} ${unit}`; }
  else prev.textContent = `New total: ${fmtNum(r3(cur + amt))} ${unit}`;
  // expected cover for a delivery

function closeGap(id){

  el.innerHTML = gap === 0 ? `<span style="color:var(--green)">✓ Matches ${fmtNum(exp)} ${u}</span>` : gap < 0 ? `<span style="color:var(--red);font-weight:700">Short ${fmtNum(-gap)} ${u}</span> · expected ${fmtNum(exp)}` : `<span style="color:var(--blue);font-weight:700">+${fmtNum(gap)} ${u} extra</span> · expected ${fmtNum(exp)}`;

function closeSummary(){

ACT.saveClosing = async () => {

const REP = {};
PAGES.rep = {

function dateNav(ds, act){ return `<div class="row-flex" style="margin-bottom:12px"><button class="btn sm" data-act="${act}" data-ds="${addDaysStr(ds, -1)}">‹</button><input type="date" class="inp" id="repDate" value="${ds}" max="${todayStr()}" style="flex:1;height:38px;text-align:center"><button class="btn sm" data-act="${act}" data-ds="${addDaysStr(ds, 1)}" ${ds >= todayStr() ? 'disabled' : ''}>›</button></div>`; }
function monthNav(mk, act){ return `<div class="row-flex" style="margin-bottom:12px"><button class="btn sm" data-act="${act}" data-m="${shiftMonth(mk, -1)}">‹</button><div style="flex:1;text-align:center;font-weight:800">${esc(monthLabel(mk))}</div><button class="btn sm" data-act="${act}" data-m="${shiftMonth(mk, 1)}" ${mk >= monthKey(todayStr()) ? 'disabled' : ''}>›</button></div>`; }

/* over-use */
UI.overDays = 30;
REP.overuse = () => {
  const list = overUsageAlerts(UI.overDays);

  cur.sort((a,b) => ({ over:0, pace:1, ok:2 }[a.b.status] ?? 3) - ({ over:0, pace:1, ok:2 }[b.b.status] ?? 3));
  return `<div class="preview info">When stock comes in, the app works out how many days it should last — from shift sales for meat and fish, from the last ${roCfg().burnWindow} days of use for everything else. A delivery is flagged when it runs out early, when more is used than expected, or when it had to be restocked before its time.</div>
    <div class="seg">${[14,30,60].map(n => `<button class="${UI.overDays === n ? 'on' : ''}" data-act="overDays" data-n="${n}">${n} days</button>`).join('')}</div>
    ${list.length ? list.map(a => `<button class="alert ${a.b.status === 'over' ? 'red' : 'amber'}" data-act="item" data-id="${a.id}"><div class="ai">🔥</div><div style="flex:1"><div class="at">${esc(a.it.name)}</div>
      <div class="as">Delivery ${esc(dayMonth(a.b.start))}: ${fmtNum(a.b.cov.stock)} ${esc(a.it.unit || '')} should have lasted ${fmtDays(a.b.cov.days)}.<br>${a.b.flags.map(esc).join('<br>')}</div></div></button>`).join('')

      <div class="cover ${b.status === 'over' ? 'red' : b.status === 'pace' ? 'amber' : ''}"><i style="width:${Math.min(100, Math.round(b.used / Math.max(b.cov.stock, .001) * 100))}%"></i></div></div>
      ${b.status === 'over' ? '<span class="pill red">Over</span>' : b.status === 'pace' ? '<span class="pill amber">Fast</span>' : '<span class="pill green">OK</span>'}</button>`).join('') || '<div class="li muted">No batches with enough history yet.</div>'}</div>`;
};
ACT.overDays = a => { UI.overDays = Number(a.dataset.n); render(); };
REP.gaps = () => gapsHTML();

/* waste */
REP.waste = () => {
  const since = Date.now() - 60 * DAY, rows = [];
  for (const [name, moves] of Object.entries(movementIndex())) for (const m of moves) if (m.kind === 'waste' && m.ts >= since) rows.push({ name, m });
  rows.sort((a,b) => b.m.ts - a.m.ts);
  let value = 0; const byItem = {};
  for (const r of rows){ const f = itemByName(r.name), rt = f ? rateFor(f.it) : null; const v = rt ? rt.rate * -r.m.delta : 0; value += v; byItem[r.name] = (byItem[r.name] || 0) + v; }
  const top = Object.entries(byItem).sort((a,b) => b[1] - a[1]).slice(0, 6), max = Math.max(1, ...top.map(t => t[1]));
  return `<div class="grid2" style="margin-bottom:12px"><div class="stat amber"><div class="k">Wasted · 60 days</div><div class="v">${fmtMoney(value)}</div><div class="d">at cost price</div></div><div class="stat"><div class="k">Entries</div><div class="v">${rows.length}</div></div></div>
    ${top.length && value ? `<div class="card"><h3>Biggest losses</h3>${top.map(([n, v]) => `<div class="hbar"><div class="top"><span>${esc(n)}</span><b>${fmtMoney(v)}</b></div><div class="trk"><i style="width:${Math.round(v / max * 100)}%;background:var(--amber)"></i></div></div>`).join('')}</div>` : ''}
    <div class="card">${rows.map(r => `<div class="mv">${kindTag('waste')}<div class="m"><b>${esc(r.name)}</b><small>${esc(relDay(r.m.ts))} · ${esc(r.m.user)} · ${esc(String(r.m.e.reason || '').replace(/^wasted\s*—?\s*/, '') || 'no reason given')}</small></div><span class="q">−${fmtNum(-r.m.delta)} ${esc(r.m.e.unit || '')}</span></div>`).join('') || '<div class="muted">Nothing logged as waste. Use 🗑 Wasted when food is thrown away, so it doesn’t hide inside Used.</div>'}</div>`;
};

/* daily */
REP.daily = arg => {
  const ds = arg || todayStr(), d = dayOutAll(ds);
  const rows = d.rows.filter(r => r.dl.out || r.dl.in).sort((a,b) => (b.value || 0) - (a.value || 0) || b.dl.out - a.dl.out);
  return dateNav(ds, 'dailyGo') + `
    <div class="grid3" style="margin-bottom:12px"><div class="stat"><div class="k">Used</div><div class="v" style="font-size:18px">${fmtMoney(d.value)}</div></div><div class="stat"><div class="k">Bought</div><div class="v" style="font-size:18px">${fmtMoney(d.spent)}</div></div><div class="stat"><div class="k">Items moved</div><div class="v" style="font-size:18px">${rows.length}</div></div></div>
    ${rows.length ? `<div class="list">${rows.map(r => { const u = usualDay(r.it, ds), dl = r.dl; let lvl = '';
      if (dl.out && u.median && u.days >= 3){ const ratio = dl.out / u.median; lvl = ratio >= 2 ? `<span class="pill red">${fmtNum(Math.round(ratio * 10) / 10)}× usual</span>` : ratio >= 1.35 ? `<span class="pill amber">${Math.round((ratio - 1) * 100)}% above</span>` : ratio <= .6 ? `<span class="pill blue">${Math.round((1 - ratio) * 100)}% below</span>` : '<span class="pill green">normal</span>'; }
      return `<button class="li" data-act="item" data-id="${r.id}"><div class="mid"><div class="t">${esc(r.it.name)}</div><div class="s">${dl.out ? `used ${fmtNum(dl.out)}` : ''}${dl.waste ? ` (waste ${fmtNum(dl.waste)})` : ''}${dl.in ? `${dl.out ? ' · ' : ''}in +${fmtNum(dl.in)}` : ''} ${esc(r.it.unit || '')} · closed at ${fmtNum(dl.close)}${u.median ? ` · usual ${fmtNum(r3(u.median))}` : ''}</div></div><div class="r">${r.value ? `<div class="q">${fmtMoney(r.value)}</div>` : ''}${lvl}</div></button>`; }).join('')}</div>`
      : emptyState('📭', 'Nothing moved on this day')}`;
};

ACT.dailyGo = a => go('rep', 'daily:' + a.dataset.ds, { replace:true });

/* month */

REP.month = () => {
  const mk = UI.repMonth, { purch, usage } = monthMovement(mk);
  const names = [...new Set([...Object.keys(purch), ...Object.keys(usage)])];

  const spend = rows.reduce((s, r) => s + r.spend, 0);

    ${topSpend.length ? `<div class="card"><h3>Where the money went</h3>${topSpend.map(r => `<div class="hbar"><div class="top"><span>${esc(r.n)}</span><b>${fmtMoney(r.spend)}</b></div><div class="trk"><i style="width:${Math.round(r.spend / maxS * 100)}%"></i></div></div>`).join('')}</div>` : ''}

      ${rows.map(r => `<tr><td>${esc(r.n)}</td><td class="pos">${r.buy ? fmtNum(r.buy) : '—'}</td><td class="neg">${r.use ? fmtNum(r.use) : '—'}</td><td>${r.spend ? fmtMoney(r.spend) : '—'}</td></tr>`).join('') || '<tr><td colspan="4" class="muted">Nothing this month.</td></tr>'}

/* stock value */
REP.value = () => {
  const byCat = {}; let tot = 0, unpriced = 0;
  const items = [];
  for (const [id, it] of itemsList()){ const v = stockValue(it); if (v == null){ if (qtyOf(it) > 0) unpriced++; continue; } tot += v; byCat[it.category || 'Uncategorised'] = (byCat[it.category || 'Uncategorised'] || 0) + v; items.push({ id, it, v }); }
  const cats = Object.entries(byCat).sort((a,b) => b[1] - a[1]), max = Math.max(1, ...cats.map(c => c[1]));

  return `<div class="hero"><div class="hk">Stock on hand at cost</div><div class="hv">${fmtMoney(tot)}</div><div class="hs">${items.length} priced items${unpriced ? ` · ${unpriced} in stock without a price` : ''}</div></div>

/* expenses */
UI.expMonth = monthKey(todayStr());
REP.expenses = () => {
  const mk = UI.expMonth, list = Object.entries(state.expenses).filter(([, e]) => (e.date || '').startsWith(mk)).sort((a,b) => (b[1].date || '').localeCompare(a[1].date || '') || (b[1].ts || 0) - (a[1].ts || 0));

ACT.newExpense = () => openSheet({ title:'Cash spent', body:`<div class="f"><label>Amount ₹</label><input id="exAmt" inputmode="decimal" style="font-size:22px;font-weight:800;height:56px"></div><div class="f"><label>What for</label><input id="exNote" placeholder="e.g. gas cylinder, auto fare"></div><div class="f"><label>Date</label><input type="date" id="exDate" value="${todayStr()}" max="${todayStr()}"></div>`,

ACT.newNote = () => noteForm(null);

function noteForm(id){

    <div class="f2"><div class="f"><label>Used</label><input id="ntUsed" inputmode="decimal" value="${esc(n.used ?? '')}" placeholder="optional"></div><div class="f"><label>Left over</label><input id="ntLeft" inputmode="decimal" value="${esc(n.left ?? '')}" placeholder="optional"></div></div>

    <button class="toggle ${n.followUp ? 'on' : ''}" id="ntFollow" type="button"><span class="sw"></span><span class="tx">Needs follow-up<small>Stays pinned until someone marks it done</small></span></button>`,
    foot:'<button class="btn primary block" id="ntSave">Save note</button>',
    mount(){ let tag = n.tag || 'other';
      $$('#ntTags .chip').forEach(b => b.onclick = () => { tag = b.dataset.t; $$('#ntTags .chip').forEach(x => x.classList.toggle('on', x === b)); });
      $('#ntFollow').onclick = () => $('#ntFollow').classList.toggle('on');

        if (f === 'qty') r.qty = e.target.value === '' ? null : Number(e.target.value); if (f === 'price') r.price = e.target.value === '' ? null : Number(e.target.value);
        if (f === 'unit') r.unit = e.target.value; if (f === 'cat') r.category = e.target.value; if (f === 'pick' && e.target.value) xlMatch(r, e.target.value);
        if (['unit','pick'].includes(f)) box.innerHTML = xlRowsHTML(); });
      box.addEventListener('click', e => { const b = e.target.closest('button[data-x]'); if (!b) return; const r = XL.rows.find(x => x.rid === b.closest('[data-rid]').dataset.rid);
        if (b.dataset.x === 'drop') r.drop = !r.drop; if (b.dataset.x === 'unmatch') xlUnmatch(r); if (b.dataset.x === 'match') xlMatch(r, b.dataset.id); box.innerHTML = xlRowsHTML(); });
    } });
}
function xlColOptions(sel){ let h = '<option value="-1">— none —</option>'; for (let c = 0; c < xlWidth(); c++){ const head = XL.headerRow >= 0 ? String((XL.grid[XL.headerRow] || [])[c] || '').trim() : ''; const start = XL.headerRow < 0 ? 0 : XL.headerRow + 1; const sample = String((XL.grid[start] || [])[c] ?? '').slice(0, 14); h += `<option value="${c}"${c === sel ? ' selected' : ''}>${esc(head || 'Column ' + String.fromCharCode(65 + c % 26))}${sample ? ' — ' + esc(sample) : ''}</option>`; } return h; }
function xlRowsHTML(){
  const cats = allKnownCategories(), allOpts = itemsList().sort((a,b) => a[1].name.localeCompare(b[1].name)).map(([id, it]) => `<option value="${id}">${esc(it.name)}</option>`).join('');
  return XL.rows.map(r => {
    const res = xlResolve(r), it = r.matchId ? state.inventoryItems[r.matchId] : null;
    const units = [...new Set([...(unitFamily(r.baseUnit) ? unitFamily(r.baseUnit).choices : []), r.baseUnit, r.unit, ...allKnownUnits()].filter(Boolean))];
    return `<div class="card flat" data-rid="${r.rid}" style="padding:11px;${r.drop ? 'opacity:.4' : ''}">
      <div class="row-flex" style="align-items:flex-start"><div style="flex:1;min-width:0"><div style="font-weight:800">${esc(r.name)}</div>
        <div style="font-size:12px;margin-top:2px">${it ? `<span class="pill green">→ ${esc(it.name)}</span> <button class="link" data-x="unmatch" style="font-size:12px">not this</button>` : `<span class="pill amber">New item</span>`}</div></div>
        <button class="btn sm ghost" data-x="drop">${r.drop ? 'Keep' : 'Skip'}</button></div>
      ${!it && r.suggestions && r.suggestions.length ? `<div class="qchips">${r.suggestions.map(s => `<button type="button" data-x="match" data-id="${s.id}">= ${esc(s.name)}?</button>`).join('')}</div>` : ''}
      ${!it ? `<select class="inp" data-f="pick" style="margin-top:8px;height:38px"><option value="">Or match to an existing item…</option>${allOpts}</select>` : ''}
      <div class="row-flex" style="margin-top:8px"><input class="inp" data-f="qty" inputmode="decimal" value="${r.qty ?? ''}" placeholder="qty" style="width:80px;height:38px"><select class="inp" data-f="unit" style="width:96px;height:38px">${selectOptions(units, canonUnit(r.unit), '—')}</select><input class="inp" data-f="price" inputmode="decimal" value="${r.price ?? ''}" placeholder="₹ rate" style="flex:1;height:38px"></div>
      ${res.conv ? `<div class="muted" style="font-size:12px;margin-top:4px">Goes in as ${fmtNum(res.qty)} ${esc(res.unit)}</div>` : ''}${res.mismatch ? `<div class="preview warn" style="margin:6px 0 0;font-size:12px">“${esc(r.unit)}” doesn't match ${esc(r.baseUnit)} — change the unit or teach it on the item.</div>` : ''}
      ${!it ? `<select class="inp" data-f="cat" style="margin-top:8px;height:38px">${selectOptions(cats, r.category, '— pick a category —')}</select>` : ''}
    </div>`; }).join('');
}
ACT.xlCommit = async () => {
  const rows = XL.rows.filter(r => !r.drop && r.name); if (!rows.length){ toast('Nothing to add'); return; }
  const mm = rows.filter(r => xlResolve(r).mismatch); if (mm.length && !confirm(`${mm.length} row(s) have a unit that doesn't match stock — the number will go in as-is. Continue?`)) return;
  const word = { add:'added on top of stock', use:'taken OUT of stock as used', set:'used as the new count', none:'left untouched (items only)' }[XL.mode];
  if (!confirm(`${rows.length} rows — quantities will be ${word}. Continue?`)) return;
  const snap = { items: JSON.parse(JSON.stringify(state.inventoryItems)), log: JSON.parse(JSON.stringify(state.activityLog)), imp: JSON.parse(JSON.stringify(state.xlImports || {})) };
  const ds = XL.dateStr || todayStr(), ts0 = tsForDate(ds), who = currentUser(), src = XL.label || 'a pasted list';
  const reason = XL.mode === 'set' ? 'spot count' : XL.mode === 'use' ? `used — from ${src}` : `imported from ${src}`;
  let n = 0, created = 0;
  for (const r of rows){
    let id = r.matchId && state.inventoryItems[r.matchId] ? r.matchId : findMate(state.inventoryItems, r.name);
    const res = xlResolve(r), unit = canonUnit(res.unit || r.unit || ''); if (unit) rememberUnit(unit);
    let isNew = false;
    if (!id){ id = genId(); isNew = true; created++; state.inventoryItems[id] = { name:r.name, category:r.category || '', unit, quantity:0, price:null, lowAt:null, notes:'', daily:false, packUnit:null, packSize:null, updatedAt:ts0 }; }
    const it = state.inventoryItems[id], ts = ts0 + (n++) * 1000;
    if (r.category && isNew) it.category = r.category; if (unit && (isNew || !it.unit)) it.unit = unit; if (r.supplier && !it.supplier) it.supplier = r.supplier;
    const before = qtyOf(it), q = res.qty;
    let after = before;
    if (q != null && XL.mode !== 'none') after = XL.mode === 'set' ? r3(q) : XL.mode === 'use' ? r3(Math.max(0, before - q)) : r3(before + q);
    const takePrice = XL.applyPrices && r.price != null;
    const cover = XL.mode === 'add' && after > before ? coverAtReceipt(it, ts, stockAfterReceipt(it, ts, after - before)) : null;
    it.quantity = after; if (takePrice) it.rate = Number(r.price); it.updatedAt = ts;
    if (XL.mode === 'add' && after > before){ it.lastAddedAt = ts; it.lastAddedQty = r3(after - before); }
    const spend = XL.mode === 'add' && r.total != null ? Number(r.total) : 0;
    addLogEntry('inventory', isNew ? 'add' : 'update', it.name, `${XL.mode === 'use' ? 'used' : 'imported'} by ${who} from ${src} — ${before} ${it.unit || ''} → ${after} ${it.unit || ''}${spend ? ` · paid ₹${spend}` : ''}`,
      { ts, enteredAt: Date.now(), category: it.category || '', unit: it.unit || '', beforeQty: isNew ? null : before, afterQty: after, spent: spend, reason, kind: XL.mode === 'set' ? 'count' : '', cover });
  }
  state.xlImports = state.xlImports || {}; state.xlImports[XL.fingerprint] = { ts: Date.now(), by: who, rows: rows.length };
  closeSheet(); await saveState(); render();
  toast(`✓ ${rows.length} rows added${created ? ` · ${created} new items` : ''}`, async () => { state.inventoryItems = snap.items; state.activityLog = snap.log; state.xlImports = snap.imp; await saveState(); render(); toast('Import undone'); });
};
/* ════════════ SETTINGS ════════════ */

  render(){
    const people = peopleList(), owners = ownerNames();
    const notif = !('Notification' in window) ? 'Not supported on this browser' : Notification.permission === 'granted' ? 'On' : Notification.permission === 'denied' ? 'Blocked in phone settings' : 'Off';
    return `
      <div class="sec">People</div>
      <div class="list">${people.map(n => `<div class="li"><div class="ic" style="font-weight:800">${esc(initials(n))}</div><div class="mid"><div class="t">${esc(n)}</div><div class="s">${owners.includes(n.toLowerCase()) ? 'Owner view' : 'Staff view'}</div></div>
        <button class="btn sm ghost" data-act="toggleOwner" data-n="${esc(n)}">${owners.includes(n.toLowerCase()) ? 'Make staff' : 'Make owner'}</button>${n !== 'Sravya' ? `<button class="btn sm ghost" data-act="rmPerson" data-n="${esc(n)}">✕</button>` : ''}</div>`).join('')}
        <button class="li" data-act="addPersonOnly"><div class="ic">＋</div><div class="mid"><div class="t">Add a name</div></div></button></div>
      <p class="note">Owners see alerts, money and over-use first. Staff see big buttons for daily entries. The name picked on each phone decides which.</p>

      <div class="sec">Closing count reminder</div>
      <div class="card">
        <button class="toggle ${state.settings.closingReminderOn ? 'on' : ''}" data-act="toggleReminder"><span class="sw"></span><span class="tx">Remind to count at night<small>Shows a red banner after the time below</small></span></button>
        <div class="f"><label>Time</label><input type="time" id="remTime" value="${esc(state.settings.closingReminderTime || '21:00')}"></div>
        <button class="btn ghost block" data-act="notifPerm">📲 Phone notifications: ${esc(notif)}</button>
      </div>

      <div class="sec">Stock rules</div>
      <div class="list">
        <button class="li" data-act="roRules"><div class="ic">⚙️</div><div class="mid"><div class="t">Reorder rules</div><div class="s">Delivery time, buffer, order size</div></div>${ICON.chev}</button>
        <button class="li" data-act="lowByUnit"><div class="ic">⚠️</div><div class="mid"><div class="t">Low-stock levels by unit</div><div class="s">Set once for every kg item, every packet item…</div></div>${ICON.chev}</button>
        <button class="li" data-act="editPortions"><div class="ic">🍗</div><div class="mid"><div class="t">Portion chart</div><div class="s">What one plate or biryani takes from stock</div></div>${ICON.chev}</button>
        <button class="li" data-act="orderReview"><div class="ic">📦</div><div class="mid"><div class="t">Deliveries review</div><div class="s">Stop typo fixes counting as orders</div></div>${ICON.chev}</button>
        <button class="li" data-act="go" data-page="closing"><div class="ic">🌙</div><div class="mid"><div class="t">Nightly count items</div><div class="s">${closingItems().length} items chosen</div></div>${ICON.chev}</button>
      </div>

      <div class="sec">Data</div>
      <div class="list">
        <button class="li" data-act="backupJson"><div class="ic">💾</div><div class="mid"><div class="t">Download a backup</div><div class="s">Everything, as one JSON file</div></div></button>
        <button class="li" data-act="addStandard"><div class="ic">📋</div><div class="mid"><div class="t">Add missing standard items</div><div class="s">${STANDARD_ITEMS.length} common kitchen items, at zero stock</div></div></button>
      </div>
      <p class="note">Same data as the old inventory app (${esc(FIREBASE_PATH)}), so both can be used during the switch. ${Object.keys(state.activityLog).length} log entries · ${itemsList().length} items.</p>`;
  },
  after(){ const t = $('#remTime'); if (t) t.onchange = async () => { state.settings.closingReminderTime = t.value || '21:00'; await saveState(); toast('Reminder time saved'); }; }
};
ACT.toggleOwner = async a => {
  const n = a.dataset.n.toLowerCase(); let o = ownerNames().slice();
  if (o.includes(n)){ if (o.length === 1){ toast('At least one owner is needed'); return; } o = o.filter(x => x !== n); } else o.push(n);
  state.settings.owners = peopleList().filter(p => o.includes(p.toLowerCase())); await saveState(); render();
};
ACT.rmPerson = async a => { if (!confirm(`Remove ${a.dataset.n} from the list? Their past entries stay.`)) return; state.settings.people = (state.settings.people || []).filter(p => p !== a.dataset.n); await saveState(); render(); };
ACT.addPersonOnly = async () => { const name = String(prompt('Add a name:') || '').trim().replace(/\s+/g, ' ').slice(0, 24); if (!name || peopleList().some(n => n.toLowerCase() === name.toLowerCase())) return; state.settings.people = Array.isArray(state.settings.people) ? state.settings.people : []; state.settings.people.push(name); await saveState(); render(); };
ACT.toggleReminder = async () => { state.settings.closingReminderOn = !state.settings.closingReminderOn; await saveState(); render(); };
ACT.notifPerm = async () => { if (!('Notification' in window)) return; const r = await Notification.requestPermission(); render(); if (r === 'granted') toast('Notifications on — keep the app on your Home Screen'); };
ACT.backupJson = () => downloadBlob(new Blob([JSON.stringify(state, null, 1)], { type:'application/json' }), `onestop-inventory-backup-${todayStr()}.json`);
ACT.addStandard = async () => {
  const missing = STANDARD_ITEMS.filter(s => !findMate(state.inventoryItems, s.name));
  if (!missing.length){ toast('All standard items are already there'); return; }
  if (!confirm(`Add ${missing.length} standard items at zero stock?`)) return;

  addLogEntry('inventory', 'add', `Standard list (${missing.length} items)`, `loaded by ${currentUser()}`, {});

};
ACT.lowByUnit = () => {
  const counts = {}; for (const [, it] of itemsList()){ const c = canonUnit(it.unit) || '(no unit)'; counts[c] = (counts[c] || 0) + 1; }
  const saved = state.lowStockDefaults || {}, def = k => { k = k.toLowerCase(); return k === 'kg' || k === 'l' ? 1 : k === 'pieces' ? 60 : k === 'packets' ? 32 : ''; };
  const units = Object.keys(counts).sort((a,b) => counts[b] - counts[a]);
  openSheet({ title:'Low-stock levels', sub:'Applies to every item in that unit — blank leaves it alone', body: `<div class="list">${units.map(u => `<div class="li"><div class="mid"><div class="t">${esc(u)}</div><div class="s">${counts[u]} items</div></div><span class="muted" style="font-size:12px">below</span><input class="inp lu" data-u="${esc(u.toLowerCase())}" inputmode="decimal" value="${esc(saved[u.toLowerCase()] ?? def(u))}" style="width:80px;height:38px;text-align:center"></div>`).join('')}</div>`,
    foot:'<button class="btn primary block" data-act="lowSave">Apply to items</button>' });

ACT.lowSave = async () => {
  const per = {}; $$('.lu').forEach(i => { const v = i.value.trim(); per[i.dataset.u] = v === '' ? null : Number(v); });
  let n = 0; for (const [, it] of itemsList()){ const k = (canonUnit(it.unit) || '(no unit)').toLowerCase(); const th = per[k]; if (th == null || !isFinite(th)) continue; if (it.lowAt !== th){ it.lowAt = th; n++; } }
  state.lowStockDefaults = Object.assign({}, state.lowStockDefaults || {}, Object.fromEntries(Object.entries(per).filter(([, v]) => v != null)));
  addLogEntry('inventory', 'update', 'Low-stock alerts', `set by unit for ${n} items`, {});
  closeSheet(); await saveState(); render(); toast(`Low level set on ${n} items`);

/* ════════════ BOOT ════════════ */
function maybeNotify(){
  if (!('Notification' in window) || Notification.permission !== 'granted' || !reminderIsDue()) return;
  if (localStorage.getItem(LS_NOTIFIED) === todayStr()) return;
  try { new Notification('OneStop DriveIn', { body:"🌙 Time to enter tonight's closing stock." }); localStorage.setItem(LS_NOTIFIED, todayStr()); } catch(e){}
}
(async function boot(){
  $('#main').innerHTML = '<div class="empty"><div class="big">⏳</div><b>Loading stock…</b></div>';
  await loadState();
  render();
  startSync();
  setInterval(() => { maybeNotify(); if (route.page === 'home' && !sheetOpen()) { const a = document.activeElement; if (!(a && ['INPUT','TEXTAREA','SELECT'].includes(a.tagName))) render(); } }, 60000);

})();
